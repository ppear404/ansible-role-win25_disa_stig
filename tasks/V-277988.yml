---
- name: V-277988 - Windows Server 2025 members of the Backup Operators group must have separate accounts for backup
    duties and normal operational tasks.
  when:
    - win25_stig_v_277988 | bool
    - '''V-277988'' not in win25_stig_exceptions'
  tags:
    - V-277988
    - CAT2
  block:
    - name: V-277988 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277988''] }}'
