# SPDX-License-Identifier: MIT-0
---
- name: 'V-278202 - The Windows Server 2025 setting Domain member: Digitally sign secure channel data (when possible)
    must be configured to Enabled.'
  when:
    - win25_stig_v_278202 | bool
    - '''V-278202'' not in win25_stig_exceptions'
  tags:
    - V-278202
    - CAT2
  block:
    - name: 'The Windows Server 2025 setting Domain member: Digitally sign secure channel data (when possible) must
        be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: SignSecureChannel
        data: 1
        type: dword
      notify: Record Windows restart requirement
