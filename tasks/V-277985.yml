# SPDX-License-Identifier: MIT-0
---
- name: V-277985 - Windows Server 2025 users with administrative privileges must have separate accounts for administrative
    duties and normal operational tasks.
  when:
    - win25_stig_v_277985 | bool
    - '''V-277985'' not in win25_stig_exceptions'
  tags:
    - V-277985
    - CAT2
  block:
    - name: V-277985 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277985''] }}'
      when: not (win25_stig_manual_reviews.get('V-277985', {}).get('Valid', false) | bool)
