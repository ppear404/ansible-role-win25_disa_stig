# SPDX-License-Identifier: MIT-0
---
- name: V-277997 - Windows Server 2025 local volumes must use a format that supports New Technology File System
    (NTFS) attributes.
  when:
    - win25_stig_v_277997 | bool
    - '''V-277997'' not in win25_stig_exceptions'
  tags:
    - V-277997
    - CAT1
  block:
    - name: V-277997 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277997''] }}'
