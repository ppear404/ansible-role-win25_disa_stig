# SPDX-License-Identifier: MIT-0
---
- name: V-278167 - The Windows Server 2025 "Allow log on through Remote Desktop Services" user right must only be
    assigned to the Administrators group on domain controllers.
  when:
    - win25_stig_v_278167 | bool
    - win25_stig_is_dc
    - '''V-278167'' not in win25_stig_exceptions'
  tags:
    - V-278167
    - CAT2
  block:
    - name: The Windows Server 2025 "Allow log on through Remote Desktop Services" user right must only be assigned
        to the Administrators group on domain controllers.
      ansible.windows.win_user_right:
        name: SeRemoteInteractiveLogonRight
        users:
          - S-1-5-32-544
        action: set
