# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278125 - Windows Server 2025 Windows Remote Management (WinRM) client must not use Basic authentication.
  when:
    - win25_stig_v_278125 | bool
    - '''V-278125'' not in win25_stig_exceptions'
  tags:
    - V-278125
    - CAT1
  block:
    - name: CAT1 V-278125 - Windows Server 2025 Windows Remote Management (WinRM) client must not use Basic authentication.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
        name: AllowBasic
        data: 0
        type: dword
      notify: Record Windows restart requirement
