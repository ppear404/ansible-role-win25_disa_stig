# SPDX-License-Identifier: MIT-0
---
- name: V-278244 - The Windows Server 2025 "Back up files and directories" user right must only be assigned to the
    Administrators group.
  when:
    - win25_stig_v_278244 | bool
    - '''V-278244'' not in win25_stig_exceptions'
  tags:
    - V-278244
    - CAT2
  block:
    - name: The Windows Server 2025 "Back up files and directories" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeBackupPrivilege
        users:
          - S-1-5-32-544
        action: set
