# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278089 - Windows Server 2025 must be configured to enable Remote host allows delegation of nonexportable
    credentials.
  when:
    - win25_stig_v_278089 | bool
    - '''V-278089'' not in win25_stig_exceptions'
  tags:
    - V-278089
    - CAT2
  block:
    - name: CAT2 V-278089 - Windows Server 2025 must be configured to enable Remote host allows delegation of nonexportable credentials.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation
        name: AllowProtectedCreds
        data: 1
        type: dword
      notify: Record Windows restart requirement
