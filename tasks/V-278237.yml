# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278237 - Windows Server 2025 User Account Control (UAC) must only elevate UIAccess applications that are
    installed in secure locations.
  when:
    - win25_stig_v_278237 | bool
    - '''V-278237'' not in win25_stig_exceptions'
  tags:
    - V-278237
    - CAT2
  block:
    - name: CAT2 V-278237 - Windows Server 2025 User Account Control (UAC) must only elevate UIAccess applications that are installed
        in secure locations.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: EnableSecureUIAPaths
        data: 1
        type: dword
      notify: Record Windows restart requirement
