# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278196 - Windows Server 2025 must prevent local accounts with blank passwords from being used from the
    network.
  when:
    - win25_stig_v_278196 | bool
    - '''V-278196'' not in win25_stig_exceptions'
  tags:
    - V-278196
    - CAT1
  block:
    - name: CAT1 V-278196 - Windows Server 2025 must prevent local accounts with blank passwords from being used from the network.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: LimitBlankPasswordUse
        data: 1
        type: dword
      notify: Record Windows restart requirement
