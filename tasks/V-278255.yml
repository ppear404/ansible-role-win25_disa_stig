# SPDX-License-Identifier: MIT-0
---
- name: V-278255 - The Windows Server 2025 "Load and unload device drivers" user right must only be assigned to
    the Administrators group.
  when:
    - win25_stig_v_278255 | bool
    - '''V-278255'' not in win25_stig_exceptions'
  tags:
    - V-278255
    - CAT2
  block:
    - name: The Windows Server 2025 "Load and unload device drivers" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeLoadDriverPrivilege
        users:
          - S-1-5-32-544
        action: set
