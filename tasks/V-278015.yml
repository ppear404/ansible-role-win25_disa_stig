# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278015 - Windows Server 2025 must not have the Fax Server role installed.
  when:
    - win25_stig_v_278015 | bool
    - '''V-278015'' not in win25_stig_exceptions'
  tags:
    - V-278015
    - CAT2
  block:
    - name: CAT2 V-278015 - Windows Server 2025 must not have the Fax Server role installed.
      ansible.windows.win_feature:
        name: '{{ item }}'
        state: absent
      loop:
        - Fax
      when: item in win25_stig_available_features
      notify: Record Windows restart requirement
