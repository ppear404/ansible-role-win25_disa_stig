# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278168 - The Windows Server 2025 "Deny access to this computer from the network" user right on domain
    controllers must be configured to prevent unauthenticated access.
  when:
    - win25_stig_v_278168 | bool
    - win25_stig_is_dc
    - '''V-278168'' not in win25_stig_exceptions'
  tags:
    - V-278168
    - CAT2
  block:
    - name: CAT2 V-278168 - The Windows Server 2025 "Deny access to this computer from the network" user right on domain controllers
        must be configured to prevent unauthenticated access.
      ansible.windows.win_user_right:
        name: SeDenyNetworkLogonRight
        users:
          - S-1-5-32-546
        action: add
