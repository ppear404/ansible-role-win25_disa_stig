# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278112 - Windows Server 2025 must not save passwords in the Remote Desktop Client.
  when:
    - win25_stig_v_278112 | bool
    - '''V-278112'' not in win25_stig_exceptions'
  tags:
    - V-278112
    - CAT2
  block:
    - name: CAT2 V-278112 - Windows Server 2025 must not save passwords in the Remote Desktop Client.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name: DisablePasswordSaving
        data: 1
        type: dword
      notify: Record Windows restart requirement
