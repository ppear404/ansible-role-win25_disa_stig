# SPDX-License-Identifier: MIT-0
---
- name: V-277990 - Windows Server 2025 manually managed application account passwords must be changed at least annually
    or when a system administrator with knowledge of the password leaves the organization.
  when:
    - win25_stig_v_277990 | bool
    - '''V-277990'' not in win25_stig_exceptions'
  tags:
    - V-277990
    - CAT2
  block:
    - name: V-277990 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277990''] }}'
      when: not (win25_stig_manual_reviews.get('V-277990', {}).get('Valid', false) | bool)
