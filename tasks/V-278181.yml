# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278181 - Windows Server 2025 must limit the caching of logon credentials to four or less on domain-joined
    member servers.
  when:
    - win25_stig_v_278181 | bool
    - not win25_stig_is_dc
    - win25_stig_domain_joined
    - '''V-278181'' not in win25_stig_exceptions'
  tags:
    - V-278181
    - CAT2
  block:
    - name: CAT2 V-278181 - Windows Server 2025 must limit the caching of logon credentials to four or less on domain-joined member
        servers.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name: CachedLogonsCount
        data: '4'
        type: string
      notify: Record Windows restart requirement
