# SPDX-License-Identifier: MIT-0
---
- name: V-278099 - Windows Server 2025 AutoPlay must be turned off for nonvolume devices.
  when:
    - win25_stig_v_278099 | bool
    - '''V-278099'' not in win25_stig_exceptions'
  tags:
    - V-278099
    - CAT1
  block:
    - name: Windows Server 2025 AutoPlay must be turned off for nonvolume devices.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
        name: NoAutoplayfornonVolume
        data: 1
        type: dword
      notify: Record Windows restart requirement
