# SPDX-License-Identifier: MIT-0
---
- name: V-278243 - The Windows Server 2025 "Allow log on locally" user right must only be assigned to the Administrators
    group.
  when:
    - win25_stig_v_278243 | bool
    - '''V-278243'' not in win25_stig_exceptions'
  tags:
    - V-278243
    - CAT2
  block:
    - name: The Windows Server 2025 "Allow log on locally" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeInteractiveLogonRight
        users:
          - S-1-5-32-544
        action: set
