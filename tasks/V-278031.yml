# SPDX-License-Identifier: MIT-0
---
- name: V-278031 - Windows Server 2025 systems must have Unified Extensible Firmware Interface (UEFI) firmware and
    be configured to run in UEFI mode, not Legacy BIOS.
  when:
    - win25_stig_v_278031 | bool
    - '''V-278031'' not in win25_stig_exceptions'
  tags:
    - V-278031
    - CAT2
  block:
    - name: V-278031 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278031''] }}'
