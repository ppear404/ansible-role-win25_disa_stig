# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278206 - Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system
    with the screen saver.
  when:
    - win25_stig_v_278206 | bool
    - '''V-278206'' not in win25_stig_exceptions'
  tags:
    - V-278206
    - CAT2
  block:
    - name: CAT2 V-278206 - Windows Server 2025 machine inactivity limit must be set to 15 minutes or less, locking the system with
        the screen saver.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: InactivityTimeoutSecs
        data: 900
        type: dword
      notify: Record Windows restart requirement
