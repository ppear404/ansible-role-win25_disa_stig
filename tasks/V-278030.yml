# SPDX-License-Identifier: MIT-0
---
- name: V-278030 - Windows Server 2025 must have orphaned security identifiers (SIDs) removed from user rights.
  when:
    - win25_stig_v_278030 | bool
    - '''V-278030'' not in win25_stig_exceptions'
  tags:
    - V-278030
    - CAT2
  block:
    - name: V-278030 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278030''] }}'
