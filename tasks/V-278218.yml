# SPDX-License-Identifier: MIT-0
---
- name: V-278218 - Windows Server 2025 must be configured to prevent anonymous users from having the same permissions
    as the Everyone group.
  when:
    - win25_stig_v_278218 | bool
    - '''V-278218'' not in win25_stig_exceptions'
  tags:
    - V-278218
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to prevent anonymous users from having the same permissions as
        the Everyone group.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: EveryoneIncludesAnonymous
        data: 0
        type: dword
      notify: Record Windows restart requirement
