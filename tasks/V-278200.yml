# SPDX-License-Identifier: MIT-0
---
- name: 'CAT2 V-278200 - The Windows Server 2025 setting Domain member: Digitally encrypt or sign secure channel data
    (always) must be configured to Enabled.'
  when:
    - win25_stig_v_278200 | bool
    - '''V-278200'' not in win25_stig_exceptions'
  tags:
    - V-278200
    - CAT2
  block:
    - name: 'CAT2 V-278200 - The Windows Server 2025 setting Domain member: Digitally encrypt or sign secure channel data (always)
        must be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: RequireSignOrSeal
        data: 1
        type: dword
      notify: Record Windows restart requirement
