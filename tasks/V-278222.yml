# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278222 - Windows Server 2025 must prevent PKU2U authentication using online identities.
  when:
    - win25_stig_v_278222 | bool
    - '''V-278222'' not in win25_stig_exceptions'
  tags:
    - V-278222
    - CAT2
  block:
    - name: CAT2 V-278222 - Windows Server 2025 must prevent PKU2U authentication using online identities.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\LSA\pku2u
        name: AllowOnlineID
        data: 0
        type: dword
      notify: Record Windows restart requirement
