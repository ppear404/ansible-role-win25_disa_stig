---
- name: CAT2 V-278080 - Windows Server 2025 must prevent the display of slide shows on the lock screen.
  when:
    - win25_stig_v_278080 | bool
    - '''V-278080'' not in win25_stig_exceptions'
  tags:
    - V-278080
    - CAT2
  block:
    - name: CAT2 V-278080 - Windows Server 2025 must prevent the display of slide shows on the lock screen.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
        name: NoLockScreenSlideshow
        data: 1
        type: dword
      notify: Record Windows restart requirement
