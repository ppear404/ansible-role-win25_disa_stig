# SPDX-License-Identifier: MIT-0
---
- name: V-277992 - Windows Server 2025 must employ a deny-all, permit-by-exception policy to allow the execution
    of authorized software programs.
  when:
    - win25_stig_v_277992 | bool
    - '''V-277992'' not in win25_stig_exceptions'
  tags:
    - V-277992
    - CAT2
  block:
    - name: V-277992 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277992''] }}'
      when: not (win25_stig_manual_reviews.get('V-277992', {}).get('Valid', false) | bool)
