  when:
    - win25_stig_v_277986 | bool
    - '''V-277986'' not in win25_stig_exceptions'
  tags:
    - V-277986
    - CAT2
  block:
    - name: V-277986 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277986''] }}'
