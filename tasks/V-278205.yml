# SPDX-License-Identifier: MIT-0
---
- name: V-278205 - Windows Server 2025 must be configured to require a strong session key.
  when:
    - win25_stig_v_278205 | bool
    - '''V-278205'' not in win25_stig_exceptions'
  tags:
    - V-278205
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to require a strong session key.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: RequireStrongKey
        data: 1
        type: dword
      notify: Record Windows restart requirement
