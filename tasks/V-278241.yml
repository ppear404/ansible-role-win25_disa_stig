# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278241 - The Windows Server 2025 "Access Credential Manager as a trusted caller" user right must not be
    assigned to any groups or accounts.
  when:
    - win25_stig_v_278241 | bool
    - '''V-278241'' not in win25_stig_exceptions'
  tags:
    - V-278241
    - CAT2
  block:
    - name: CAT2 V-278241 - The Windows Server 2025 "Access Credential Manager as a trusted caller" user right must not be assigned
        to any groups or accounts.
      ansible.windows.win_user_right:
        name: SeTrustedCredManAccessPrivilege
        users: []
        action: set
