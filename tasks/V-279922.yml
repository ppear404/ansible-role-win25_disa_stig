# SPDX-License-Identifier: MIT-0
---
- name: V-279922 - Windows Server 2025 must be configured to audit sensitive privilege use successes.
  when:
    - win25_stig_v_279922 | bool
    - '''V-279922'' not in win25_stig_exceptions'
  tags:
    - V-279922
    - CAT2
  block:
    - name: V-279922 - Configure audit subcategory
      ansible.windows.win_audit_policy_system:
        subcategory: Sensitive Privilege Use
        audit_type:
          - success
          - failure
