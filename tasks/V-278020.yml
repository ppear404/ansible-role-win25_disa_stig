# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278020 - Windows Server 2025 must not have Simple TCP/IP Services installed.
  when:
    - win25_stig_v_278020 | bool
    - '''V-278020'' not in win25_stig_exceptions'
  tags:
    - V-278020
    - CAT2
  block:
    - name: CAT2 V-278020 - Windows Server 2025 must not have Simple TCP/IP Services installed.
      ansible.windows.win_feature:
        name: '{{ item }}'
        state: absent
      loop:
        - Simple-TCPIP
      when: item in win25_stig_available_features
      notify: Record Windows restart requirement
