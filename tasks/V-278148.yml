---
- name: V-278148 - Windows Server 2025 Active Directory Group Policy Objects (GPOs) must be configured with proper
    audit settings.
  when:
    - win25_stig_v_278148 | bool
    - win25_stig_is_dc
    - '''V-278148'' not in win25_stig_exceptions'
  tags:
    - V-278148
    - CAT2
  block:
    - name: V-278148 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278148''] }}'
