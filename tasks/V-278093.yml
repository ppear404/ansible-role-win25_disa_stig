# SPDX-License-Identifier: MIT-0
---
- name: V-278093 - Windows Server 2025 downloading print driver packages over HTTP must be turned off.
  when:
    - win25_stig_v_278093 | bool
    - '''V-278093'' not in win25_stig_exceptions'
  tags:
    - V-278093
    - CAT2
  block:
    - name: Windows Server 2025 downloading print driver packages over HTTP must be turned off.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers
        name: DisableWebPnPDownload
        data: 1
        type: dword
      notify: Record Windows restart requirement
