# SPDX-License-Identifier: MIT-0
---
- name: V-278094 - Windows Server 2025 printing over HTTP must be turned off.
  when:
    - win25_stig_v_278094 | bool
    - '''V-278094'' not in win25_stig_exceptions'
  tags:
    - V-278094
    - CAT2
  block:
    - name: Windows Server 2025 printing over HTTP must be turned off.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers
        name: DisableHTTPPrinting
        data: 1
        type: dword
      notify: Record Windows restart requirement
