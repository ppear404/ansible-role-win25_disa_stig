# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278104 - Windows Server 2025 Windows Update must not obtain updates from other PCs on the internet.
  when:
    - win25_stig_v_278104 | bool
    - '''V-278104'' not in win25_stig_exceptions'
  tags:
    - V-278104
    - CAT3
  block:
    - name: CAT3 V-278104 - Windows Server 2025 Windows Update must not obtain updates from other PCs on the internet.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
        name: DODownloadMode
        data: 0
        type: dword
      notify: Record Windows restart requirement
