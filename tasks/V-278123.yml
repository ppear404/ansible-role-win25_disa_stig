# SPDX-License-Identifier: MIT-0
---
- name: V-278123 - Windows Server 2025 must disable automatically signing in the last interactive user after a system-initiated
    restart.
  when:
    - win25_stig_v_278123 | bool
    - '''V-278123'' not in win25_stig_exceptions'
  tags:
    - V-278123
    - CAT2
  block:
    - name: Windows Server 2025 must disable automatically signing in the last interactive user after a system-initiated
        restart.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: DisableAutomaticRestartSignOn
        data: 1
        type: dword
      notify: Record Windows restart requirement
