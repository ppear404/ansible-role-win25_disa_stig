---
- name: V-278012 - Windows Server 2025 must have a host-based firewall installed and enabled.
  when:
    - win25_stig_v_278012 | bool
    - '''V-278012'' not in win25_stig_exceptions'
  tags:
    - V-278012
    - CAT2
  block:
    - name: Preserve the active Ansible management port before enabling the firewall
      ansible.windows.win_firewall_rule:
        name: Ansible STIG management connection
        description: Preserve the Ansible management connection during STIG remediation
        direction: in
        action: allow
        enabled: true
        protocol: tcp
        localport: >-
          {{ ansible_port | default(22 if ansible_connection | default('ssh') == 'ssh'
             else (5985 if ansible_winrm_scheme | default('https') == 'http' else 5986)) }}
        remoteip: '{{ win25_stig_management_remote_addresses }}'
        profiles: [domain, private, public]
        state: present
    - name: Windows Server 2025 must have a host-based firewall installed and enabled.
      ansible.windows.win_firewall:
        state: enabled
        profiles:
          - Domain
          - Private
          - Public
