# SPDX-License-Identifier: MIT-0
---
- name: V-278142 - Windows Server 2025 organization created Active Directory Organizational Unit (OU) objects must
    have proper access control permissions.
  when:
    - win25_stig_v_278142 | bool
    - win25_stig_is_dc
    - '''V-278142'' not in win25_stig_exceptions'
  tags:
    - V-278142
    - CAT1
  block:
    - name: V-278142 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278142''] }}'
