# SPDX-License-Identifier: MIT-0
---
- name: 'V-278213 - The Windows Server 2025 setting Microsoft network server: Digitally sign communications (always)
    must be configured to Enabled.'
  when:
    - win25_stig_v_278213 | bool
    - '''V-278213'' not in win25_stig_exceptions'
  tags:
    - V-278213
    - CAT2
  block:
    - name: 'The Windows Server 2025 setting Microsoft network server: Digitally sign communications (always) must
        be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name: RequireSecuritySignature
        data: 1
        type: dword
      notify: Record Windows restart requirement
