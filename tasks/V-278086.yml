# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278086 - Windows Server 2025 insecure logons to an SMB server must be disabled.
  when:
    - win25_stig_v_278086 | bool
    - '''V-278086'' not in win25_stig_exceptions'
  tags:
    - V-278086
    - CAT2
  block:
    - name: CAT2 V-278086 - Windows Server 2025 insecure logons to an SMB server must be disabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation
        name: AllowInsecureGuestAuth
        data: 0
        type: dword
      notify: Record Windows restart requirement
