# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278078 - Windows Server 2025 must be configured to audit System - System Integrity successes.
  when:
    - win25_stig_v_278078 | bool
    - '''V-278078'' not in win25_stig_exceptions'
  tags:
    - V-278078
    - CAT2
  block:
    - name: CAT2 V-278078 - Windows Server 2025 must be configured to audit System - System Integrity successes.
      ansible.windows.win_audit_policy_system:
        subcategory: System Integrity
        audit_type:
          - failure
          - success
