# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278101 - Windows Server 2025 AutoPlay must be disabled for all drives.
  when:
    - win25_stig_v_278101 | bool
    - '''V-278101'' not in win25_stig_exceptions'
  tags:
    - V-278101
    - CAT1
  block:
    - name: CAT1 V-278101 - Windows Server 2025 AutoPlay must be disabled for all drives.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\policies\Explorer
        name: NoDriveTypeAutoRun
        data: 255
        type: dword
      notify: Record Windows restart requirement
