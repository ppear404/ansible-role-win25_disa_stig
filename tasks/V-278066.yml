# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278066 - Windows Server 2025 must be configured to audit Policy Change - Audit Policy Change successes.
  when:
    - win25_stig_v_278066 | bool
    - '''V-278066'' not in win25_stig_exceptions'
  tags:
    - V-278066
    - CAT2
  block:
    - name: CAT2 V-278066 - Windows Server 2025 must be configured to audit Policy Change - Audit Policy Change successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Audit Policy Change
        audit_type:
          - failure
          - success
