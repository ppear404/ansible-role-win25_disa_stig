# SPDX-License-Identifier: MIT-0
---
- name: V-278236 - Windows Server 2025 User Account Control (UAC) must be configured to detect application installations
    and prompt for elevation.
  when:
    - win25_stig_v_278236 | bool
    - '''V-278236'' not in win25_stig_exceptions'
  tags:
    - V-278236
    - CAT2
  block:
    - name: Windows Server 2025 User Account Control (UAC) must be configured to detect application installations
        and prompt for elevation.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: EnableInstallerDetection
        data: 1
        type: dword
      notify: Record Windows restart requirement
