# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278116 - Windows Server 2025 Remote Desktop Services must be configured with the client connection encryption
    set to High Level.
  when:
    - win25_stig_v_278116 | bool
    - '''V-278116'' not in win25_stig_exceptions'
  tags:
    - V-278116
    - CAT2
  block:
    - name: CAT2 V-278116 - Windows Server 2025 Remote Desktop Services must be configured with the client connection encryption
        set to High Level.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name: MinEncryptionLevel
        data: 3
        type: dword
      notify: Record Windows restart requirement
