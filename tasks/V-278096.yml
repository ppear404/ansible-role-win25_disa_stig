# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278096 - Windows Server 2025 users must be prompted to authenticate when the system wakes from sleep (on
    battery).
  when:
    - win25_stig_v_278096 | bool
    - '''V-278096'' not in win25_stig_exceptions'
  tags:
    - V-278096
    - CAT2
  block:
    - name: CAT2 V-278096 - Windows Server 2025 users must be prompted to authenticate when the system wakes from sleep (on battery).
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51
        name: DCSettingIndex
        data: 1
        type: dword
      notify: Record Windows restart requirement
