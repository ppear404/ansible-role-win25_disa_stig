# SPDX-License-Identifier: MIT-0
---
- name: V-278163 - Windows Server 2025 domain controllers must require LDAP access signing.
  when:
    - win25_stig_v_278163 | bool
    - win25_stig_is_dc
    - '''V-278163'' not in win25_stig_exceptions'
  tags:
    - V-278163
    - CAT2
  block:
    - name: Windows Server 2025 domain controllers must require LDAP access signing.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name: LDAPServerEnforceIntegrity
        data: 1
        type: dword
      notify: Record Windows restart requirement
