# SPDX-License-Identifier: MIT-0
---
- name: V-278256 - The Windows Server 2025 "Lock pages in memory" user right must not be assigned to any groups
    or accounts.
  when:
    - win25_stig_v_278256 | bool
    - '''V-278256'' not in win25_stig_exceptions'
  tags:
    - V-278256
    - CAT2
  block:
    - name: The Windows Server 2025 "Lock pages in memory" user right must not be assigned to any groups or accounts.
      ansible.windows.win_user_right:
        name: SeLockMemoryPrivilege
        users: []
        action: set
