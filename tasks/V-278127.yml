# SPDX-License-Identifier: MIT-0
---
- name: V-278127 - Windows Server 2025 Windows Remote Management (WinRM) client must not use Digest authentication.
  when:
    - win25_stig_v_278127 | bool
    - '''V-278127'' not in win25_stig_exceptions'
  tags:
    - V-278127
    - CAT2
  block:
    - name: Windows Server 2025 Windows Remote Management (WinRM) client must not use Digest authentication.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
        name: AllowDigest
        data: 0
        type: dword
      notify: Record Windows restart requirement
