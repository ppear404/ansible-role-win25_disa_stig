    - win25_stig_v_278050 | bool
    - '''V-278050'' not in win25_stig_exceptions'
  tags:
    - V-278050
    - CAT2
  block:
    - name: CAT2 V-278050 - Windows Server 2025 must be configured to audit Account Management - Security Group Management successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Security Group Management
        audit_type:
          - success
