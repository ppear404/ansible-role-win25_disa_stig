---
- name: V-278153 - Windows Server 2025 Active Directory (AD) RID Manager$ object must be configured with proper
    audit settings.
  when:
    - win25_stig_v_278153 | bool
    - win25_stig_is_dc
    - '''V-278153'' not in win25_stig_exceptions'
  tags:
    - V-278153
    - CAT2
  block:
    - name: V-278153 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278153''] }}'
