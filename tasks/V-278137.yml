# SPDX-License-Identifier: MIT-0
---
- name: V-278137 - Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes
    or less.
  when:
    - win25_stig_v_278137 | bool
    - win25_stig_is_dc
    - '''V-278137'' not in win25_stig_exceptions'
  tags:
    - V-278137
    - CAT2
  block:
    - name: V-278137 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278137''] }}'
