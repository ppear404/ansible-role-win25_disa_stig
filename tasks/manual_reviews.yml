# SPDX-License-Identifier: MIT-0
---
- name: Load scoped custom checks for manual controls
  ansible.builtin.include_vars:
    file: '{{ role_path }}/files/answer_files/manual/policies.json'
    name: win25_stig_manual_control_policies
- name: Select enabled requested manual controls
  ansible.builtin.set_fact:
    win25_stig_selected_manual_controls: >-
      {%- set selected = namespace(ids=[]) -%}
      {%- for id in win25_stig_manual_control_policies -%}
      {%- set category = 'CAT' + {'high': '1', 'medium': '2', 'low': '3'}[
          win25_stig_control_manifest[id].severity] -%}
      {%- if lookup('ansible.builtin.vars', 'win25_stig_' + (id | lower | replace('-', '_'))) | bool
          and lookup('ansible.builtin.vars', 'win25_stig_' + (category | lower)) | bool
          and id not in win25_stig_exceptions and id not in ansible_skip_tags
          and category not in ansible_skip_tags
          and ('all' in ansible_run_tags or id in ansible_run_tags or category in ansible_run_tags) -%}
      {%- set selected.ids = selected.ids + [id] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ selected.ids }}
- name: Validate the environment time-source variable
  ansible.builtin.assert:
    that:
      - win25_stig_time_source is string
      - win25_stig_time_source | length == 0 or win25_stig_time_source is match('^[A-Za-z0-9][A-Za-z0-9.:-]*$')
- name: Resolve the effective per-host policy register
  ansible.builtin.set_fact:
    win25_stig_effective_site_register: >-
      {{ (lookup('ansible.builtin.file', role_path + '/files/answer_files/manual/site-register.json') | from_json)
         | combine({'approved_ntp_sources': [win25_stig_time_source] if win25_stig_time_source | length > 0 else []}) }}
- name: Configure the environment time source before reviewing V-278029
  ansible.builtin.import_tasks: configure_time_source.yml
  when:
    - "'V-278029' in win25_stig_selected_manual_controls"
    - win25_stig_time_source | length > 0
- name: Create security-plan procedure directory
  ansible.windows.win_file:
    path: 'C:\ProgramData\win25-stig\Policy'
    state: directory
  when: win25_stig_selected_manual_controls | length > 0
- name: Deploy security-plan procedures and per-host register
  ansible.windows.win_copy:
    src: 'answer_files/manual/{{ item }}'
    dest: 'C:\ProgramData\win25-stig\Policy\{{ item }}'
  loop:
    - SecurityPlanProcedures.md
  when: win25_stig_selected_manual_controls | length > 0
- name: Deploy the effective per-host register
  ansible.windows.win_copy:
    content: '{{ win25_stig_effective_site_register | to_nice_json }}'
    dest: 'C:\ProgramData\win25-stig\Policy\site-register.json'
  when: win25_stig_selected_manual_controls | length > 0
- name: Run read-only scoped manual-control reviews
  ansible.windows.win_powershell:
    parameters:
      Source: "{{ lookup('ansible.builtin.file', role_path + '/files/answer_files/manual/ManualChecks.ps1') }}"
      Register: '{{ win25_stig_effective_site_register | to_json }}'
      Controls: '{{ win25_stig_selected_manual_controls | to_json }}'
    script: |
      param([string]$Source, [string]$Register, [string]$Controls)
      $Ansible.Changed = $false
      . ([scriptblock]::Create($Source))
      $Policy=@{}
      ($Register | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $Policy[$_.Name]=$_.Value }
      $results = @{}
      foreach ($control in ($Controls | ConvertFrom-Json)) {
          $result = Invoke-ScopedManualReview -Control $control -Policy $Policy
          if ($result -isnot [hashtable] -or $result.Valid -isnot [bool] -or $result.Results -isnot [string]) {
              throw "Invalid custom-check contract for $control"
          }
          $results[$control] = $result
      }
      $Ansible.Result = $results
  register: win25_stig_manual_review_probe
  check_mode: false
  when: win25_stig_selected_manual_controls | length > 0
- name: Retain review decisions for individual control tasks
  ansible.builtin.set_fact:
    win25_stig_manual_reviews: '{{ win25_stig_manual_review_probe.result | default({}) }}'
- name: Record custom checks that still require remediation
  ansible.builtin.set_fact:
    win25_stig_pending_controls: '{{ win25_stig_pending_controls + [item.key] }}'
  loop: '{{ win25_stig_manual_reviews | dict2items }}'
  when: not (item.value.Valid | bool)
  loop_control:
    label: '{{ item.key }}'
