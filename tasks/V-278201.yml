# SPDX-License-Identifier: MIT-0
---
- name: 'CAT2 V-278201 - Windows Server 2025 setting Domain member: Digitally encrypt secure channel data (when possible)
    must be configured to Enabled.'
  when:
    - win25_stig_v_278201 | bool
    - '''V-278201'' not in win25_stig_exceptions'
  tags:
    - V-278201
    - CAT2
  block:
    - name: 'CAT2 V-278201 - Windows Server 2025 setting Domain member: Digitally encrypt secure channel data (when possible) must
        be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: SealSecureChannel
        data: 1
        type: dword
      notify: Record Windows restart requirement
