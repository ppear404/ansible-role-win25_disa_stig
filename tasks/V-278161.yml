# SPDX-License-Identifier: MIT-0
---
- name: V-278161 - Windows Server 2025 PKI certificates associated with user accounts must be issued by a DoW PKI
    or an approved External Certificate Authority (ECA).
  when:
    - win25_stig_v_278161 | bool
    - win25_stig_is_dc
    - '''V-278161'' not in win25_stig_exceptions'
  tags:
    - V-278161
    - CAT1
  block:
    - name: V-278161 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278161''] }}'
