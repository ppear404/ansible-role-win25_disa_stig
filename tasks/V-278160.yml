# SPDX-License-Identifier: MIT-0
---
- name: V-278160 - Windows Server 2025 domain Controller PKI certificates must be issued by the DoW PKI or an approved
    External Certificate Authority (ECA).
  when:
    - win25_stig_v_278160 | bool
    - win25_stig_is_dc
    - '''V-278160'' not in win25_stig_exceptions'
  tags:
    - V-278160
    - CAT1
  block:
    - name: V-278160 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278160''] }}'
