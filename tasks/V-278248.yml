# SPDX-License-Identifier: MIT-0
---
- name: V-278248 - The Windows Server 2025 "Create permanent shared objects" user right must not be assigned to
    any groups or accounts.
  when:
    - win25_stig_v_278248 | bool
    - '''V-278248'' not in win25_stig_exceptions'
  tags:
    - V-278248
    - CAT2
  block:
    - name: The Windows Server 2025 "Create permanent shared objects" user right must not be assigned to any groups
        or accounts.
      ansible.windows.win_user_right:
        name: SeCreatePermanentPrivilege
        users: []
        action: set
