# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278108 - Windows Server 2025 Microsoft Defender antivirus SmartScreen must be enabled.
  when:
    - win25_stig_v_278108 | bool
    - '''V-278108'' not in win25_stig_exceptions'
  tags:
    - V-278108
    - CAT2
  block:
    - name: CAT2 V-278108 - Windows Server 2025 Microsoft Defender antivirus SmartScreen must be enabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: EnableSmartScreen
        data: 1
        type: dword
      notify: Record Windows restart requirement
