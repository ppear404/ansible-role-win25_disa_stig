# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278216 - Windows Server 2025 must not allow anonymous enumeration of Security Account Manager (SAM) accounts.
  when:
    - win25_stig_v_278216 | bool
    - '''V-278216'' not in win25_stig_exceptions'
  tags:
    - V-278216
    - CAT1
  block:
    - name: CAT1 V-278216 - Windows Server 2025 must not allow anonymous enumeration of Security Account Manager (SAM) accounts.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RestrictAnonymousSAM
        data: 1
        type: dword
      notify: Record Windows restart requirement
