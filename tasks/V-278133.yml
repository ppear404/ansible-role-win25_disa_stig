# SPDX-License-Identifier: MIT-0
---
- name: V-278133 - Windows Server 2025 Kerberos user logon restrictions must be enforced.
  when:
    - win25_stig_v_278133 | bool
    - win25_stig_is_dc
    - '''V-278133'' not in win25_stig_exceptions'
  tags:
    - V-278133
    - CAT2
  block:
    - name: V-278133 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278133''] }}'
