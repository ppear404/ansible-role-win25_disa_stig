# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278183 - Windows Server 2025 "Access this computer from the network" user right must only be assigned
    to the Administrators and Authenticated Users groups on domain-joined member servers and stand-alone or nondomain-joined
    systems.
  when:
    - win25_stig_v_278183 | bool
    - not win25_stig_is_dc
    - '''V-278183'' not in win25_stig_exceptions'
  tags:
    - V-278183
    - CAT2
  block:
    - name: CAT2 V-278183 - Windows Server 2025 "Access this computer from the network" user right must only be assigned to the
        Administrators and Authenticated Users groups on domain-joined member servers and stand-alone or nondomain-joined
        systems.
      ansible.windows.win_user_right:
        name: SeNetworkLogonRight
        users:
          - S-1-5-32-544
          - S-1-5-11
        action: set
