# SPDX-License-Identifier: MIT-0
---
- name: V-278134 - Windows Server 2025 Kerberos service ticket maximum lifetime must be limited to 600 minutes or
    less.
  when:
    - win25_stig_v_278134 | bool
    - win25_stig_is_dc
    - '''V-278134'' not in win25_stig_exceptions'
  tags:
    - V-278134
    - CAT2
  block:
    - name: V-278134 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278134''] }}'
