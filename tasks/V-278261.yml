# SPDX-License-Identifier: MIT-0
---
- name: V-278261 - The Windows Server 2025 "Restore files and directories" user right must only be assigned to the
    Administrators group.
  when:
    - win25_stig_v_278261 | bool
    - '''V-278261'' not in win25_stig_exceptions'
  tags:
    - V-278261
    - CAT2
  block:
    - name: The Windows Server 2025 "Restore files and directories" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeRestorePrivilege
        users:
          - S-1-5-32-544
        action: set
