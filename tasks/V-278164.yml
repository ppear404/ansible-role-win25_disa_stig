# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278164 - Windows Server 2025 domain controllers must be configured to allow reset of machine account passwords.
  when:
    - win25_stig_v_278164 | bool
    - win25_stig_is_dc
    - '''V-278164'' not in win25_stig_exceptions'
  tags:
    - V-278164
    - CAT2
  block:
    - name: CAT2 V-278164 - Windows Server 2025 domain controllers must be configured to allow reset of machine account passwords.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: RefusePasswordChange
        data: 0
        type: dword
      notify: Record Windows restart requirement
