# SPDX-License-Identifier: MIT-0
---
- name: 'CAT2 V-278214 - The Windows Server 2025 setting Microsoft network server: Digitally sign communications (if
    client agrees) must be configured to Enabled.'
  when:
    - win25_stig_v_278214 | bool
    - '''V-278214'' not in win25_stig_exceptions'
  tags:
    - V-278214
    - CAT2
  block:
    - name: 'CAT2 V-278214 - The Windows Server 2025 setting Microsoft network server: Digitally sign communications (if client
        agrees) must be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name: EnableSecuritySignature
        data: 1
        type: dword
      notify: Record Windows restart requirement
