# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278195 - Windows Server 2025 must have the built-in guest account disabled.
  when:
    - win25_stig_v_278195 | bool
    - '''V-278195'' not in win25_stig_exceptions'
  tags:
    - V-278195
    - CAT2
  block:
    - name: CAT2 V-278195 - Windows Server 2025 must have the built-in guest account disabled.
      community.windows.win_security_policy:
        section: System Access
        key: EnableGuestAccount
        value: 0
