# SPDX-License-Identifier: MIT-0
---
- name: V-278036 - Windows Server 2025 password history must be configured to 24 passwords remembered.
  when:
    - win25_stig_v_278036 | bool
    - '''V-278036'' not in win25_stig_exceptions'
  tags:
    - V-278036
    - CAT2
  block:
    - name: Windows Server 2025 password history must be configured to 24 passwords remembered.
      community.windows.win_security_policy:
        section: System Access
        key: PasswordHistorySize
        value: 24
      when: not win25_stig_is_dc
    - name: V-278036 - Report required domain GPO configuration
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278036 (configure domain account policy
          in the authoritative GPO)''] }}'
      when: win25_stig_is_dc
