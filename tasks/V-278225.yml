# SPDX-License-Identifier: MIT-0
---
- name: V-278225 - Windows Server 2025 LAN Manager authentication level must be configured to send NTLMv2 response
    only and to refuse LM and NTLM.
  when:
    - win25_stig_v_278225 | bool
    - '''V-278225'' not in win25_stig_exceptions'
  tags:
    - V-278225
    - CAT1
  block:
    - name: Windows Server 2025 LAN Manager authentication level must be configured to send NTLMv2 response only
        and to refuse LM and NTLM.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: LmCompatibilityLevel
        data: 5
        type: dword
      notify: Record Windows restart requirement
