# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278059 - Windows Server 2025 must be configured to audit logon successes.
  when:
    - win25_stig_v_278059 | bool
    - '''V-278059'' not in win25_stig_exceptions'
  tags:
    - V-278059
    - CAT2
  block:
    - name: CAT2 V-278059 - Windows Server 2025 must be configured to audit logon successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Logon
        audit_type:
          - failure
          - success
