# SPDX-License-Identifier: MIT-0
---
- name: V-278117 - Windows Server 2025 must prevent attachments from being downloaded from RSS feeds.
  when:
    - win25_stig_v_278117 | bool
    - '''V-278117'' not in win25_stig_exceptions'
  tags:
    - V-278117
    - CAT2
  block:
    - name: Windows Server 2025 must prevent attachments from being downloaded from RSS feeds.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds
        name: DisableEnclosureDownload
        data: 1
        type: dword
      notify: Record Windows restart requirement
