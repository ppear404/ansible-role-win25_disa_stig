---
- name: V-277999 - Windows Server 2025 permissions for program file directories must conform to minimum requirements.
  when:
    - win25_stig_v_277999 | bool
    - '''V-277999'' not in win25_stig_exceptions'
  tags:
    - V-277999
    - CAT2
  block:
    - name: V-277999 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277999''] }}'
