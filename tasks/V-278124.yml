# SPDX-License-Identifier: MIT-0
---
- name: V-278124 - Windows Server 2025 PowerShell script block logging must be enabled.
  when:
    - win25_stig_v_278124 | bool
    - '''V-278124'' not in win25_stig_exceptions'
  tags:
    - V-278124
    - CAT2
  block:
    - name: Windows Server 2025 PowerShell script block logging must be enabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
        name: EnableScriptBlockLogging
        data: 1
        type: dword
      notify: Record Windows restart requirement
