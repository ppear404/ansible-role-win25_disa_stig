# SPDX-License-Identifier: MIT-0
---
- name: V-278221 - Windows Server 2025 must prevent NTLM from falling back to a Null session.
  when:
    - win25_stig_v_278221 | bool
    - '''V-278221'' not in win25_stig_exceptions'
  tags:
    - V-278221
    - CAT2
  block:
    - name: Windows Server 2025 must prevent NTLM from falling back to a Null session.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\LSA\MSV1_0
        name: allownullsessionfallback
        data: 0
        type: dword
      notify: Record Windows restart requirement
