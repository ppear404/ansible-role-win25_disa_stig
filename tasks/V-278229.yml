# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278229 - Windows Server 2025 users must be required to enter a password to access private keys stored
    on the computer.
  when:
    - win25_stig_v_278229 | bool
    - '''V-278229'' not in win25_stig_exceptions'
  tags:
    - V-278229
    - CAT2
  block:
    - name: CAT2 V-278229 - Windows Server 2025 users must be required to enter a password to access private keys stored on the
        computer.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Cryptography
        name: ForceKeyProtection
        data: 2
        type: dword
      notify: Record Windows restart requirement
