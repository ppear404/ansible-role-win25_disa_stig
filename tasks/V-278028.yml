---
- name: V-278028 - Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
  when:
    - win25_stig_v_278028 | bool
    - '''V-278028'' not in win25_stig_exceptions'
  tags:
    - V-278028
    - CAT2
  block:
    - name: V-278028 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278028''] }}'
