# SPDX-License-Identifier: MIT-0
---
- name: V-278011 - Windows Server 2025 must have the roles and features required by the system documented.
  when:
    - win25_stig_v_278011 | bool
    - '''V-278011'' not in win25_stig_exceptions'
  tags:
    - V-278011
    - CAT2
  block:
    - name: V-278011 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278011''] }}'
      when: not (win25_stig_manual_reviews.get('V-278011', {}).get('Valid', false) | bool)
