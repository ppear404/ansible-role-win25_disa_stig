# SPDX-License-Identifier: MIT-0
---
- name: V-278095 - Windows Server 2025 network selection user interface (UI) must not be displayed on the logon
    screen.
  when:
    - win25_stig_v_278095 | bool
    - '''V-278095'' not in win25_stig_exceptions'
  tags:
    - V-278095
    - CAT2
  block:
    - name: Windows Server 2025 network selection user interface (UI) must not be displayed on the logon screen.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: DontDisplayNetworkSelectionUI
        data: 1
        type: dword
      notify: Record Windows restart requirement
