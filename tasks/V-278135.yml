---
- name: V-278135 - Windows Server 2025 Kerberos user ticket lifetime must be limited to 10 hours or less.
  when:
    - win25_stig_v_278135 | bool
    - win25_stig_is_dc
    - '''V-278135'' not in win25_stig_exceptions'
  tags:
    - V-278135
    - CAT2
  block:
    - name: V-278135 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278135''] }}'
