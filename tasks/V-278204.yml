# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278204 - Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or
    less.
  when:
    - win25_stig_v_278204 | bool
    - '''V-278204'' not in win25_stig_exceptions'
  tags:
    - V-278204
    - CAT2
  block:
    - name: CAT2 V-278204 - Windows Server 2025 maximum age for machine account passwords must be configured to 30 days or less.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: MaximumPasswordAge
        data: 30
        type: dword
      notify: Record Windows restart requirement
