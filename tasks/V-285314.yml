---
- name: CAT2 V-285314 - Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner
    before granting remote access to the system via an OpenSSH logon.
  when:
    - win25_stig_v_285314 | bool
    - '''V-285314'' not in win25_stig_exceptions'
  tags:
    - V-285314
    - CAT2
  block:
    - name: CAT2 V-285314 - Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner before
        granting remote access to the system via an OpenSSH logon.
      ansible.windows.win_copy:
        dest: C:\ProgramData\ssh\Banner.txt
        content: '{{ win25_stig_legal_notice }}'
    - name: CAT2 V-285314 - Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner before
        granting remote access to the system via an OpenSSH logon.
      ansible.windows.win_powershell:
        script: |-
          [CmdletBinding(SupportsShouldProcess)]
          param()
          $Ansible.Changed = $false
          $path = Join-Path $env:ProgramData 'ssh\sshd_config'
          $text = [IO.File]::ReadAllText($path)
          $parts = [regex]::new('(?im)(?=^Match\s)').Split($text, 2)
          $global = $parts[0]
          $desired = 'Banner C:/ProgramData/ssh/Banner.txt'
          $pattern = '(?im)^\s*#?\s*Banner\s+[^\r\n]*(?:\r?\n|$)'
          $updated = [regex]::Replace($global, $pattern, '')
          $updated = $desired + "`r`n" + $updated
          if ($parts.Count -gt 1) { $updated += $parts[1] }
          # Compare effective global directives to avoid rewriting unchanged files.
          $active = @([regex]::Matches($global, '(?im)^\s*Banner\s+([^\r\n]+)'))
          if ($active.Count -ne 1 -or $active[0].Groups[1].Value.Trim() -ne 'C:/ProgramData/ssh/Banner.txt') {
              $Ansible.Changed = $true
              if ($PSCmdlet.ShouldProcess($path, 'Set global SSH Banner')) {
                  [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
              }
          }
      notify: Validate and restart OpenSSH
