# SPDX-License-Identifier: MIT-0
---
- name: V-278234 - Windows Server 2025 User Account Control (UAC) must, at a minimum, prompt administrators for
    consent on the secure desktop.
  when:
    - win25_stig_v_278234 | bool
    - '''V-278234'' not in win25_stig_exceptions'
  tags:
    - V-278234
    - CAT2
  block:
    - name: Windows Server 2025 User Account Control (UAC) must, at a minimum, prompt administrators for consent
        on the secure desktop.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: ConsentPromptBehaviorAdmin
        data: 2
        type: dword
      notify: Record Windows restart requirement
