---
- name: V-278007 - Windows Server 2025 nonsystem-created file shares must limit access to groups that require it.
  when:
    - win25_stig_v_278007 | bool
    - '''V-278007'' not in win25_stig_exceptions'
  tags:
    - V-278007
    - CAT2
  block:
    - name: V-278007 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278007''] }}'
