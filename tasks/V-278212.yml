# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278212 - Windows Server 2025 unencrypted passwords must not be sent to third-party Server Message Block
    (SMB) servers.
  when:
    - win25_stig_v_278212 | bool
    - '''V-278212'' not in win25_stig_exceptions'
  tags:
    - V-278212
    - CAT2
  block:
    - name: CAT2 V-278212 - Windows Server 2025 unencrypted passwords must not be sent to third-party Server Message Block (SMB)
        servers.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name: EnablePlainTextPassword
        data: 0
        type: dword
      notify: Record Windows restart requirement
