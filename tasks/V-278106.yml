# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278106 - Windows Server 2025 Security event log size must be configured to a value that holds at least
    one week of audit records.
  when:
    - win25_stig_v_278106 | bool
    - '''V-278106'' not in win25_stig_exceptions'
  tags:
    - V-278106
    - CAT2
  block:
    - name: CAT2 V-278106 - Windows Server 2025 Security event log size must be configured to a value that holds at least one week
        of audit records.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security
        name: MaxSize
        data: 5120000
        type: dword
      notify: Record Windows restart requirement
