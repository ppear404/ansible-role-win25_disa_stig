# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278084 - Windows Server 2025 must be configured to prevent Internet Control Message Protocol (ICMP) redirects
    from overriding Open Shortest Path First (OSPF)-generated routes.
  when:
    - win25_stig_v_278084 | bool
    - '''V-278084'' not in win25_stig_exceptions'
  tags:
    - V-278084
    - CAT3
  block:
    - name: CAT3 V-278084 - Windows Server 2025 must be configured to prevent Internet Control Message Protocol (ICMP) redirects
        from overriding Open Shortest Path First (OSPF)-generated routes.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
        name: EnableICMPRedirect
        data: 0
        type: dword
      notify: Record Windows restart requirement
