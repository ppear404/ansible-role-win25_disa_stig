# SPDX-License-Identifier: MIT-0
---
- name: V-278109 - Windows Server 2025 Explorer Data Execution Prevention must be enabled.
  when:
    - win25_stig_v_278109 | bool
    - '''V-278109'' not in win25_stig_exceptions'
  tags:
    - V-278109
    - CAT2
  block:
    - name: Windows Server 2025 Explorer Data Execution Prevention must be enabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
        name: NoDataExecutionPrevention
        data: 0
        type: dword
      notify: Record Windows restart requirement
