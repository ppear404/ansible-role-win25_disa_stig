---
- name: V-278139 - Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
  when:
    - win25_stig_v_278139 | bool
    - win25_stig_is_dc
    - '''V-278139'' not in win25_stig_exceptions'
  tags:
    - V-278139
    - CAT1
  block:
    - name: V-278139 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278139''] }}'
