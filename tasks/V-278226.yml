# SPDX-License-Identifier: MIT-0
---
- name: V-278226 - Windows Server 2025 must be configured to at least negotiate signing for LDAP client signing.
  when:
    - win25_stig_v_278226 | bool
    - '''V-278226'' not in win25_stig_exceptions'
  tags:
    - V-278226
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to at least negotiate signing for LDAP client signing.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LDAP
        name: LDAPClientIntegrity
        data: 1
        type: dword
      notify: Record Windows restart requirement
