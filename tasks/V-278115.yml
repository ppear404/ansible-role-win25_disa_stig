# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278115 - Windows Server 2025 Remote Desktop Services must require secure Remote Procedure Call (RPC) communications.
  when:
    - win25_stig_v_278115 | bool
    - '''V-278115'' not in win25_stig_exceptions'
  tags:
    - V-278115
    - CAT2
  block:
    - name: CAT2 V-278115 - Windows Server 2025 Remote Desktop Services must require secure Remote Procedure Call (RPC) communications.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name: fEncryptRPCTraffic
        data: 1
        type: dword
      notify: Record Windows restart requirement
