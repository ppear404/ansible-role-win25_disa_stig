# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278203 - Windows Server 2025 computer account password must not be prevented from being reset.
  when:
    - win25_stig_v_278203 | bool
    - '''V-278203'' not in win25_stig_exceptions'
  tags:
    - V-278203
    - CAT2
  block:
    - name: CAT2 V-278203 - Windows Server 2025 computer account password must not be prevented from being reset.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: DisablePasswordChange
        data: 0
        type: dword
      notify: Record Windows restart requirement
