# SPDX-License-Identifier: MIT-0
---
- name: V-278103 - Windows Server 2025 Telemetry must be configured to limit diagnostic data sent to Microsoft.
  when:
    - win25_stig_v_278103 | bool
    - '''V-278103'' not in win25_stig_exceptions'
  tags:
    - V-278103
    - CAT2
  block:
    - name: Windows Server 2025 Telemetry must be configured to limit diagnostic data sent to Microsoft.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection
        name: AllowTelemetry
        data: 0
        type: dword
      notify: Record Windows restart requirement
