# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278215 - Windows Server 2025 must not allow anonymous SID/Name translation.
  when:
    - win25_stig_v_278215 | bool
    - '''V-278215'' not in win25_stig_exceptions'
  tags:
    - V-278215
    - CAT1
  block:
    - name: CAT1 V-278215 - Windows Server 2025 must not allow anonymous SID/Name translation.
      community.windows.win_security_policy:
        section: System Access
        key: LSAAnonymousNameLookup
        value: 0
