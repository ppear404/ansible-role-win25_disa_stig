# SPDX-License-Identifier: MIT-0
---
- name: V-277982 - Windows Server 2025 must install security-relevant software updates within 30 days unless the
    time period is directed by an authoritative source (e.g., IAVM, CTOs, DTMs, STIGs).
  when:
    - win25_stig_v_277982 | bool
    - '''V-277982'' not in win25_stig_exceptions'
  tags:
    - V-277982
    - CAT2
  block:
    - name: V-277982 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277982''] }}'
      when: not (win25_stig_manual_reviews.get('V-277982', {}).get('Valid', false) | bool)
