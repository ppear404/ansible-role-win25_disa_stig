---
- name: V-278138 - Windows Server 2025 permissions on the Active Directory data files must only allow system administrators
    (SAs) access.
  when:
    - win25_stig_v_278138 | bool
    - win25_stig_is_dc
    - '''V-278138'' not in win25_stig_exceptions'
  tags:
    - V-278138
    - CAT1
  block:
    - name: V-278138 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278138''] }}'
