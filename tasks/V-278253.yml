# SPDX-License-Identifier: MIT-0
---
- name: V-278253 - The Windows Server 2025 "Impersonate a client after authentication" user right must only be assigned
    to Administrators, Service, Local Service, and Network Service.
  when:
    - win25_stig_v_278253 | bool
    - '''V-278253'' not in win25_stig_exceptions'
  tags:
    - V-278253
    - CAT2
  block:
    - name: The Windows Server 2025 "Impersonate a client after authentication" user right must only be assigned
        to Administrators, Service, Local Service, and Network Service.
      ansible.windows.win_user_right:
        name: SeImpersonatePrivilege
        users:
          - S-1-5-32-544
          - S-1-5-6
          - S-1-5-19
          - S-1-5-20
        action: set
