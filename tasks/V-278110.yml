# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278110 - Windows Server 2025 Turning off File Explorer heap termination on corruption must be disabled.
  when:
    - win25_stig_v_278110 | bool
    - '''V-278110'' not in win25_stig_exceptions'
  tags:
    - V-278110
    - CAT3
  block:
    - name: CAT3 V-278110 - Windows Server 2025 Turning off File Explorer heap termination on corruption must be disabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer
        name: NoHeapTerminationOnCorruption
        data: 0
        type: dword
      notify: Record Windows restart requirement
