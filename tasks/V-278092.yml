# SPDX-License-Identifier: MIT-0
---
- name: V-278092 - Windows Server 2025 group policy objects must be reprocessed even if they have not changed.
  when:
    - win25_stig_v_278092 | bool
    - '''V-278092'' not in win25_stig_exceptions'
  tags:
    - V-278092
    - CAT2
  block:
    - name: Windows Server 2025 group policy objects must be reprocessed even if they have not changed.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}
        name: NoGPOListChanges
        data: 0
        type: dword
      notify: Record Windows restart requirement
