# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278228 - Windows Server 2025 session security for NTLM SSP-based servers must be configured to require
    NTLMv2 session security and 128-bit encryption.
  when:
    - win25_stig_v_278228 | bool
    - '''V-278228'' not in win25_stig_exceptions'
  tags:
    - V-278228
    - CAT2
  block:
    - name: CAT2 V-278228 - Windows Server 2025 session security for NTLM SSP-based servers must be configured to require NTLMv2
        session security and 128-bit encryption.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name: NTLMMinServerSec
        data: 537395200
        type: dword
      notify: Record Windows restart requirement
