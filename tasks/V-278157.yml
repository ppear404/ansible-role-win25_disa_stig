# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278157 - Windows Server 2025 must be configured to audit DS Access - Directory Service Changes successes.
  when:
    - win25_stig_v_278157 | bool
    - win25_stig_is_dc
    - '''V-278157'' not in win25_stig_exceptions'
  tags:
    - V-278157
    - CAT2
  block:
    - name: CAT2 V-278157 - Windows Server 2025 must be configured to audit DS Access - Directory Service Changes successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Directory Service Changes
        audit_type:
          - failure
          - success
