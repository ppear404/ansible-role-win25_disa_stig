# SPDX-License-Identifier: MIT-0
---
- name: V-278065 - Windows Server 2025 must be configured to audit Object Access - Removable Storage failures.
  when:
    - win25_stig_v_278065 | bool
    - '''V-278065'' not in win25_stig_exceptions'
  tags:
    - V-278065
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Object Access - Removable Storage failures.
      ansible.windows.win_audit_policy_system:
        subcategory: Removable Storage
        audit_type:
          - failure
          - success
