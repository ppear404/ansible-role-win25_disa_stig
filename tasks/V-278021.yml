# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278021 - Windows Server 2025 must not have the Telnet Client installed.
  when:
    - win25_stig_v_278021 | bool
    - '''V-278021'' not in win25_stig_exceptions'
  tags:
    - V-278021
    - CAT2
  block:
    - name: CAT2 V-278021 - Windows Server 2025 must not have the Telnet Client installed.
      ansible.windows.win_feature:
        name: '{{ item }}'
        state: absent
      loop:
        - Telnet-Client
      when: item in win25_stig_available_features
      notify: Record Windows restart requirement
