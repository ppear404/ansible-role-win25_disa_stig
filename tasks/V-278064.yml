# SPDX-License-Identifier: MIT-0
---
- name: V-278064 - Windows Server 2025 must be configured to audit Object Access - Removable Storage successes.
  when:
    - win25_stig_v_278064 | bool
    - '''V-278064'' not in win25_stig_exceptions'
  tags:
    - V-278064
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Object Access - Removable Storage successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Removable Storage
        audit_type:
          - failure
          - success
