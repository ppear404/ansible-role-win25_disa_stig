# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278075 - Windows Server 2025 must be configured to audit System - Other System Events failures.
  when:
    - win25_stig_v_278075 | bool
    - '''V-278075'' not in win25_stig_exceptions'
  tags:
    - V-278075
    - CAT2
  block:
    - name: CAT2 V-278075 - Windows Server 2025 must be configured to audit System - Other System Events failures.
      ansible.windows.win_audit_policy_system:
        subcategory: Other System Events
        audit_type:
          - failure
          - success
