# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-279921 - Windows Server 2025 must be configured to audit registry successes.
  when:
    - win25_stig_v_279921 | bool
    - '''V-279921'' not in win25_stig_exceptions'
  tags:
    - V-279921
    - CAT2
  block:
    - name: CAT2 V-279921 - Configure audit subcategory
      ansible.windows.win_audit_policy_system:
        subcategory: Registry
        audit_type:
          - success
          - failure
