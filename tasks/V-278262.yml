# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278262 - The Windows Server 2025 "Take ownership of files or other objects" user right must only be assigned
    to the Administrators group.
  when:
    - win25_stig_v_278262 | bool
    - '''V-278262'' not in win25_stig_exceptions'
  tags:
    - V-278262
    - CAT2
  block:
    - name: CAT2 V-278262 - The Windows Server 2025 "Take ownership of files or other objects" user right must only be assigned
        to the Administrators group.
      ansible.windows.win_user_right:
        name: SeTakeOwnershipPrivilege
        users:
          - S-1-5-32-544
        action: set
