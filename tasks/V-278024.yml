# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278024 - Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB
    server.
  when:
    - win25_stig_v_278024 | bool
    - '''V-278024'' not in win25_stig_exceptions'
  tags:
    - V-278024
    - CAT2
  block:
    - name: CAT2 V-278024 - Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB server.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword
      notify: Record Windows restart requirement
