    - win25_stig_v_278027 | bool
    - '''V-278027'' not in win25_stig_exceptions'
  tags:
    - V-278027
    - CAT2
  block:
    - name: V-278027 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278027''] }}'
