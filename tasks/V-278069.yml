# SPDX-License-Identifier: MIT-0
---
- name: V-278069 - Windows Server 2025 must be configured to audit Policy Change - Authorization Policy Change successes.
  when:
    - win25_stig_v_278069 | bool
    - '''V-278069'' not in win25_stig_exceptions'
  tags:
    - V-278069
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Policy Change - Authorization Policy Change successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Authorization Policy Change
        audit_type:
          - success
