# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278083 - Windows Server 2025 source routing must be configured to the highest protection level to prevent
    Internet Protocol (IP) source routing.
  when:
    - win25_stig_v_278083 | bool
    - '''V-278083'' not in win25_stig_exceptions'
  tags:
    - V-278083
    - CAT3
  block:
    - name: CAT3 V-278083 - Windows Server 2025 source routing must be configured to the highest protection level to prevent Internet
        Protocol (IP) source routing.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
        name: DisableIPSourceRouting
        data: 2
        type: dword
      notify: Record Windows restart requirement
