# SPDX-License-Identifier: MIT-0
---
- name: Record controls requiring explicit site configuration
  ansible.builtin.set_fact:
    win25_stig_pending_controls: '{{ win25_stig_pending_controls + [item.id] }}'
  loop:
    - id: V-278192
      pending: '{{ not win25_stig_unclassified }}'
    - id: V-278004
      pending: '{{ not win25_stig_manage_local_password_flags and not win25_stig_is_dc }}'
    - id: V-278005
      pending: '{{ not win25_stig_manage_local_password_flags and not win25_stig_is_dc }}'
    - id: V-277995
      pending: '{{ not win25_stig_manage_defender }}'
    - id: V-278090
      pending: '{{ win25_stig_domain_joined and not win25_stig_enable_virtualization_security }}'
    - id: V-278190
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc and not win25_stig_exchange_server
           and not win25_stig_enable_credential_guard_uefi_lock }}
    - id: V-278178
      pending: '{{ win25_stig_domain_joined and not win25_stig_is_dc and not win25_stig_enforce_remote_uac }}'
    - id: V-278184
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc
           and (win25_stig_domain_sid | length == 0 or win25_stig_forest_root_sid | length == 0) }}
    - id: V-278185
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc
           and (win25_stig_domain_sid | length == 0 or win25_stig_forest_root_sid | length == 0) }}
    - id: V-278186
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc
           and (win25_stig_domain_sid | length == 0 or win25_stig_forest_root_sid | length == 0) }}
    - id: V-278187
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc
           and (win25_stig_domain_sid | length == 0 or win25_stig_forest_root_sid | length == 0) }}
    - id: V-278188
      pending: |-
        {{ win25_stig_domain_joined and not win25_stig_is_dc
           and (win25_stig_domain_sid | length == 0 or win25_stig_forest_root_sid | length == 0) }}
  when:
    - item.pending | bool
    - "vars['win25_stig_' + (item.id | lower | replace('-', '_'))] | bool"
    - item.id not in win25_stig_exceptions
    - >-
      vars['win25_stig_cat' + {'high': '1', 'medium': '2', 'low': '3'}[
      win25_stig_control_manifest[item.id].severity]] | bool
    - >-
      'all' in ansible_run_tags or item.id in ansible_run_tags or
      ('CAT' + {'high': '1', 'medium': '2', 'low': '3'}[
      win25_stig_control_manifest[item.id].severity]) in ansible_run_tags
    - item.id not in ansible_skip_tags
    - >-
      ('CAT' + {'high': '1', 'medium': '2', 'low': '3'}[
      win25_stig_control_manifest[item.id].severity]) not in ansible_skip_tags
  loop_control:
    label: '{{ item.id }}'
- name: Summarize remaining review and configuration
  ansible.builtin.debug:
    msg:
      benchmark: Windows Server 2025 V1R4
      pending_controls: '{{ win25_stig_pending_controls | unique | sort }}'
      disabled_categories:
        CAT1: '{{ not win25_stig_cat1 }}'
        CAT2: '{{ not win25_stig_cat2 }}'
        CAT3: '{{ not win25_stig_cat3 }}'
      disabled_control_switches: >-
        {%- set disabled = namespace(names=[]) -%}
        {%- for name in lookup('ansible.builtin.varnames', '^win25_stig_v_[0-9]+$', wantlist=True) -%}
        {%- if not (lookup('ansible.builtin.vars', name) | bool) -%}
        {%- set disabled.names = disabled.names + [name] -%}
        {%- endif -%}
        {%- endfor -%}
        {{ disabled.names | sort }}
      documented_exceptions: '{{ win25_stig_exceptions }}'
      restart_required: '{{ win25_stig_restart_required }}'
      notice: This is a remediation report, not a compliance attestation. Review the bundled checks, effective domain
        GPOs, disabled controls, firmware prerequisites, and site exceptions.
- name: Reboot when explicitly enabled
  ansible.windows.win_reboot: null
  when:
    - win25_stig_reboot | bool
    - win25_stig_restart_required | bool
