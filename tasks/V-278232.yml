# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278232 - Windows Server 2025 User Account Control (UAC) approval mode for the built-in Administrator must
    be enabled.
  when:
    - win25_stig_v_278232 | bool
    - '''V-278232'' not in win25_stig_exceptions'
  tags:
    - V-278232
    - CAT2
  block:
    - name: CAT2 V-278232 - Windows Server 2025 User Account Control (UAC) approval mode for the built-in Administrator must be
        enabled.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: FilterAdministratorToken
        data: 1
        type: dword
      notify: Record Windows restart requirement
