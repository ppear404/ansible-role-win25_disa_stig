# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278231 - Windows Server 2025 default permissions of global system objects must be strengthened.
  when:
    - win25_stig_v_278231 | bool
    - '''V-278231'' not in win25_stig_exceptions'
  tags:
    - V-278231
    - CAT3
  block:
    - name: CAT3 V-278231 - Windows Server 2025 default permissions of global system objects must be strengthened.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager
        name: ProtectionMode
        data: 1
        type: dword
      notify: Record Windows restart requirement
