# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278130 - Windows Server 2025 Windows Remote Management (WinRM) service must not store RunAs credentials.
  when:
    - win25_stig_v_278130 | bool
    - '''V-278130'' not in win25_stig_exceptions'
  tags:
    - V-278130
    - CAT2
  block:
    - name: CAT2 V-278130 - Windows Server 2025 Windows Remote Management (WinRM) service must not store RunAs credentials.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service
        name: DisableRunAs
        data: 1
        type: dword
      notify: Record Windows restart requirement
