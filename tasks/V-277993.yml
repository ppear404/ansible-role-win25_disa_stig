---
- name: V-277993 - Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use.
  when:
    - win25_stig_v_277993 | bool
    - '''V-277993'' not in win25_stig_exceptions'
  tags:
    - V-277993
    - CAT2
  block:
    - name: V-277993 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277993''] }}'
