# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278073 - Windows Server 2025 must be configured to audit System - IPsec Driver failures.
  when:
    - win25_stig_v_278073 | bool
    - '''V-278073'' not in win25_stig_exceptions'
  tags:
    - V-278073
    - CAT2
  block:
    - name: CAT2 V-278073 - Windows Server 2025 must be configured to audit System - IPsec Driver failures.
      ansible.windows.win_audit_policy_system:
        subcategory: IPsec Driver
        audit_type:
          - failure
          - success
