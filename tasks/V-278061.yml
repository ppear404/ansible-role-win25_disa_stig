# SPDX-License-Identifier: MIT-0
---
- name: V-278061 - Windows Server 2025 must be configured to audit Logon/Logoff - Special Logon successes.
  when:
    - win25_stig_v_278061 | bool
    - '''V-278061'' not in win25_stig_exceptions'
  tags:
    - V-278061
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Logon/Logoff - Special Logon successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Special Logon
        audit_type:
          - success
