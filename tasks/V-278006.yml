# SPDX-License-Identifier: MIT-0
---
- name: V-278006 - Windows Server 2025 system files must be monitored for unauthorized changes.
  when:
    - win25_stig_v_278006 | bool
    - '''V-278006'' not in win25_stig_exceptions'
  tags:
    - V-278006
    - CAT2
  block:
    - name: V-278006 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278006''] }}'
      when: not (win25_stig_manual_reviews.get('V-278006', {}).get('Valid', false) | bool)
