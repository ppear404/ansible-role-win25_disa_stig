# SPDX-License-Identifier: MIT-0
---
- name: V-278121 - Windows Server 2025 must disable the Windows Installer Always install with elevated privileges
    option.
  when:
    - win25_stig_v_278121 | bool
    - '''V-278121'' not in win25_stig_exceptions'
  tags:
    - V-278121
    - CAT1
  block:
    - name: Windows Server 2025 must disable the Windows Installer Always install with elevated privileges option.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
        name: AlwaysInstallElevated
        data: 0
        type: dword
      notify: Record Windows restart requirement
