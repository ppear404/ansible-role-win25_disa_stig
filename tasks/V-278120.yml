# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278120 - Windows Server 2025 must prevent users from changing installation options.
  when:
    - win25_stig_v_278120 | bool
    - '''V-278120'' not in win25_stig_exceptions'
  tags:
    - V-278120
    - CAT2
  block:
    - name: CAT2 V-278120 - Windows Server 2025 must prevent users from changing installation options.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
        name: EnableUserControl
        data: 0
        type: dword
      notify: Record Windows restart requirement
