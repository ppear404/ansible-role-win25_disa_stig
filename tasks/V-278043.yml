# SPDX-License-Identifier: MIT-0
---
- name: V-278043 - Windows Server 2025 permissions for the Application event log must prevent access by nonprivileged
    accounts.
  when:
    - win25_stig_v_278043 | bool
    - '''V-278043'' not in win25_stig_exceptions'
  tags:
    - V-278043
    - CAT2
  block:
    - name: V-278043 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278043''] }}'
