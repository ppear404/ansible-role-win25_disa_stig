# SPDX-License-Identifier: MIT-0
---
- name: V-278217 - Windows Server 2025 must not allow anonymous enumeration of shares.
  when:
    - win25_stig_v_278217 | bool
    - '''V-278217'' not in win25_stig_exceptions'
  tags:
    - V-278217
    - CAT1
  block:
    - name: Windows Server 2025 must not allow anonymous enumeration of shares.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RestrictAnonymous
        data: 1
        type: dword
      notify: Record Windows restart requirement
