# SPDX-License-Identifier: MIT-0
---
- name: V-278173 - Windows Server 2025 must be configured for name-based strong mappings for certificates.
  when:
    - win25_stig_v_278173 | bool
    - win25_stig_is_dc
    - '''V-278173'' not in win25_stig_exceptions'
  tags:
    - V-278173
    - CAT2
  block:
    - name: V-278173 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278173''] }}'
