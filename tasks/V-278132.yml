# SPDX-License-Identifier: MIT-0
---
- name: V-278132 - Windows Server 2025 must only allow administrators responsible for the domain controller to have
    Administrator rights on the system.
  when:
    - win25_stig_v_278132 | bool
    - win25_stig_is_dc
    - '''V-278132'' not in win25_stig_exceptions'
  tags:
    - V-278132
    - CAT1
  block:
    - name: V-278132 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278132''] }}'
