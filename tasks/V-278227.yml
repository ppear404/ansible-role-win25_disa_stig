# SPDX-License-Identifier: MIT-0
---
- name: V-278227 - Windows Server 2025 session security for NTLM SSP-based clients must be configured to require
    NTLMv2 session security and 128-bit encryption.
  when:
    - win25_stig_v_278227 | bool
    - '''V-278227'' not in win25_stig_exceptions'
  tags:
    - V-278227
    - CAT2
  block:
    - name: Windows Server 2025 session security for NTLM SSP-based clients must be configured to require NTLMv2
        session security and 128-bit encryption.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name: NTLMMinClientSec
        data: 537395200
        type: dword
      notify: Record Windows restart requirement
