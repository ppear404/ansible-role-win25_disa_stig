# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278260 - The Windows Server 2025 "Profile single process" user right must only be assigned to the Administrators
    group.
  when:
    - win25_stig_v_278260 | bool
    - '''V-278260'' not in win25_stig_exceptions'
  tags:
    - V-278260
    - CAT2
  block:
    - name: CAT2 V-278260 - The Windows Server 2025 "Profile single process" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeProfileSingleProcessPrivilege
        users:
          - S-1-5-32-544
        action: set
