---
- name: CAT3 V-278029 - Set the local Windows Time client to follow the domain hierarchy
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
    name: Type
    data: NT5DS
    type: string
  notify: Restart Windows Time

- name: CAT3 V-278029 - Ensure Windows Time is running for domain synchronization
  ansible.windows.win_service:
    name: W32Time
    state: started
