# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278257 - The Windows Server 2025 "Manage auditing and security log" user right must only be assigned to
    the Administrators group.
  when:
    - win25_stig_v_278257 | bool
    - '''V-278257'' not in win25_stig_exceptions'
  tags:
    - V-278257
    - CAT2
  block:
    - name: CAT2 V-278257 - The Windows Server 2025 "Manage auditing and security log" user right must only be assigned to the Administrators
        group.
      ansible.windows.win_user_right:
        name: SeSecurityPrivilege
        users:
          - S-1-5-32-544
        action: set
