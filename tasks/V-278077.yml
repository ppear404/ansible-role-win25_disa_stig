# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278077 - Windows Server 2025 must be configured to audit System - Security System Extension successes.
  when:
    - win25_stig_v_278077 | bool
    - '''V-278077'' not in win25_stig_exceptions'
  tags:
    - V-278077
    - CAT2
  block:
    - name: CAT2 V-278077 - Windows Server 2025 must be configured to audit System - Security System Extension successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Security System Extension
        audit_type:
          - success
