# SPDX-License-Identifier: MIT-0
---
- name: V-278122 - Windows Server 2025 users must be notified if a web-based program attempts to install software.
  when:
    - win25_stig_v_278122 | bool
    - '''V-278122'' not in win25_stig_exceptions'
  tags:
    - V-278122
    - CAT2
  block:
    - name: Windows Server 2025 users must be notified if a web-based program attempts to install software.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
        name: SafeForScripting
        data: 0
        type: dword
      notify: Record Windows restart requirement
