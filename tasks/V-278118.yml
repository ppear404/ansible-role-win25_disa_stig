# SPDX-License-Identifier: MIT-0
---
- name: V-278118 - Windows Server 2025 must disable Basic authentication for RSS feeds over HTTP.
  when:
    - win25_stig_v_278118 | bool
    - '''V-278118'' not in win25_stig_exceptions'
  tags:
    - V-278118
    - CAT2
  block:
    - name: Windows Server 2025 must disable Basic authentication for RSS feeds over HTTP.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds
        name: AllowBasicAuthInClear
        data: 0
        type: dword
      notify: Record Windows restart requirement
