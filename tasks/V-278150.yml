---
- name: V-278150 - Windows Server 2025 Active Directory (AD) Infrastructure object must be configured with proper
    audit settings.
  when:
    - win25_stig_v_278150 | bool
    - win25_stig_is_dc
    - '''V-278150'' not in win25_stig_exceptions'
  tags:
    - V-278150
    - CAT2
  block:
    - name: V-278150 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278150''] }}'
