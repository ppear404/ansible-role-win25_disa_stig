# SPDX-License-Identifier: MIT-0
---
- name: V-278126 - Windows Server 2025 Windows Remote Management (WinRM) client must not allow unencrypted traffic.
  when:
    - win25_stig_v_278126 | bool
    - '''V-278126'' not in win25_stig_exceptions'
  tags:
    - V-278126
    - CAT2
  block:
    - name: Windows Server 2025 Windows Remote Management (WinRM) client must not allow unencrypted traffic.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client
        name: AllowUnencryptedTraffic
        data: 0
        type: dword
      notify: Record Windows restart requirement
