# SPDX-License-Identifier: MIT-0
---
- name: V-278219 - Windows Server 2025 must restrict anonymous access to Named Pipes and Shares.
  when:
    - win25_stig_v_278219 | bool
    - '''V-278219'' not in win25_stig_exceptions'
  tags:
    - V-278219
    - CAT1
  block:
    - name: Windows Server 2025 must restrict anonymous access to Named Pipes and Shares.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
        name: RestrictNullSessAccess
        data: 1
        type: dword
      notify: Record Windows restart requirement
