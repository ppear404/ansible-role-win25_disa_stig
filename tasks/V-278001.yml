---
- name: V-278001 - Windows Server 2025 default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
  when:
    - win25_stig_v_278001 | bool
    - '''V-278001'' not in win25_stig_exceptions'
  tags:
    - V-278001
    - CAT2
  block:
    - name: V-278001 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278001''] }}'
