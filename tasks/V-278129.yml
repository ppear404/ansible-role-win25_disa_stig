# SPDX-License-Identifier: MIT-0
---
- name: V-278129 - Windows Server 2025 Windows Remote Management (WinRM) service must not allow unencrypted traffic.
  when:
    - win25_stig_v_278129 | bool
    - '''V-278129'' not in win25_stig_exceptions'
  tags:
    - V-278129
    - CAT2
  block:
    - name: Windows Server 2025 Windows Remote Management (WinRM) service must not allow unencrypted traffic.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service
        name: AllowUnencryptedTraffic
        data: 0
        type: dword
      notify: Record Windows restart requirement
