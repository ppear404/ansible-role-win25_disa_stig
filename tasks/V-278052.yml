# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278052 - Windows Server 2025 must be configured to audit Account Management - User Account Management
    failures.
  when:
    - win25_stig_v_278052 | bool
    - '''V-278052'' not in win25_stig_exceptions'
  tags:
    - V-278052
    - CAT2
  block:
    - name: CAT2 V-278052 - Windows Server 2025 must be configured to audit Account Management - User Account Management failures.
      ansible.windows.win_audit_policy_system:
        subcategory: User Account Management
        audit_type:
          - failure
          - success
