# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278239 - Windows Server 2025 User Account Control (UAC) must virtualize file and registry write failures
    to per-user locations.
  when:
    - win25_stig_v_278239 | bool
    - '''V-278239'' not in win25_stig_exceptions'
  tags:
    - V-278239
    - CAT2
  block:
    - name: CAT2 V-278239 - Windows Server 2025 User Account Control (UAC) must virtualize file and registry write failures to per-user
        locations.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: EnableVirtualization
        data: 1
        type: dword
      notify: Record Windows restart requirement
