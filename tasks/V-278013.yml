# SPDX-License-Identifier: MIT-0
---
- name: V-278013 - Windows Server 2025 must automatically remove or disable temporary user accounts after 72 hours.
  when:
    - win25_stig_v_278013 | bool
    - '''V-278013'' not in win25_stig_exceptions'
  tags:
    - V-278013
    - CAT2
  block:
    - name: V-278013 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278013''] }}'
      when: not (win25_stig_manual_reviews.get('V-278013', {}).get('Valid', false) | bool)
