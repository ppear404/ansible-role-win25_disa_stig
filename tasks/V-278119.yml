# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278119 - Windows Server 2025 must prevent Indexing of encrypted files.
  when:
    - win25_stig_v_278119 | bool
    - '''V-278119'' not in win25_stig_exceptions'
  tags:
    - V-278119
    - CAT2
  block:
    - name: CAT2 V-278119 - Windows Server 2025 must prevent Indexing of encrypted files.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search
        name: AllowIndexingEncryptedStoresOrItems
        data: 0
        type: dword
      notify: Record Windows restart requirement
