# SPDX-License-Identifier: MIT-0
---
- name: V-278034 - Windows Server 2025 must have the number of allowed bad logon attempts configured to three or
    less.
  when:
    - win25_stig_v_278034 | bool
    - '''V-278034'' not in win25_stig_exceptions'
  tags:
    - V-278034
    - CAT2
  block:
    - name: Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less.
      community.windows.win_security_policy:
        section: System Access
        key: LockoutBadCount
        value: 3
      when: not win25_stig_is_dc
    - name: V-278034 - Report required domain GPO configuration
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278034 (configure domain account policy
          in the authoritative GPO)''] }}'
      when: win25_stig_is_dc
