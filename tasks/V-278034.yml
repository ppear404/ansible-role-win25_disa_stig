# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278034 - Windows Server 2025 must have the number of allowed bad logon attempts configured to three or
    less.
  when:
    - win25_stig_v_278034 | bool
    - '''V-278034'' not in win25_stig_exceptions'
  tags:
    - V-278034
    - CAT2
  block:
    - name: CAT2 V-278034 - Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less.
      community.windows.win_security_policy:
        section: System Access
        key: LockoutBadCount
        value: 3
      when: not win25_stig_is_dc
    - name: CAT2 V-278034 - Configure domain LockoutThreshold
      ansible.windows.win_powershell:
        error_action: stop
        parameters:
          Property: LockoutThreshold
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Property)
          $domain = Get-ADDomain -Server $env:COMPUTERNAME
          $policy = Get-ADDefaultDomainPasswordPolicy -Identity $domain.DNSRoot -Server $domain.PDCEmulator
          $desired = 3
          $Ansible.Changed = $policy.LockoutThreshold -notin @(1, 2, 3)
          if ($Ansible.Changed -and $PSCmdlet.ShouldProcess($domain.DNSRoot, $Property)) {
              $settings = @{ $Property = $desired }
              Set-ADDefaultDomainPasswordPolicy -Identity $domain.DNSRoot -Server $domain.PDCEmulator @settings
          }
      when:
        - win25_stig_is_dc
        - win25_stig_manage_domain_account_policy | bool
