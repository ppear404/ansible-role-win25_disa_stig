# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278230 - Windows Server 2025 must be configured to use FIPS-compliant algorithms for encryption, hashing,
    and signing.
  when:
    - win25_stig_v_278230 | bool
    - '''V-278230'' not in win25_stig_exceptions'
  tags:
    - V-278230
    - CAT2
  block:
    - name: CAT2 V-278230 - Windows Server 2025 must be configured to use FIPS-compliant algorithms for encryption, hashing, and
        signing.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy
        name: Enabled
        data: 1
        type: dword
      notify: Record Windows restart requirement
