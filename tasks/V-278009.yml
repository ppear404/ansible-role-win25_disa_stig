# SPDX-License-Identifier: MIT-0
---
- name: V-278009 - Windows Server 2025 systems requiring data-at-rest protections must employ cryptographic mechanisms
    to prevent unauthorized disclosure and modification of the information at rest.
  when:
    - win25_stig_v_278009 | bool
    - '''V-278009'' not in win25_stig_exceptions'
  tags:
    - V-278009
    - CAT1
  block:
    - name: V-278009 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278009''] }}'
      when: not (win25_stig_manual_reviews.get('V-278009', {}).get('Valid', false) | bool)
