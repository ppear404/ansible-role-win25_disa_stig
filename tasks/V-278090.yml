# SPDX-License-Identifier: MIT-0
---
- name: V-278090 - Windows Server 2025 virtualization-based security must be enabled with the platform security
    level configured to Secure Boot or Secure Boot with DMA Protection.
  when:
    - win25_stig_v_278090 | bool
    - win25_stig_domain_joined
    - win25_stig_enable_virtualization_security
    - '''V-278090'' not in win25_stig_exceptions'
  tags:
    - V-278090
    - CAT2
  block:
    - name: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured
        to Secure Boot or Secure Boot with DMA Protection.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: EnableVirtualizationBasedSecurity
        data: 1
        type: dword
      notify: Record Windows restart requirement
    - name: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured
        to Secure Boot or Secure Boot with DMA Protection.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard
        name: RequirePlatformSecurityFeatures
        data: 1
        type: dword
      notify: Record Windows restart requirement
