# SPDX-License-Identifier: MIT-0
---
- name: V-277991 - Windows Server 2025 shared user accounts must not be permitted.
  when:
    - win25_stig_v_277991 | bool
    - '''V-277991'' not in win25_stig_exceptions'
  tags:
    - V-277991
    - CAT2
  block:
    - name: V-277991 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-277991''] }}'
      when: not (win25_stig_manual_reviews.get('V-277991', {}).get('Valid', false) | bool)
