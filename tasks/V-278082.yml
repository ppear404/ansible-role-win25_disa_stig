# SPDX-License-Identifier: MIT-0
---
- name: V-278082 - Windows Server 2025 Internet Protocol version 6 (IPv6) source routing must be configured to the
    highest protection level to prevent IP source routing.
  when:
    - win25_stig_v_278082 | bool
    - '''V-278082'' not in win25_stig_exceptions'
  tags:
    - V-278082
    - CAT3
  block:
    - name: Windows Server 2025 Internet Protocol version 6 (IPv6) source routing must be configured to the highest
        protection level to prevent IP source routing.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        name: DisableIPSourceRouting
        data: 2
        type: dword
      notify: Record Windows restart requirement
