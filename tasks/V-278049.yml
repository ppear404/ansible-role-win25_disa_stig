# SPDX-License-Identifier: MIT-0
---
- name: V-278049 - Windows Server 2025 must be configured to audit Account Management - Other Account Management
    Events successes.
  when:
    - win25_stig_v_278049 | bool
    - '''V-278049'' not in win25_stig_exceptions'
  tags:
    - V-278049
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Account Management - Other Account Management Events
        successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Other Account Management Events
        audit_type:
          - success
