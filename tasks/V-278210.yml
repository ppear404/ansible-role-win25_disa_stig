# SPDX-License-Identifier: MIT-0
---
- name: 'CAT2 V-278210 - The Windows Server 2025 setting Microsoft network client: Digitally sign communications (always)
    must be configured to Enabled.'
  when:
    - win25_stig_v_278210 | bool
    - '''V-278210'' not in win25_stig_exceptions'
  tags:
    - V-278210
    - CAT2
  block:
    - name: 'CAT2 V-278210 - The Windows Server 2025 setting Microsoft network client: Digitally sign communications (always) must
        be configured to Enabled.'
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name: RequireSecuritySignature
        data: 1
        type: dword
      notify: Record Windows restart requirement
