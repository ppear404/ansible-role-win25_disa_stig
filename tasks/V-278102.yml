# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278102 - Windows Server 2025 administrator accounts must not be enumerated during elevation.
  when:
    - win25_stig_v_278102 | bool
    - '''V-278102'' not in win25_stig_exceptions'
  tags:
    - V-278102
    - CAT2
  block:
    - name: CAT2 V-278102 - Windows Server 2025 administrator accounts must not be enumerated during elevation.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI
        name: EnumerateAdministrators
        data: 0
        type: dword
      notify: Record Windows restart requirement
