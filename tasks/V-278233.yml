# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278233 - Windows Server 2025 UIAccess applications must not be allowed to prompt for elevation without
    using the secure desktop.
  when:
    - win25_stig_v_278233 | bool
    - '''V-278233'' not in win25_stig_exceptions'
  tags:
    - V-278233
    - CAT2
  block:
    - name: CAT2 V-278233 - Windows Server 2025 UIAccess applications must not be allowed to prompt for elevation without using
        the secure desktop.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: EnableUIADesktopToggle
        data: 0
        type: dword
      notify: Record Windows restart requirement
