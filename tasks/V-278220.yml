# SPDX-License-Identifier: MIT-0
---
- name: V-278220 - Windows Server 2025 services using Local System that use Negotiate when reverting to NTLM authentication
    must use the computer identity instead of authenticating anonymously.
  when:
    - win25_stig_v_278220 | bool
    - '''V-278220'' not in win25_stig_exceptions'
  tags:
    - V-278220
    - CAT2
  block:
    - name: Windows Server 2025 services using Local System that use Negotiate when reverting to NTLM authentication
        must use the computer identity instead of authenticating anonymously.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\LSA
        name: UseMachineId
        data: 1
        type: dword
      notify: Record Windows restart requirement
