# SPDX-License-Identifier: MIT-0
---
- name: V-278145 - Windows Server 2025 must use separate, NSA-approved (Type 1) cryptography to protect the directory
    data in transit for directory service implementations at a classified confidentiality level when replication
    data traverses a network cleared to a lower level than the data.
  when:
    - win25_stig_v_278145 | bool
    - win25_stig_is_dc
    - '''V-278145'' not in win25_stig_exceptions'
  tags:
    - V-278145
    - CAT2
  block:
    - name: V-278145 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278145''] }}'
