# SPDX-License-Identifier: MIT-0
---
- name: V-278014 - Windows Server 2025 must automatically remove or disable emergency accounts after the crisis
    is resolved or within 72 hours.
  when:
    - win25_stig_v_278014 | bool
    - '''V-278014'' not in win25_stig_exceptions'
  tags:
    - V-278014
    - CAT2
  block:
    - name: V-278014 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278014''] }}'
      when: not (win25_stig_manual_reviews.get('V-278014', {}).get('Valid', false) | bool)
