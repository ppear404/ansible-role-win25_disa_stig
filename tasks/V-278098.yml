# SPDX-License-Identifier: MIT-0
---
- name: CAT3 V-278098 - Windows Server 2025 Application Compatibility Program Inventory must be prevented from collecting
    data and sending the information to Microsoft.
  when:
    - win25_stig_v_278098 | bool
    - '''V-278098'' not in win25_stig_exceptions'
  tags:
    - V-278098
    - CAT3
  block:
    - name: CAT3 V-278098 - Windows Server 2025 Application Compatibility Program Inventory must be prevented from collecting data
        and sending the information to Microsoft.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat
        name: DisableInventory
        data: 1
        type: dword
      notify: Record Windows restart requirement
