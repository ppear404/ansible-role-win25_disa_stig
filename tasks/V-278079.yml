# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278079 - Windows Server 2025 must be configured to audit System - System Integrity failures.
  when:
    - win25_stig_v_278079 | bool
    - '''V-278079'' not in win25_stig_exceptions'
  tags:
    - V-278079
    - CAT2
  block:
    - name: CAT2 V-278079 - Windows Server 2025 must be configured to audit System - System Integrity failures.
      ansible.windows.win_audit_policy_system:
        subcategory: System Integrity
        audit_type:
          - failure
          - success
