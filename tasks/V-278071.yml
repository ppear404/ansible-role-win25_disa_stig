# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278071 - Windows Server 2025 must be configured to audit Privilege Use - Sensitive Privilege Use failures.
  when:
    - win25_stig_v_278071 | bool
    - '''V-278071'' not in win25_stig_exceptions'
  tags:
    - V-278071
    - CAT2
  block:
    - name: CAT2 V-278071 - Windows Server 2025 must be configured to audit Privilege Use - Sensitive Privilege Use failures.
      ansible.windows.win_audit_policy_system:
        subcategory: Sensitive Privilege Use
        audit_type:
          - failure
          - success
