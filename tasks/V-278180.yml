# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278180 - Windows Server 2025 must restrict unauthenticated Remote Procedure Call (RPC) clients from connecting
    to the RPC server on domain-joined member servers and stand-alone or nondomain-joined systems.
  when:
    - win25_stig_v_278180 | bool
    - not win25_stig_is_dc
    - '''V-278180'' not in win25_stig_exceptions'
  tags:
    - V-278180
    - CAT2
  block:
    - name: CAT2 V-278180 - Windows Server 2025 must restrict unauthenticated Remote Procedure Call (RPC) clients from connecting
        to the RPC server on domain-joined member servers and stand-alone or nondomain-joined systems.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Rpc
        name: RestrictRemoteClients
        data: 1
        type: dword
      notify: Record Windows restart requirement
