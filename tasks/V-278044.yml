# SPDX-License-Identifier: MIT-0
---
- name: V-278044 - Windows Server 2025 permissions for the Security event log must prevent access by nonprivileged
    accounts.
  when:
    - win25_stig_v_278044 | bool
    - '''V-278044'' not in win25_stig_exceptions'
  tags:
    - V-278044
    - CAT2
  block:
    - name: V-278044 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278044''] }}'
