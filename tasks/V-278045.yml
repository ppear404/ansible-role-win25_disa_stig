---
- name: V-278045 - Windows Server 2025 permissions for the System event log must prevent access by nonprivileged
    accounts.
  when:
    - win25_stig_v_278045 | bool
    - '''V-278045'' not in win25_stig_exceptions'
  tags:
    - V-278045
    - CAT2
  block:
    - name: V-278045 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278045''] }}'
