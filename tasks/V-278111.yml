# SPDX-License-Identifier: MIT-0
---
- name: V-278111 - Windows Server 2025 File Explorer shell protocol must run in protected mode.
  when:
    - win25_stig_v_278111 | bool
    - '''V-278111'' not in win25_stig_exceptions'
  tags:
    - V-278111
    - CAT2
  block:
    - name: Windows Server 2025 File Explorer shell protocol must run in protected mode.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name: PreXPSP2ShellProtocolBehavior
        data: 0
        type: dword
      notify: Record Windows restart requirement
