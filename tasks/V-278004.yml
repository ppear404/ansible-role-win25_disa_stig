# SPDX-License-Identifier: MIT-0
---
- name: V-278004 - Windows Server 2025 accounts must require passwords.
  when:
    - win25_stig_v_278004 | bool
    - not win25_stig_is_dc
    - win25_stig_manage_local_password_flags
    - '''V-278004'' not in win25_stig_exceptions'
  tags:
    - V-278004
    - CAT2
  block:
    - name: Windows Server 2025 accounts must require passwords.
      ansible.windows.win_powershell:
        script: |-
          [CmdletBinding(SupportsShouldProcess)]
          param()
          $Ansible.Changed = $false
          $exceptions = @({{ win25_stig_password_exempt_accounts | map('to_json') | join(',') }})
          Get-LocalUser | Where-Object { $_.Enabled -and $_.Name -notin $exceptions } | ForEach-Object {
              $user = $_
              $needsChange = $user.PasswordRequired -eq $false
              if ($needsChange) {
                  $Ansible.Changed = $true
                  if ($PSCmdlet.ShouldProcess($user.Name, 'Set PasswordRequired')) {
                      & net.exe user $user.Name /passwordreq:yes | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw "Could not require a password for $($user.Name)." }
                  }
              }
          }
