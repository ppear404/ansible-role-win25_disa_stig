# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278114 - Windows Server 2025 Remote Desktop Services must always prompt a client for passwords upon connection.
  when:
    - win25_stig_v_278114 | bool
    - '''V-278114'' not in win25_stig_exceptions'
  tags:
    - V-278114
    - CAT2
  block:
    - name: CAT2 V-278114 - Windows Server 2025 Remote Desktop Services must always prompt a client for passwords upon connection.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
        name: fPromptForPassword
        data: 1
        type: dword
      notify: Record Windows restart requirement
