# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278179 - Windows Server 2025 local users on domain-joined member servers must not be enumerated.
  when:
    - win25_stig_v_278179 | bool
    - not win25_stig_is_dc
    - win25_stig_domain_joined
    - '''V-278179'' not in win25_stig_exceptions'
  tags:
    - V-278179
    - CAT2
  block:
    - name: CAT2 V-278179 - Windows Server 2025 local users on domain-joined member servers must not be enumerated.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: EnumerateLocalUsers
        data: 0
        type: dword
      notify: Record Windows restart requirement
