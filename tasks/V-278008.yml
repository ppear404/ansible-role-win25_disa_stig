---
- name: V-278008 - Windows Server 2025 must have software certificate installation files removed.
  when:
    - win25_stig_v_278008 | bool
    - '''V-278008'' not in win25_stig_exceptions'
  tags:
    - V-278008
    - CAT2
  block:
    - name: V-278008 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278008''] }}'
