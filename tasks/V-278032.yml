---
- name: V-278032 - Windows Server 2025 must have Secure Boot enabled.
  when:
    - win25_stig_v_278032 | bool
    - '''V-278032'' not in win25_stig_exceptions'
  tags:
    - V-278032
    - CAT2
  block:
    - name: V-278032 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278032''] }}'
