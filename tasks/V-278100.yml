# SPDX-License-Identifier: MIT-0
---
- name: CAT1 V-278100 - Windows Server 2025 default AutoRun behavior must be configured to prevent AutoRun commands.
  when:
    - win25_stig_v_278100 | bool
    - '''V-278100'' not in win25_stig_exceptions'
  tags:
    - V-278100
    - CAT1
  block:
    - name: CAT1 V-278100 - Windows Server 2025 default AutoRun behavior must be configured to prevent AutoRun commands.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
        name: NoAutorun
        data: 1
        type: dword
      notify: Record Windows restart requirement
