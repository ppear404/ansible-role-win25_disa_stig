# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278019 - Windows Server 2025 must not have the Peer Name Resolution Protocol installed.
  when:
    - win25_stig_v_278019 | bool
    - '''V-278019'' not in win25_stig_exceptions'
  tags:
    - V-278019
    - CAT2
  block:
    - name: CAT2 V-278019 - Windows Server 2025 must not have the Peer Name Resolution Protocol installed.
      ansible.windows.win_feature:
        name: '{{ item }}'
        state: absent
      loop:
        - PNRP
      when: item in win25_stig_available_features
      notify: Record Windows restart requirement
