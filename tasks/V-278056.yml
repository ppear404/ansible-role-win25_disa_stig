# SPDX-License-Identifier: MIT-0
---
- name: V-278056 - Windows Server 2025 must be configured to audit Logon/Logoff - Account Lockout failures.
  when:
    - win25_stig_v_278056 | bool
    - '''V-278056'' not in win25_stig_exceptions'
  tags:
    - V-278056
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Logon/Logoff - Account Lockout failures.
      ansible.windows.win_audit_policy_system:
        subcategory: Account Lockout
        audit_type:
          - failure
          - success
