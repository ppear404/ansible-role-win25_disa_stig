# SPDX-License-Identifier: MIT-0
---
- name: V-278141 - Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must
    have the proper access control permissions.
  when:
    - win25_stig_v_278141 | bool
    - win25_stig_is_dc
    - '''V-278141'' not in win25_stig_exceptions'
  tags:
    - V-278141
    - CAT1
  block:
    - name: V-278141 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278141''] }}'
