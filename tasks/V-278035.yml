# SPDX-License-Identifier: MIT-0
---
- name: V-278035 - Windows Server 2025 must have the period of time before the bad logon counter is reset configured
    to 15 minutes or greater.
  when:
    - win25_stig_v_278035 | bool
    - '''V-278035'' not in win25_stig_exceptions'
  tags:
    - V-278035
    - CAT2
  block:
    - name: Windows Server 2025 must have the period of time before the bad logon counter is reset configured to
        15 minutes or greater.
      community.windows.win_security_policy:
        section: System Access
        key: ResetLockoutCount
        value: 15
      when: not win25_stig_is_dc
