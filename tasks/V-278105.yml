# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278105 - Windows Server 2025 Application event log size must be configured to 32768 KB or greater.
  when:
    - win25_stig_v_278105 | bool
    - '''V-278105'' not in win25_stig_exceptions'
  tags:
    - V-278105
    - CAT2
  block:
    - name: CAT2 V-278105 - Windows Server 2025 Application event log size must be configured to 32768 KB or greater.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application
        name: MaxSize
        data: 32768
        type: dword
      notify: Record Windows restart requirement
