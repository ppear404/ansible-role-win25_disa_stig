# SPDX-License-Identifier: MIT-0
---
- name: V-278068 - Windows Server 2025 must be configured to audit Policy Change - Authentication Policy Change
    successes.
  when:
    - win25_stig_v_278068 | bool
    - '''V-278068'' not in win25_stig_exceptions'
  tags:
    - V-278068
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Policy Change - Authentication Policy Change successes.
      ansible.windows.win_audit_policy_system:
        subcategory: Authentication Policy Change
        audit_type:
          - success
