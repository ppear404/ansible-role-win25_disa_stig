# SPDX-License-Identifier: MIT-0
---
- name: V-278235 - Windows Server 2025 User Account Control (UAC) must automatically deny standard user requests
    for elevation.
  when:
    - win25_stig_v_278235 | bool
    - '''V-278235'' not in win25_stig_exceptions'
  tags:
    - V-278235
    - CAT2
  block:
    - name: Windows Server 2025 User Account Control (UAC) must automatically deny standard user requests for elevation.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: ConsentPromptBehaviorUser
        data: 0
        type: dword
      notify: Record Windows restart requirement
