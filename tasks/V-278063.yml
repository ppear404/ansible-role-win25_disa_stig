# SPDX-License-Identifier: MIT-0
---
- name: V-278063 - Windows Server 2025 must be configured to audit Object Access - Other Object Access Events failures.
  when:
    - win25_stig_v_278063 | bool
    - '''V-278063'' not in win25_stig_exceptions'
  tags:
    - V-278063
    - CAT2
  block:
    - name: Windows Server 2025 must be configured to audit Object Access - Other Object Access Events failures.
      ansible.windows.win_audit_policy_system:
        subcategory: Other Object Access Events
        audit_type:
          - failure
          - success
