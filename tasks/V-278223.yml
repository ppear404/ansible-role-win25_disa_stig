# SPDX-License-Identifier: MIT-0
---
- name: V-278223 - Windows Server 2025 Kerberos encryption types must be configured to prevent the use of DES and
    RC4 encryption suites.
  when:
    - win25_stig_v_278223 | bool
    - '''V-278223'' not in win25_stig_exceptions'
  tags:
    - V-278223
    - CAT2
  block:
    - name: Windows Server 2025 Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption
        suites.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
        name: SupportedEncryptionTypes
        data: 2147483640
        type: dword
      notify: Record Windows restart requirement
