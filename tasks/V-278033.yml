# SPDX-License-Identifier: MIT-0
---
- name: V-278033 - Windows Server 2025 account lockout duration must be configured to 15 minutes or greater.
  when:
    - win25_stig_v_278033 | bool
    - '''V-278033'' not in win25_stig_exceptions'
  tags:
    - V-278033
    - CAT2
  block:
    - name: Windows Server 2025 account lockout duration must be configured to 15 minutes or greater.
      community.windows.win_security_policy:
        section: System Access
        key: LockoutDuration
        value: 15
      when: not win25_stig_is_dc
    - name: V-278033 - Report required domain GPO configuration
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278033 (configure domain account policy
          in the authoritative GPO)''] }}'
      when: win25_stig_is_dc
