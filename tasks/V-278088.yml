# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278088 - Windows Server 2025 command line data must be included in process creation events.
  when:
    - win25_stig_v_278088 | bool
    - '''V-278088'' not in win25_stig_exceptions'
  tags:
    - V-278088
    - CAT2
  block:
    - name: CAT2 V-278088 - Windows Server 2025 command line data must be included in process creation events.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
        name: ProcessCreationIncludeCmdLine_Enabled
        data: 1
        type: dword
      notify: Record Windows restart requirement
