# SPDX-License-Identifier: MIT-0
---
- name: V-278000 - Windows Server 2025 permissions for the Windows installation directory must conform to minimum
    requirements.
  when:
    - win25_stig_v_278000 | bool
    - '''V-278000'' not in win25_stig_exceptions'
  tags:
    - V-278000
    - CAT2
  block:
    - name: V-278000 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278000''] }}'
