# SPDX-License-Identifier: MIT-0
---
- name: V-278025 - Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB
    client.
  when:
    - win25_stig_v_278025 | bool
    - '''V-278025'' not in win25_stig_exceptions'
  tags:
    - V-278025
    - CAT2
  block:
    - name: Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB client.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
        name: Start
        data: 4
        type: dword
      notify: Record Windows restart requirement
