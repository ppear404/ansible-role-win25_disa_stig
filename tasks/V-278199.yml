# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278199 - Windows Server 2025 must force audit policy subcategory settings to override audit policy category
    settings.
  when:
    - win25_stig_v_278199 | bool
    - '''V-278199'' not in win25_stig_exceptions'
  tags:
    - V-278199
    - CAT2
  block:
    - name: CAT2 V-278199 - Windows Server 2025 must force audit policy subcategory settings to override audit policy category settings.
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: SCENoApplyLegacyAuditPolicy
        data: 1
        type: dword
      notify: Record Windows restart requirement
