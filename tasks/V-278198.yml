# SPDX-License-Identifier: MIT-0
---
- name: V-278198 - The Windows Server 2025 built-in guest account must be renamed.
  when:
    - win25_stig_v_278198 | bool
    - '''V-278198'' not in win25_stig_exceptions'
  tags:
    - V-278198
    - CAT2
  block:
    - name: The Windows Server 2025 built-in guest account must be renamed.
      community.windows.win_security_policy:
        section: System Access
        key: NewGuestName
        value: '{{ win25_stig_guest_name }}'
