# SPDX-License-Identifier: MIT-0
---
- name: V-278146 - Windows Server 2025 directory data (outside the root DSE) of a nonpublic directory must be configured
    to prevent anonymous access.
  when:
    - win25_stig_v_278146 | bool
    - win25_stig_is_dc
    - '''V-278146'' not in win25_stig_exceptions'
  tags:
    - V-278146
    - CAT1
  block:
    - name: V-278146 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278146''] }}'
