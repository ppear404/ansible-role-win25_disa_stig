# SPDX-License-Identifier: MIT-0
---
- name: V-278017 - Windows Server 2025 must not have Wi-Fi enabled unless required by the organization.
  when:
    - win25_stig_v_278017 | bool
    - '''V-278017'' not in win25_stig_exceptions'
  tags:
    - V-278017
    - CAT2
  block:
    - name: V-278017 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278017''] }}'
