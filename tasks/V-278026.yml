# SPDX-License-Identifier: MIT-0
---
- name: CAT2 V-278026 - Windows Server 2025 must not have Windows PowerShell 2.0 installed.
  when:
    - win25_stig_v_278026 | bool
    - '''V-278026'' not in win25_stig_exceptions'
  tags:
    - V-278026
    - CAT2
  block:
    - name: CAT2 V-278026 - Windows Server 2025 must not have Windows PowerShell 2.0 installed.
      ansible.windows.win_feature:
        name: '{{ item }}'
        state: absent
      loop:
        - PowerShell-V2
      when: item in win25_stig_available_features
      notify: Record Windows restart requirement
