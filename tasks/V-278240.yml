# SPDX-License-Identifier: MIT-0
---
- name: V-278240 - Windows Server 2025 must preserve zone information when saving attachments.
  when:
    - win25_stig_v_278240 | bool
    - '''V-278240'' not in win25_stig_exceptions'
  tags:
    - V-278240
    - CAT2
  block:
    - name: V-278240 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278240''] }}'
      when: not (win25_stig_manual_reviews.get('V-278240', {}).get('Valid', false) | bool)
