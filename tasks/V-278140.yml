# SPDX-License-Identifier: MIT-0
---
- name: V-278140 - Windows Server 2025 Active Directory (AD) Group Policy Objects (GPOs) must have proper access
    control permissions.
  when:
    - win25_stig_v_278140 | bool
    - win25_stig_is_dc
    - '''V-278140'' not in win25_stig_exceptions'
  tags:
    - V-278140
    - CAT1
  block:
    - name: V-278140 - Record required site remediation or manual review
      ansible.builtin.set_fact:
        win25_stig_pending_controls: '{{ win25_stig_pending_controls + [''V-278140''] }}'
