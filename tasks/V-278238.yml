# SPDX-License-Identifier: MIT-0
---
- name: V-278238 - Windows Server 2025 User Account Control (UAC) must run all administrators in Admin Approval
    Mode, enabling UAC.
  when:
    - win25_stig_v_278238 | bool
    - '''V-278238'' not in win25_stig_exceptions'
  tags:
    - V-278238
    - CAT2
  block:
    - name: Windows Server 2025 User Account Control (UAC) must run all administrators in Admin Approval Mode, enabling
        UAC.
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: EnableLUA
        data: 1
        type: dword
      notify: Record Windows restart requirement
