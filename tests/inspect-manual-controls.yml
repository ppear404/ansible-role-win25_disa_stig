# SPDX-License-Identifier: MIT-0
---
- name: Capture evidence for Windows Server 2025 manual controls
  hosts: win25
  gather_facts: false
  tasks:
    - name: Read host identity account features and protection configuration
      ansible.windows.win_powershell:
        parameters:
          Source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/answer_files/manual/ManualChecks.ps1') }}"
        script: |
          param([string]$Source)
          . ([scriptblock]::Create($Source))
          $Ansible.Changed = $false
          $ErrorActionPreference = 'Stop'
          $data = [ordered]@{}
          $data.os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber
          $data.computer = Get-CimInstance Win32_ComputerSystem | Select-Object PartOfDomain, DomainRole
          $data.accounts = @(Get-LocalUser | Select-Object Name, SID, Enabled, PasswordLastSet, PasswordExpires, Description)
          $data.admins = @(Get-LocalGroupMember -SID 'S-1-5-32-544' | Select-Object Name, SID, ObjectClass)
          $data.features = @(Get-WindowsFeature | Where-Object Installed | Select-Object Name, DisplayName, FeatureType)
          $data.services = @(Get-CimInstance Win32_Service | Where-Object {
              $_.Name -match 'splunk|sense|defend|wuauserv|w32time|appid|sshd|sysmon|ossec|wazuh|elastic|crowd|trellix|mcafee'
          } | Select-Object Name, State, StartMode, PathName, StartName)
          $data.task_accounts = @(Get-ScheduledTask | Select-Object TaskPath, TaskName,
              @{n='UserId';e={$_.Principal.UserId}}, @{n='LogonType';e={$_.Principal.LogonType.ToString()}})
          $data.service_accounts = @(Get-CimInstance Win32_Service | Select-Object Name, StartName)
          $data.hotfixes = @(Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5 HotFixID, InstalledOn)
          $data.update_policy = Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -ErrorAction SilentlyContinue |
              Select-Object NoAutoUpdate, AUOptions, ScheduledInstallDay, ScheduledInstallTime, UseWUServer
          $data.time_configuration = (& w32tm /query /configuration 2>&1 | Out-String)
          $data.time_status = (& w32tm /query /status 2>&1 | Out-String)
          try { $data.applocker = Get-AppLockerPolicy -Effective -Xml } catch { $data.applocker_error = $_.Exception.Message }
          try { $data.bitlocker = @(Get-BitLockerVolume | Select-Object MountPoint, VolumeStatus, ProtectionStatus, EncryptionMethod) }
          catch { $data.bitlocker_error = $_.Exception.Message }
          $data.security_log = Get-WinEvent -ListLog Security | Select-Object MaximumSizeInBytes, RecordCount, LogMode
          $data.listeners = @(Get-NetTCPConnection -State Listen | Select-Object LocalAddress, LocalPort, OwningProcess)
          $data.profiles = @(Get-CimInstance Win32_UserProfile | Where-Object { -not $_.Special } |
              Select-Object SID, LocalPath, Loaded, LastUseTime)
          $data.splunk = Get-UniversalForwarderEvidence
          $Ansible.Result = $data
      register: manual_probe

    - name: Save redacted baseline evidence on the controller
      ansible.builtin.copy:
        content: '{{ manual_probe.result | to_nice_json }}'
        dest: '{{ playbook_dir }}/evidence/manual-controls-baseline.json'
        mode: '0600'
      delegate_to: localhost
