      \ future date.\n\nScroll to the bottom and select \"Subject\".\n\nIf any of the certificates listed do not\
      \ include \"DoD Interoperability Root CA\" in the Subject (CN) name or are expired, this is a finding.\n\n\
      US DoD CCEB Interoperability Root CA 2   \n\nNote: Interoperability cross-certificates will have a different\
      \ value (such as \"...Root CA 6\") in the 'Issued To'  field than in the 'Subject' and 'Issuer' fields."
    fix: 'Install valid and unexpired US DoW CCEB Interoperability Root CA cross-certificate on unclassified systems.


