    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nVerify the following\
      \ is configured in the Default Domain Policy:\n\nOpen \"Group Policy Management\".\n\nNavigate to \"Group\
      \ Policy Objects\" in the Domain being reviewed (Forest >> Domains >> Domain).\n \nRight-click the \"Default\
      \ Domain Policy\".\n\nSelect \"Edit\".\n\nNavigate to Computer Configuration >> Policies >> Windows Settings\
      \ >> Security Settings >> Account Policies >> Kerberos Policy.\n\nIf the \"Maximum tolerance for computer\
      \ clock synchronization\" is greater than \"5\" minutes, this is a finding."
    fix: Configure the policy value in the Default Domain Policy for Computer Configuration >> Windows Settings
      >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum tolerance for computer clock synchronization
      to a maximum of "5" minutes or less.
  V-278138:
    title: Windows Server 2025 permissions on the Active Directory data files must only allow system administrators
      (SAs) access.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Run "Regedit".


      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


      Note the directory locations in the values for:


      Database log files path

      DSA Database file


      By default, they will be \Windows\NTDS.


      If the locations are different, run the following for each:


      Open "command prompt (Admin)".


      Navigate to the NTDS directory (\Windows\NTDS by default).


      Run "icacls *.*".


      If the permissions on each file are not as restrictive as the following, this is a finding:


      NT AUTHORITY\SYSTEM:(I)(F)

      BUILTIN\Administrators:(I)(F)


      (I) - permission inherited from parent container

      (F) - full access'
    fix: 'Maintain the permissions on NTDS database and log files as follows:


      NT AUTHORITY\SYSTEM:(I)(F)

      BUILTIN\Administrators:(I)(F)


      (I) - permission inherited from parent container

      (F) - full access'
  V-278139:
    title: Windows Server 2025 Active Directory SYSVOL directory must have the proper access control permissions.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen a command prompt.\n\
      \nRun \"net share\".\n\nMake note of the directory location of the SYSVOL share.\n\nBy default, this will\
      \ be \\Windows\\SYSVOL\\sysvol. For this requirement, permissions will be verified at the first SYSVOL directory\
      \ level.\n\nIf any standard user accounts or groups have greater than \"Read & execute\" permissions, this\
      \ is a finding. \n\nThe default permissions noted below meet this requirement:\n\nOpen command prompt.\n\n\
      Run \"icacls c:\\Windows\\SYSVOL\".\n\nThe following results must be displayed:\n\nNT AUTHORITY\\Authenticated\
      \ Users:(RX)\nNT AUTHORITY\\Authenticated Users:(OI)(CI)(IO)(GR,GE)\nBUILTIN\\Server Operators:(RX)\nBUILTIN\\\
      Server Operators:(OI)(CI)(IO)(GR,GE)\nBUILTIN\\Administrators:(M,WDAC,WO)\nBUILTIN\\Administrators:(OI)(CI)(IO)(F)\n\
      NT AUTHORITY\\SYSTEM:(F)\nNT AUTHORITY\\SYSTEM:(OI)(CI)(IO)(F)\nCREATOR OWNER:(OI)(CI)(IO)(F)\n\n(RX) - Read\
      \ & execute \n\nRun \"icacls /help\" to view definitions of other permission codes."
    fix: 'Maintain the permissions on the SYSVOL directory. Do not allow greater than "Read & execute" permissions
      for standard user accounts or groups. The defaults below meet this requirement:


      C:\Windows\SYSVOL

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      Authenticated Users - Read & execute - This folder, subfolder, and files

      Server Operators - Read & execute- This folder, subfolder, and files

      Administrators - Special - This folder only (Special = Basic Permissions: all selected except Full control)

      CREATOR OWNER - Full control - Subfolders and files only

      Administrators - Full control - Subfolders and files only

      SYSTEM - Full control - This folder, subfolders, and files'
  V-278140:
    title: Windows Server 2025 Active Directory (AD) Group Policy Objects (GPOs) must have proper access control
      permissions.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nReview the permissions\
      \ on GPOs.\n\nOpen \"Group Policy Management\" (available from various menus or run \"gpmc.msc\").\n\nNavigate\
      \ to \"Group Policy Objects\" in the domain being reviewed (Forest >> Domains >> Domain).\n\nFor each GPO:\n\
      \nSelect the GPO item in the left pane.\n\nSelect the \"Delegation\" tab in the right pane.\n\nSelect \"Advanced\"\
      .\n\nSelect each Group or user name.\n\nView the permissions.\n\nIf any standard user accounts or groups have\
      \ \"Allow\" permissions greater than \"Read\" and \"Apply group policy\", this is a finding.\n\nOther access\
      \ permissions that allow the objects to be updated are considered findings unless specifically documented\
      \ by the information system security officer (ISSO).\n\nThe default permissions noted below satisfy this requirement.\
      \ \n\nThe permissions shown are at the summary level. More detailed permissions can be viewed by selecting\
      \ the next \"Advanced\" button, the desired Permission entry, and the \"Edit\" button.\n\nAuthenticated Users\
      \ - Read, Apply group policy, Special permissions\n\nThe special permissions for Authenticated Users are for\
      \ Read-type Properties. If detailed permissions include any Create, Delete, Modify, or Write Permissions,\
      \ or Properties, this is a finding.\n\nThe special permissions for the following default groups are not the\
      \ focus of this requirement and may include a wide range of permissions and properties:\n\nCREATOR OWNER -\
      \ Special permissions\nSYSTEM - Read, Write, Create all child objects, Delete all child objects, Special permissions\n\
      Domain Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions\nEnterprise\
      \ Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions\nENTERPRISE\
      \ DOMAIN CONTROLLERS - Read, Special permissions\n\nThe Domain Admins and Enterprise Admins will not have\
      \ the \"Delete all child objects\" permission on the two default Group Policy objects: Default Domain Policy\
      \ and Default Domain Controllers Policy. They will have this permission on organization created Group Policy\
      \ objects."
    fix: 'Maintain the permissions on GPOs to not allow greater than "Read" and "Apply group policy" for standard
      user accounts or groups. The default permissions below meet this requirement:


      Authenticated Users - Read, Apply group policy, Special permissions


      The special permissions for Authenticated Users are for Read-type Properties.


      CREATOR OWNER - Special permissions

      SYSTEM - Read, Write, Create all child objects, Delete all child objects, Special permissions

      Domain Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions

      Enterprise Admins - Read, Write, Create all child objects, Delete all child objects, Special permissions

      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions


      Document any other access permissions that allow the objects to be updated with the ISSO.


      The Domain Admins and Enterprise Admins will not have the "Delete all child objects" permission on the two
      default Group Policy objects: Default Domain Policy and Default Domain Controllers Policy. They will have
      this permission on created GPOs.'
  V-278141:
    title: Windows Server 2025 Active Directory Domain Controllers Organizational Unit (OU) object must have the
      proper access control permissions.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Review the permissions on the Domain Controllers OU.


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select "Advanced Features" in the "View" menu if not previously selected.


      Select the "Domain Controllers" OU (folder in folder icon).


      Right-click and select "Properties".


      Select the "Security" tab.


      If the permissions on the Domain Controllers OU do not restrict changes to System, Domain Admins, Enterprise
      Admins and Administrators, this is a finding.


      The default permissions listed below satisfy this requirement.


      Domains supporting Microsoft Exchange will have additional Exchange related permissions on the Domain Controllers
      OU. These may include some change-related permissions and is not a finding.


      The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then
      select the desired Permission entry, then click "View" or "Edit".


      Except where noted otherwise, the special permissions may include a wide range of permissions and properties
      and are acceptable for this requirement.


      CREATOR OWNER - Special permissions


      SELF - Special permissions


      Authenticated Users - Read, Special permissions


      The special permissions for Authenticated Users are Read types.


      If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties, this is a
      finding.


      SYSTEM - Full Control


      Domain Admins - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Enterprise Admins - Full Control


      Key Admins - Special permissions


      Enterprise Key Admins - Special permissions


      Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Pre-Windows 2000 Compatible Access - Special permissions


      The Special permissions for Pre-Windows 2000 Compatible Access are Read types.


      If detailed permissions include any Create, Delete, Modify, or Write Permissions or Properties, this is a
      finding.


      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions'
    fix: 'Limit the permissions on the Domain Controllers OU to restrict changes to System, Domain Admins, Enterprise
      Admins, and Administrators.


      The default permissions listed below satisfy this requirement.


      Domains supporting Microsoft Exchange will have additional Exchange-related permissions on the Domain Controllers
      OU. These may include some change-related permissions.


      CREATOR OWNER - Special permissions


      SELF - Special permissions


      Authenticated Users - Read, Special permissions


      The special permissions for Authenticated Users are Read types.


      SYSTEM - Full Control


      Domain Admins - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Enterprise Admins - Full Control


      Key Admins - Special permissions


      Enterprise Key Admins - Special permissions


      Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Pre-Windows 2000 Compatible Access - Special permissions


      The special permissions for Pre-Windows 2000 Compatible Access are Read types.


      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions'
  V-278142:
    title: Windows Server 2025 organization created Active Directory Organizational Unit (OU) objects must have
      proper access control permissions.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Review the permissions on domain-defined OUs.


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Ensure "Advanced Features" is selected in the "View" menu.


      For each OU that is defined (folder in folder icon) excluding the Domain Controllers OU:


      Right-click the OU and select "Properties".


      Select the "Security" tab.


      If the Allow type permissions on the OU are not at least as restrictive as those below, this is a finding.


      The permissions shown are at the summary level. To view more detailed permissions, select "Advanced", then
      select the desired Permission entry, then click "View" or "Edit".


      Except where noted otherwise, the special permissions may include a wide range of permissions and properties
      and are acceptable for this requirement.


      CREATOR OWNER - Special permissions


      Self - Special permissions


      Authenticated Users - Read, Special permissions


      The Special permissions for Authenticated Users are Read type. If detailed permissions include any Create,
      Delete, Modify, or Write Permissions or Properties, this is a finding.


      SYSTEM - Full Control


      Domain Admins - Full Control


      Enterprise Admins - Full Control


      Key Admins - Special permissions


      Enterprise Key Admins - Special permissions


      Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Pre-Windows 2000 Compatible Access - Special permissions


      The Special permissions for Pre-Windows 2000 Compatible Access are for Read types. If detailed permissions
      include any Create, Delete, Modify, or Write Permissions or Properties, this is a finding.


      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions


      If an information system security officer (ISSO)-approved distributed administration model (help desk or other
      user support staff) is implemented, permissions above Read may be allowed for groups documented by the ISSO.


      If any OU with improper permissions includes identification or authentication data (e.g., accounts, passwords,
      or password hash data) used by systems to determine access control, the severity is CAT I (e.g., OUs that
      include user accounts, including service/application accounts).


      If an OU with improper permissions does not include identification and authentication data used by systems
      to determine access control, the severity is CAT II (e.g., Workstation, Printer OUs).'
    fix: 'Maintain the Allow type permissions on domain-defined OUs to be at least as restrictive as the defaults
      below.


      Document any additional permissions above Read with the ISSO if an approved distributed administration model
      (help desk or other user support staff) is implemented.


      CREATOR OWNER - Special permissions


      Self - Special permissions


      Authenticated Users - Read, Special permissions


      The special permissions for Authenticated Users are Read type.


      SYSTEM - Full Control


      Domain Admins - Full Control


      Enterprise Admins - Full Control


      Key Admins - Special permissions


      Enterprise Key Admins - Special permissions


      Administrators - Read, Write, Create all child objects, Generate resultant set of policy (logging), Generate
      resultant set of policy (planning), Special permissions


      Pre-Windows 2000 Compatible Access - Special permissions


      The special permissions for Pre-Windows 2000 Compatible Access are for Read types.


      ENTERPRISE DOMAIN CONTROLLERS - Read, Special permissions'
  V-278143:
    title: Windows Server 2025 data files owned by users must be on a different logical partition from the directory
      server data files.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Run "Regedit".


      Navigate to "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters".


      Note the directory locations in the values for "DSA Database file".


      Open a command prompt.


      Enter "net share".


      Note the logical drive(s) or file system partition for any organization-created data shares.


      Ignore system shares (e.g., NETLOGON, SYSVOL, and administrative shares ending in $). User shares that are
      hidden (ending with $) must not be ignored.


      If user shares are located on the same logical partition as the directory server data files, this is a finding.'
    fix: Move shares used to store files owned by users to a different logical partition than the directory server
      data files.
  V-278144:
    title: Windows Server 2025 domain controllers must run on a machine dedicated to that function.
    severity: medium
    implementation: assessed
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers, it is not applicable for other systems.\n\nReview the installed\
      \ roles the domain controller is supporting.\n\nStart Server Manager.\n\nSelect \"AD DS\" in the left pane\
      \ then select the server name under \"Servers\" to the right.\n\nSelect \"Add (or Remove) Roles and Features\"\
      \ from \"Tasks\" in the \"Roles and Features\" section. (Cancel before any changes are made.)\n\nDetermine\
      \ if any additional server roles are installed. A basic domain controller setup will include the following:\n\
      - Active Directory Domain Services.\n- DNS Server.\n- File and Storage Services.\n\nIf any roles not requiring\
      \ installation on a domain controller are installed, this is a finding. \n\nA Domain Name System (DNS) server\
      \ integrated with the directory server (e.g., AD-integrated DNS) is an acceptable application. However, the\
      \ DNS server must comply with the DNS STIG security requirements.\n\nRun \"Programs and Features\".\n\nReview\
      \ installed applications.\n\nIf any applications are installed that are not required for the domain controller,\
      \ this is a finding."
    fix: Remove additional roles or applications such as web, database, and email from the domain controller.
  V-278145:
    title: Windows Server 2025 must use separate, NSA-approved (Type 1) cryptography to protect the directory data
      in transit for directory service implementations at a classified confidentiality level when replication data
      traverses a network cleared to a lower level than the data.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Review the organization network diagram(s) or documentation to determine the level of classification for the
      network(s) over which replication data is transmitted.


      Determine the classification level of the Windows domain controller.


      If the classification level of the Windows domain controller is higher than the level of the networks, review
      the organization network diagram(s) and directory implementation documentation to determine if NSA-approved
      encryption is used to protect the replication network traffic.


      If the classification level of the Windows domain controller is higher than the level of the network traversed
      and NSA-approved encryption is not used, this is a finding.'
    fix: Configure NSA-approved (Type 1) cryptography to protect the directory data in transit for directory service
      implementations at a classified confidentiality level that transfer replication data through a network cleared
      to a lower level than the data.
  V-278146:
    title: Windows Server 2025 directory data (outside the root DSE) of a nonpublic directory must be configured
      to prevent anonymous access.
    severity: high
    implementation: assessed
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen command prompt (not\
      \ elevated).\n\nRun \"ldp.exe\".\n\nFrom the \"Connection menu\", select \"Bind\".\n\nClear the User, Password,\
      \ and Domain fields.\n\nSelect \"Simple bind\" for the Bind type, and then click \"OK\".\n\nConfirmation of\
      \ anonymous access will be displayed at the end:\n\nres = ldap_simple_bind_s\nAuthenticated as: 'NT AUTHORITY\\\
      ANONYMOUS LOGON'\n\nFrom the \"Browse\" menu, select \"Search\".\n\nIn the Search dialog, enter the DN of\
      \ the domain naming context (e.g., \"dc=disaost,dc=mil\") in the Base DN field.\n\nClear the Attributes field\
      \ and select \"Run\".\n\nError messages must display related to Bind and user not authenticated.\n\nIf attribute\
      \ data is displayed, anonymous access is enabled to the domain naming context and this is a finding.\n\nThe\
      \ following network controls allow the finding severity to be downgraded to a CAT II since these measures\
      \ lower the risk associated with anonymous access.\n\nNetwork hardware ports at the site are subject to 802.1x\
      \ authentication or MAC address restrictions. \n\nPremise firewall or host restrictions prevent access to\
      \ ports 389, 636, 3268, and 3269 from client hosts not explicitly identified by domain (.mil) or IP address."
    fix: 'Configure directory data (outside the root DSE) of a nonpublic directory to prevent anonymous access.


      For AD, there are multiple configuration items that could enable anonymous access.


      Changing the access permissions on the domain naming context object (from the secure defaults) could enable
      anonymous access. If the check procedures indicate this is the cause, the process that was used to change
      the permissions must be reversed. This could have been through the Windows Support Tools ADSI Edit console
      (adsiedit.msc).


      The dsHeuristics option is used. This is addressed in the check for AD.0230 in the AD Forest STIG.'
  V-278147:
    title: Windows Server 2025 directory service must be configured to terminate LDAP-based network connections
      to the directory server after five minutes of inactivity.
    severity: low
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nOpen an elevated command\
      \ prompt (run as administrator).\n\nEnter \"ntdsutil\".\n\nAt the \"ntdsutil:\" prompt, enter \"LDAP policies\"\
      .\n\nAt the \"ldap policy:\" prompt, enter \"connections\".\n\nAt the \"server connections:\" prompt, enter\
      \ \"connect to server [host-name]\"\n(where [host-name] is the computer name of the domain controller).\n\n\
      At the \"server connections:\" prompt, enter \"q\".\n\nAt the \"ldap policy:\" prompt, enter \"show values\"\
      . \n\nIf the value for MaxConnIdleTime is greater than \"300\" (5 minutes) or is not specified, this is a\
      \ finding.\n\nEnter \"q\" at the \"ldap policy:\" and \"ntdsutil:\" prompts to exit.\n\nAlternately, Dsquery\
      \ can be used to display MaxConnIdleTime:\n\nOpen \"command prompt (Admin)\".\n\nEnter the following command\
      \ (on a single line).\n\ndsquery * \"cn=Default Query Policy,cn=Query-Policies,cn=Directory Service, cn=Windows\
      \ NT,cn=Services,cn=Configuration,dc=[forest-name]\" -attr LDAPAdminLimits \n\nThe quotes are required and\
      \ dc=[forest-name] is the fully qualified LDAP name of the domain being reviewed (e.g., dc=disaost,dc=mil).\n\
      \nIf the results do not specify a \"MaxConnIdleTime\" or it has a value greater than \"300\" (5 minutes),\
      \ this is a finding."
    fix: 'Configure the directory service to terminate LDAP-based network connections to the directory server after
      5 minutes of inactivity.


      Open an elevated command prompt (run as administrator).


      Enter "ntdsutil".


      At the "ntdsutil:" prompt, enter "LDAP policies".


      At the "ldap policy:" prompt, enter "connections".


      At the "server connections:" prompt, enter "connect to server [host-name]" (where [host-name] is the computer
      name of the domain controller).


      At the "server connections:" prompt, enter "q".


      At the "ldap policy:" prompt, enter "Set MaxConnIdleTime to 300".


      Enter "Commit Changes" to save.


      Enter "Show values" to verify changes.


      Enter "q" at the "ldap policy:" and "ntdsutil:" prompts to exit.'
  V-278148:
    title: Windows Server 2025 Active Directory Group Policy Objects (GPOs) must be configured with proper audit
      settings.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Review the auditing configuration for all GPOs.


      Open "Group Policy Management" (available from various menus or run "gpmc.msc").


      Navigate to "Group Policy Objects" in the domain being reviewed (Forest >> Domains >> Domain).


      For each GPO:


      Select the GPO item in the left pane.


      Select the "Delegation" tab in the right pane.


      Select "Advanced".


      Select "Advanced", and then select the "Auditing" tab.


      If the audit settings for any GPO are not at least as inclusive as those below, this is a finding:


      Type - Fail

      Principal - Everyone

      Access - Full Control

      Applies to - This object and all descendant objects or Descendant groupPolicyContainer objects


      The three Success types listed below are defaults inherited from the Parent Object. Where Special is listed
      in the summary screens for Access, detailed Permissions are provided for reference.


      Type - Success

      Principal - Everyone

      Access - Special (Permissions: Write all properties, Modify permissions; Properties: all "Write" type selected)

      Inherited from - Parent Object

      Applies to - Descendant groupPolicyContainer objects


      Two instances with the following summary information will be listed:


      Type - Success

      Principal - Everyone

      Access - blank (Permissions: none selected; Properties: one instance - Write gPLink, one instance - Write
      gPOptions)

      Inherited from - Parent Object

      Applies to - Descendant Organization Unit Objects'
    fix: 'Configure the audit settings for GPOs to include the following:


      This can be done at the Policy level in AD to apply to all group policies.


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select "Advanced Features" from the "View" menu.


      Navigate to [Domain] >> System >> Policies in the left panel.


      Right-click "Policies", and then select "Properties".


      Select the "Security" tab.


      Select "Advanced".


      Select the "Auditing" tab.


      Type - Fail

      Principal - Everyone

      Access - Full Control

      Applies to - This object and all descendant objects or Descendant groupPolicyContainer objects


      The three Success types listed below are defaults inherited from the Parent Object. Where Special is listed
      in the summary screens for Access, detailed Permissions are provided for reference.


      Type - Success

      Principal - Everyone

      Access - Special (Permissions: Write all properties, Modify permissions; Properties: all "Write" type selected)

      Inherited from - Parent Object

      Applies to - Descendant groupPolicyContainer objects


      Two instances with the following summary information will be listed:


      Type - Success

      Principal - Everyone

      Access - blank (Permissions: none selected; Properties: one instance - Write gPLink, one instance - Write
      gPOptions)

      Inherited from - Parent Object

      Applies to - Descendant Organization Unit Objects'
