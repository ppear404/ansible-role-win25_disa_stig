  V-278182:
    title: Windows Server 2025 must restrict remote calls to the Security Account Manager (SAM) to Administrators
      on domain-joined member servers and stand-alone or nondomain-joined systems.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_is_dc
    check: 'This applies to member servers and stand-alone or nondomain-joined systems; it is not applicable for
      domain controllers.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\


      Value Name: RestrictRemoteSAM


      Value Type: REG_SZ

      Value: O:BAG:BAD:(A;;RC;;;BA)'
    fix: "Navigate to the policy Computer Configuration >> Windows Settings >> Security Settings >> Local Policies\
      \ >> Security Options >> Network access: Restrict clients allowed to make remote calls to SAM. \n\nSelect\
      \ \"Edit Security\" to configure the \"Security descriptor:\".\n\nAdd \"Administrators\" in \"Group or user\
      \ names:\" if it is not already listed (this is the default).\n\nSelect \"Administrators\" in \"Group or user\
      \ names:\".\n\nSelect \"Allow\" for \"Remote Access\" in \"Permissions for \"Administrators\".\n\nClick \"\
      OK\".\n\nThe \"Security descriptor:\" must be populated with \"O:BAG:BAD:(A;;RC;;;BA) for the policy to be\
      \ enforced."
  V-278183:
    title: Windows Server 2025 "Access this computer from the network" user right must only be assigned to the Administrators
      and Authenticated Users groups on domain-joined member servers and stand-alone or nondomain-joined systems.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_is_dc
    check: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies
      to domain controllers.


      Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment.


      If any accounts or groups other than the following are granted the "Access this computer from the network"
      user right, this is a finding:

      - Administrators.

      - Authenticated Users.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding:


      S-1-5-32-544 (Administrators)

      S-1-5-11 (Authenticated Users)


      If an application requires this user right, this is not a finding.


      Vendor documentation must support the requirement for having the user right.


      The requirement must be documented with the information system security officer (ISSO).


      The application account must meet requirements for application account passwords, such as length (WN25-00-000050)
      and required frequency of changes (WN25-00-000060).'
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment >> Access this computer from the network to include only the following
      accounts or groups:

      - Administrators.

      - Authenticated Users.'
  V-278184:
    title: The Windows Server 2025 "Deny access to this computer from the network" user right on domain-joined member
      servers must be configured to prevent access from highly privileged domain accounts and local accounts and
      from unauthenticated access on all systems.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_is_dc
      - not win25_stig_domain_joined or (win25_stig_domain_sid | length > 0 and win25_stig_forest_root_sid | length
        > 0)
    check: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies
      to domain controllers.


      Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment.


      If the following accounts or groups are not defined for the "Deny access to this computer from the network"
      user right, this is a finding:


      Domain Systems Only:

      - Enterprise Admins group.

      - Domain Admins group.

      - "Local account and member of Administrators group" or "Local account" (see Note below).


      All Systems:

      - Guests group.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If the following SIDs are not defined for the "SeDenyNetworkLogonRight" user right, this is a finding.


      Domain Systems Only:

      S-1-5-root domain-519 (Enterprise Admins)

      S-1-5-domain-512 (Domain Admins)

      S-1-5-114 ("Local account and member of Administrators group") or S-1-5-113 ("Local account")


      All Systems:

      S-1-5-32-546 (Guests)


      Note: These are built-in security groups. "Local account" is more restrictive but may cause issues on servers
      such as systems that provide failover clustering.'
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment >> Deny access to this computer from the network to include the following:


      Domain Systems Only:

      - Enterprise Admins group.

      - Domain Admins group.

      - "Local account and member of Administrators group" or "Local account" (see Note below).


      All Systems:

      - Guests group.


      Note: These are built-in security groups. "Local account" is more restrictive but may cause issues on servers
      such as systems that provide failover clustering.'
