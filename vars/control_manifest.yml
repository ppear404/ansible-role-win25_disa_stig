  V-278087:
    title: Windows Server 2025 hardened Universal Naming Convention (UNC) paths must be defined to require mutual
      authentication and integrity for at least the \\*\SYSVOL and \\*\NETLOGON shares.
    severity: medium
    implementation: automated
    conditions: []
    check: 'This requirement is applicable to domain-joined systems. For stand-alone or nondomain-joined systems,
      this is not applicable.


      If the following registry values do not exist or are not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths\


      Value Name: \\*\NETLOGON

      Value Type: REG_SZ

      Value: RequireMutualAuthentication=1, RequireIntegrity=1


      Value Name: \\*\SYSVOL

      Value Type: REG_SZ

      Value: RequireMutualAuthentication=1, RequireIntegrity=1


      Additional entries would not be a finding.'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> Network >> Network
      Provider >> Hardened UNC Paths" to "Enabled" with at least the following configured in "Hardened UNC Paths"
      (click "Show" to display):


      Value Name: \\*\SYSVOL

      Value: RequireMutualAuthentication=1, RequireIntegrity=1


      Value Name: \\*\NETLOGON

