  V-278190:
    title: Windows Server 2025 must be running Credential Guard on domain-joined member servers.
    severity: high
    implementation: automated
    conditions:
      - win25_stig_domain_joined
      - not win25_stig_is_dc
      - not win25_stig_exchange_server
      - win25_stig_enable_credential_guard_uefi_lock
    check: 'For domain controllers and standalone or nondomain-joined systems, this is not applicable.


      If the system is being used as an Exchange server, this requirement is not applicable.


      Open PowerShell with elevated privileges (run as administrator).


      Enter the following:


      "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"


      If "SecurityServicesRunning" does not include a value of "1" (e.g., "{1, 2}"), this is a finding.


      Alternately:


      Run "System Information".


      Under "System Summary", verify the following:


      If "Device Guard Security Services Running" does not list "Credential Guard", this is a finding.


      The policy settings referenced in the Fix section will configure the following registry value. However, due
      to hardware requirements, the registry value alone does not ensure proper function.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\


      Value Name: LsaCfgFlags

      Value Type: REG_DWORD

      Value: 0x00000001 (1) (Enabled with UEFI lock)


      A Microsoft article on Credential Guard system requirements can be found at the following link:


      https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements'
    fix: "Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device\
      \ Guard >> Turn On Virtualization Based Security to \"Enabled\" with \"Enabled with UEFI lock\" selected for\
      \ \"Credential Guard Configuration\".\n\nA Microsoft article on Credential Guard system requirements can be\
      \ found at the following link:\nhttps://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-requirements\n\
      \nSeverity Override Guidance: The AO can allow the severity override if they have reviewed the overall protection\
      \ provided to the affected servers that are not capable of complying with the Credential Guard requirement.\
      \ Items that must be reviewed/considered for compliance or mitigation for non-Credential Guard compliance\
      \ are:\n\n- The use of Windows Local Administrator Password Solution (LAPS) or similar products to control\
      \ different local administrative passwords for all affected servers. This is to include a strict password\
      \ change requirement (180 days or less).\n\n- Strict separation of roles and duties. Server administrator\
      \ credentials cannot be used on Windows desktop to administer it. Documentation of all exceptions must be\
      \ supplied.\n\n- Use of a Privileged Access Workstation (PAW) and adherence to the Clean Source principle\
      \ for administering affected servers. \n\n- Boundary Protection that is currently in place to protect from\
      \ vulnerabilities in the network/servers.\n\n- Windows Defender rule block credential stealing from LSASS.exe\
      \ is applied. This rule can only be applied if Windows Defender is in use.\n\n- The overall number of vulnerabilities\
      \ that are unmitigated on the network/servers."
  V-278192:
    title: Windows Server 2025 must have the DoW Root Certificate Authority (CA) certificates installed in the Trusted
      Root Store.
    severity: medium
    implementation: automated
    conditions: []
    check: "Verify the DoW Root CA certificates are installed as Trusted Root Certification Authorities.\n\nThe\
      \ certificates referenced below apply to unclassified systems. Refer to the PKE documentation for other networks.\n\
      \nOpen PowerShell as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\\
      root | Where Subject -Like \"*DOD*\" | FL Subject, NotAfter\n\nIf valid (and unexpired) DoW Root CA certificates\
      \ (such as those below) are not listed, this is a finding.\n\nNote: The Common Names (CN) below are examples.\
      \ Verify that the \"CN\" displayed is a DoW Root CA and is not expired. \n\nSubject: CN=DOD Root CA 3, OU=PKI,\
      \ OU=DOD, O=U.S. Government, C=US\nNotAfter: 12/30/2029\n\nSubject: CN=DOD Root CA 5, OU=PKI, OU=DOD, O=U.S.\
      \ Government, C=US\nNotAfter: 6/14/2041\n\nSubject: CN=DOD Root CA 6, OU=PKI, OU=DOD, O=U.S. Government, C=US\n\
      NotAfter: 1/24/2053\n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\",\
      \ \"Add/Remove Snap-in\".\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and\
      \ click \"Next\".\n\nSelect \"Local computer: (the computer this console is running on)\" and click \"Finish\"\
      .\n\nClick \"OK\".\n\nExpand \"Certificates\" and navigate to \"Trusted Root Certification Authorities >>\
      \ Certificates\".\n\nFor each of the DoW Root CA certificates noted below:\n\nRight-click the certificate\
      \ and select \"Open\".\n\nSelect the \"Details\" tab.\n\nVerify that expiration date is in the future.\n\n\
      If valid (unexpired) DoW Root CA certificates (such as those below) are not listed, this is a finding.\n\n\
      DOD Root CA 3\nDOD Root CA 5\nDOD Root CA 6"
    fix: 'Install valid and unexpired DoW Root CA certificates.


      DOD Root CA 3

      DOD Root CA 5

      DOD Root CA 6


      The InstallRoot tool is available on Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files.
      Certificate bundles published by the PKI can be found at https://crl.gds.disa.mil/.'
  V-278193:
    title: Windows Server 2025 must have the DoW Interoperability Root Certificate Authority (CA) cross-certificates
      installed in the Untrusted Certificates Store on unclassified systems.
    severity: medium
    implementation: automated
    conditions: []
    check: "This is applicable to unclassified systems. It is not applicable for others.\n\nOpen \"PowerShell\"\
      \ as an administrator.\n\nExecute the following command:\n\nGet-ChildItem -Path Cert:Localmachine\\disallowed\
      \ | Where {$_.Issuer -Like \"*DOD Interoperability*\" -and $_.Subject -Like \"*DOD*\"} | FL Subject, NotAfter\n\
      \nIf valid DoW Interoperability cross-certificates (such as those below) are not listed, this is a finding.\
      \ \n\nSubject: CN=DoD Interoperability Root CA 2, OU=PKI, OU=DoD, O=U.S. Government, C=US\nNotAfter: 11/24/2030\
      \ \n\nAlternately, use the Certificates MMC snap-in:\n\nRun \"MMC\".\n\nSelect \"File\", \"Add/Remove Snap-in\"\
      .\n\nSelect \"Certificates\" and click \"Add\".\n\nSelect \"Computer account\" and click \"Next\".\n\nSelect\
      \ \"Local computer: (the computer this console is running on)\" and click \"Finish\".\n\nClick \"OK\".\n\n\
      Expand \"Certificates\" and navigate to Untrusted Certificates >> Certificates.\n\nFor each DoW Interoperability\
      \ Root CA certificate displayed:\n\nRight-click the certificate and select \"Open\".\n\nSelect the \"Details\"\
      \ tab.\n\nVerify that the Expiration Date is a future date.\n\nScroll to the bottom and select \"Subject\"\
      .\n\nIf any of the certificates listed do not include \"DoD Interoperability Root CA\" in the Subject name\
      \ or are expired, this is a finding.\n\nNote: The list below should not be relied upon as a complete set of\
      \ possible DoW Interoperability Root CA certificates.\n\nDOD Interoperability Root CA 2\n\nNote: Interoperability\
      \ cross-certificates will have a different value (such as \"...Root CA 6\") in the 'Issued To'  field than\
      \ in the 'Subject' and 'Issuer' fields."
    fix: "Install valid and unexpired DoW Interoperability Root CA cross-certificates on unclassified systems.\n\
      \nThe list below is not to be treated as exhaustive. The STIG should not be used as a definitive resource\
      \ for the organizationally approved certificates for the systems.\n\nDoD Interoperability Root CA 2 \n\nAdministrators\
      \ must run the Federal Bridge Certification Authority (FBCA) Cross-Certificate Removal Tool once as an administrator\
      \ and once as the current user.\n\nThe FBCA Cross-Certificate Remover Tool and User Guide are available on\
      \ Cyber Exchange at https://cyber.mil/pki-pke/tools-configuration-files. Certificate bundles published by\
      \ the PKI can be found at https://crl.gds.disa.mil/."
