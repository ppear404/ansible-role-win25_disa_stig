  V-278046:
    title: Windows Server 2025 Event Viewer must be protected from unauthorized modification and deletion.
    severity: medium
    implementation: manual
    conditions: []
    check: 'This is not applicable for Windows Core Edition.


      Navigate to "%SystemRoot%\System32".


      View the permissions on "Eventvwr.exe".


      If any groups or accounts other than TrustedInstaller have "Full control" or "Modify" permissions, this is
      a finding.


      The default permissions below satisfy this requirement:


      TrustedInstaller - Full Control

      Administrators, SYSTEM, Users, ALL APPLICATION PACKAGES, ALL RESTRICTED APPLICATION PACKAGES - Read & Execute'
    fix: 'Configure the permissions on the "Eventvwr.exe" file to prevent modification by any groups or accounts
      other than TrustedInstaller. The default permissions listed below satisfy this requirement:


      TrustedInstaller - Full Control

      Administrators, SYSTEM, Users, ALL APPLICATION PACKAGES, ALL RESTRICTED APPLICATION PACKAGES - Read & Execute


      The default location is the "%SystemRoot%\System32" folder.'
