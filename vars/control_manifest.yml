  V-278090:
    title: Windows Server 2025 virtualization-based security must be enabled with the platform security level configured
      to Secure Boot or Secure Boot with DMA Protection.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_domain_joined
      - win25_stig_enable_virtualization_security
    check: 'For stand-alone or nondomain-joined systems, this is not applicable.


      Open PowerShell with elevated privileges (run as administrator).


      Enter the following:


      "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard"


      If "RequiredSecurityProperties" does not include a value of "2" indicating "Secure Boot" (e.g., "{1, 2}"),
      this is a finding.


      If "Secure Boot and DMA Protection" is configured, "3" will also be displayed in the results (e.g., "{1, 2,
      3}").


      If "VirtualizationBasedSecurityStatus" is not a value of "2" indicating "Running", this is a finding.


      Alternately:


      Run "System Information".


      Under "System Summary", verify the following:


      If "Device Guard Virtualization based security" does not display "Running", this is a finding.


      If "Device Guard Required Security Properties" does not display "Base Virtualization Support, Secure Boot",
      this is a finding.


      If "Secure Boot and DMA Protection" is configured, "DMA Protection" will also be displayed (e.g., "Base Virtualization
      Support, Secure Boot, DMA Protection").


      The policy settings referenced in the Fix section will configure the following registry values; however, due
      to hardware requirements, the registry values alone do not ensure proper function.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\


      Value Name: EnableVirtualizationBasedSecurity

      Value Type: REG_DWORD

      Value: 0x00000001 (1)


      Value Name: RequirePlatformSecurityFeatures

      Value Type: REG_DWORD

      Value: 0x00000001 (1) (Secure Boot only) or 0x00000003 (3) (Secure Boot and DMA Protection)


      A Microsoft TechNet article on Credential Guard, including system requirement details, can be found at the
      following link:

      https://technet.microsoft.com/itpro/windows/keep-secure/credential-guard'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> System >> Device
      Guard >> Turn On Virtualization Based Security to "Enabled" with Platform Security Level set to "Secure Boot"
      or "Secure Boot and DMA Protection" selected.


      A Microsoft TechNet article on Credential Guard, including system requirement details, can be found at the
      following link:

      https://technet.microsoft.com/itpro/windows/keep-secure/credential-guard'
  V-278091:
    title: Windows Server 2025 Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot
      drivers identified as bad.
    severity: medium
    implementation: automated
    conditions: []
    check: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce
      "Good, unknown and bad but critical" (preventing "bad").


      If the registry value name below does not exist, this is not a finding.


      If it exists and is configured with a value of "0x00000007 (7)", this is a finding.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\


      Value Name: DriverLoadPolicy


      Value Type: REG_DWORD

      Value: 0x00000001 (1), 0x00000003 (3), or 0x00000008 (8) (or if the Value Name does not exist)


      Possible values for this setting are:

      8 - Good only

      1 - Good and unknown

      3 - Good, unknown and bad but critical

      7 - All (which includes "bad" and would be a finding)'
    fix: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization policy to enforce
      "Good, unknown and bad but critical" (preventing "bad").


      To correct this, or if a more secure setting is desired, configure the policy value for Computer Configuration
      >> Administrative Templates >> System >> Early Launch Antimalware >> Boot-Start Driver Initialization Policy
      to "Not Configured" or "Enabled" with any option other than "All" selected.'
