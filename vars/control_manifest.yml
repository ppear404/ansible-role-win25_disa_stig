  V-278131:
    title: Windows Server 2025 must have PowerShell Transcription enabled.
    severity: medium
    implementation: automated
    conditions: []
    check: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: \\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\\
      Transcription\\\n\nValue Name: EnableTranscripting\n\nValue Type: REG_DWORD\nValue: 1\n\nThe location used\
      \ for log storage must be a write-only, restricted directory (preferably a network share) that security personnel\
      \ can access. The registry value setting for \"Transcript output directory\" is set by the GPO to \"C:\\ProgramData\\\
      PS_Transcript\". That directory allows Read, Modify, and Delete access by standard (nonprivileged) user accounts.\
      \ Either a different directory that has appropriate access permissions must be configured, or the permissions\
      \ for the Transcript output directory must be configured appropriately.\n\nIf the directory used to store\
      \ the PowerShell transcription log files (Transcript output directory) permits read or modify access by nonprivileged\
      \ users, this is a finding.\n\nIf the output directory set by the GPO is preferred, the access permissions\
      \ must be revised to ensure the PowerShell Transcription log files are accessible only to Administrator and\
      \ System accounts. \n\nTo review permissions of the output directory, enter the following commands. \nOpen\
      \ \"Command Prompt (Admin)\".\n\n[Enter \"icacls\" followed by the directory configured to store PowerShell\
      \ Transcription logs:]\nicacls C:\\ProgramData\\PS_Transcript\n\nIf log files currently reside in the output\
      \ directory, issue the following:\nicacls C:\\ProgramData\\PS_Transcript\\*.*\n\nThe results must be displayed\
      \ as below:\nNT AUTHORITY\\SYSTEM:(OI)(CI)(IO)(F)\nBUILTIN\\Administrators:(OI)(CI)(IO)(F)\n*NT AUTHORITY\\\
      Authenticated Users:(OI)(CI)(WD,AD)\n*BUILTIN\\Users:(OI)(CI)(WD,AD)\n\n*Note: The standard user accounts\
      \ may differ based on the system's purpose/role and Active Directory structure.\n\nIf the directory used to\
      \ store PowerShell Transcription logs is not configured to provide Full Control access to Administrative and\
      \ System accounts while permitting write-only access for standard user accounts, this is a finding."
    fix: "Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components\
      \ >> Windows PowerShell >> \"Turn on PowerShell Transcription\" to \"Enabled\".\n\nIf a centralized (versus\
      \ local) Transcript output directory is preferred, configure the Transcript output directory to point to a\
      \ Central Log Server or another secure location to prevent user Read, Modify, and Delete access by nonprivileged\
      \ accounts.\nEnsure the directory is write-only with Full Control access by Administrator and System accounts.\n\
      \nEnter the following registry value:\nRegistry Hive: HKEY_LOCAL_MACHINE\nRegistry Path: \\SOFTWARE\\Policies\\\
      Microsoft\\Windows\\PowerShell\\Transcription\n*Value Name: OutputDirectory\nValue Type: REG_SZ (String Value)\n\
      *Note: \u201COutputDirectory\u201D value should be: \u201C[Your custom directory path (e.g., I:\\UserX_PowerShellTranscripts)]\u201D\
      \nIf the folder configured (in the registry) as the Transcript output directory is not configured to provide\
      \ Full Control access to Administrative and System accounts, while permitting WD, AD access for standard user\
      \ accounts, issue the following commands: \n\nOpen \"Command Prompt (Admin)\".\n1. If the directory configured\
      \ to store PowerShell Transcription logs does not exist:\nmkdir C:\\ProgramData\\PS_Transcript\n\n2. Assign\
      \ appropriate permissions to Administrators group and System account:\nicacls \"C:\\ProgramData\\PS_Transcript\"\
      \ /inheritance:r /grant:r \"Administrators:(OI)(CI)(F)\" /grant:r \"SYSTEM\":(OI)(CI)(F)\n\n3. Assign appropriate\
      \ permissions to user groups:\nicacls \"C:\\ProgramData\\PS_Transcript\" /grant:r \"Users\":(OI)(CI)(WD,AD)\
      \ /t /c\nicacls \"C:\\ProgramData\\PS_Transcript\" /grant:r \"Authenticated Users\":(OI)(CI)(WD,AD) /t /c"
  V-278132:
    title: Windows Server 2025 must only allow administrators responsible for the domain controller to have Administrator
      rights on the system.
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. A separate version applies to other systems.


      Review the Administrators group. Only the appropriate administrator groups or accounts responsible for administration
      of the system may be members of the group.


      Standard user accounts must not be members of the local administrator group.


      If prohibited accounts are members of the local administrators group, this is a finding.


      If the built-in Administrator account or other required administrative accounts are found on the system, this
      is not a finding.'
    fix: 'Configure the Administrators group to include only administrator groups or accounts that are responsible
      for the system.


      Remove any standard user accounts.'
  V-278133:
    title: Windows Server 2025 Kerberos user logon restrictions must be enforced.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nVerify the following\
      \ is configured in the Default Domain Policy:\n\nOpen \"Group Policy Management\".\n\nNavigate to \"Group\
      \ Policy Objects\" in the Domain being reviewed (Forest >> Domains >> Domain). \n\nRight-click the \"Default\
      \ Domain Policy\".\n\nSelect \"Edit\".\n\nNavigate to Computer Configuration >> Policies >> Windows Settings\
      \ >> Security Settings >> Account Policies >> Kerberos Policy.\n\nIf \"Enforce user logon restrictions\" is\
      \ not set to \"Enabled\", this is a finding."
    fix: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows
      Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Enforce user logon restrictions to
      "Enabled".
  V-278134:
    title: Windows Server 2025 Kerberos service ticket maximum lifetime must be limited to 600 minutes or less.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nVerify the following\
      \ is configured in the Default Domain Policy:\n\nOpen \"Group Policy Management\".\n\nNavigate to \"Group\
      \ Policy Objects\" in the Domain being reviewed (Forest >> Domains >> Domain). \n\nRight-click the \"Default\
      \ Domain Policy\".\n\nSelect \"Edit\".\n\nNavigate to Computer Configuration >> Policies >> Windows Settings\
      \ >> Security Settings >> Account Policies >> Kerberos Policy.\n\nIf the value for \"Maximum lifetime for\
      \ service ticket\" is \"0\" or greater than \"600\" minutes, this is a finding."
    fix: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows
      Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum lifetime for service ticket
      to a maximum of "600" minutes, but not "0", which equates to "Ticket doesn't expire".
  V-278135:
    title: Windows Server 2025 Kerberos user ticket lifetime must be limited to 10 hours or less.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Verify the following is configured in the Default Domain Policy:


      Open "Group Policy Management".


      Navigate to "Group Policy Objects" in the Domain being reviewed (Forest >> Domains >> Domain).


      Right-click the "Default Domain Policy".


      Select "Edit".


      Navigate to Computer Configuration >> Policies >> Windows Settings >> Security Settings >> Account Policies
      >> Kerberos Policy.


      If the value for "Maximum lifetime for user ticket" is "0" or greater than "10" hours, this is a finding.'
    fix: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows
      Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum lifetime for user ticket to
      a maximum of "10" hours but not "0", which equates to "Ticket doesn't expire".
  V-278136:
    title: Windows Server 2025 Kerberos policy user ticket renewal maximum lifetime must be limited to seven days
