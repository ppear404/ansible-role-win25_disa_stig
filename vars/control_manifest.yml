  V-278043:
    title: Windows Server 2025 permissions for the Application event log must prevent access by nonprivileged accounts.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Navigate to the Application event log file.


      The default location is the "%SystemRoot%\System32\winevt\Logs" folder. However, the logs may have been moved
      to another folder.


      If the permissions for the "Application.evtx" file are not as restrictive as the default permissions listed
      below, this is a finding:


      Eventlog - Full Control

      SYSTEM - Full Control

      Administrators - Full Control'
    fix: 'Configure the permissions on the Application event log file (Application.evtx) to prevent access by nonprivileged
      accounts. The default permissions listed below satisfy this requirement:


      Eventlog - Full Control

      SYSTEM - Full Control

      Administrators - Full Control


      The default location is the "%SystemRoot%\System32\winevt\Logs" folder.


      If the location of the logs has been changed, when adding Eventlog to the permissions, it must be entered
      as "NT Service\Eventlog".'
