      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\


      Value Name: AlwaysInstallElevated


      Type: REG_DWORD

      Value: 0x00000000 (0)'
    fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Windows Components
      >> Windows Installer >> Always install with elevated privileges to "Disabled".
  V-278122:
    title: Windows Server 2025 users must be notified if a web-based program attempts to install software.
    severity: medium
    implementation: automated
    conditions: []
    check: 'The default behavior is for Internet Explorer to warn users and select whether to allow or refuse installation
      when a web-based program attempts to install software on the system.


      If the registry value name below does not exist, this is not a finding.


      If it exists and is configured with a value of "0", this is not a finding.


      If it exists and is configured with a value of "1", this is a finding.


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Installer\


      Value Name: SafeForScripting


      Value Type: REG_DWORD

      Value: 0x00000000 (0) (or if the Value Name does not exist)'
    fix: 'The default behavior is for Internet Explorer to warn users and select whether to allow or refuse installation
      when a web-based program attempts to install software on the system.


      To correct this, configure the policy value for Computer Configuration >> Administrative Templates >> Windows
      Components >> Windows Installer >> Prevent Internet Explorer security prompt for Windows Installer scripts
      to "Not Configured" or "Disabled".'
  V-278123:
