  V-278176:
    title: The password for the krbtgt account on a domain must be reset at least every 180 days.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This requirement is applicable to domain controllers; it is not applicable for other systems. \n\nOpen\
      \ \"Windows PowerShell\".\n\nEnter \"Get-ADUser krbtgt -Property PasswordLastSet\".\n\nIf the \"PasswordLastSet\"\
      \ date is more than 180 days old, this is a finding."
    fix: 'Reset the password for the krbtgt account at least every 180 days. The password must be changed twice
      to effectively remove the password history. Changing once, waiting for replication to complete, and changing
      again reduces the risk of issues. Changing twice in rapid succession forces clients to reauthenticate (including
      application services) but is desired if a compromise is suspected.


      PowerShell scripts are available to accomplish this such as at the following link:


      https://gallery.technet.microsoft.com/Reset-the-krbtgt-account-581a9e51


      Open "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select "Advanced Features" in the "View" menu if not previously selected.


      Select the "Users" node.


      Right-click on the krbtgt account and select "Reset password".


      Enter a password that meets password complexity requirements.


      Clear the "User must change password at next logon" check box.


      The system will automatically change this to a system-generated complex password.'
  V-278177:
    title: Windows Server 2025 must only allow administrators responsible for the member server or stand-alone or
      nondomain-joined system to have Administrator rights on the system.
    severity: high
    implementation: manual
    conditions:
      - not win25_stig_is_dc
    check: 'This applies to member servers and stand-alone or nondomain-joined systems. A separate version applies
      to domain controllers.


      Open "Computer Management".


      Navigate to "Groups" under "Local Users and Groups".


      Review the local "Administrators" group.


      Only administrator groups or accounts responsible for administration of the system may be members of the group.


      For domain-joined member servers, the Domain Admins group must be replaced by a domain member server administrator
      group.


      Standard user accounts must not be members of the local Administrator group.


      If accounts that do not have responsibility for administration of the system are members of the local Administrators
      group, this is a finding.


      If the built-in Administrator account or other required administrative accounts are found on the system, this
      is not a finding.'
    fix: "Configure the local \"Administrators\" group to include only administrator groups or accounts responsible\
      \ for administration of the system.\n\nFor domain-joined member servers, replace the Domain Admins group with\
      \ a domain member server administrator group. \n\nRemove any standard user accounts."
  V-278178:
    title: Windows Server 2025 local administrator accounts must have their privileged token filtered to prevent
      elevated privileges from being used over the network on domain-joined member servers.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_domain_joined
      - not win25_stig_is_dc
      - win25_stig_enforce_remote_uac
    check: 'This applies to member servers. For domain controllers and stand-alone or nondomain-joined systems,
      this is not applicable.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry HiveHKEY_LOCAL_MACHINE

      Registry Path\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System


      Value NameLocalAccountTokenFilterPolicy


      TypeREG_DWORD

      Value: 0x00000000 (0)


      This setting may cause issues with some network scanning tools if local administrative accounts are used remotely.
      Scans must use domain accounts where possible. If a local administrative account must be used, temporarily
      enabling the privileged token by configuring the registry value to "1" may be required.'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> Apply UAC restrictions to local accounts on network logons to "Enabled".


      This policy setting requires the installation of the SecGuide custom templates included with the STIG package.
      "SecGuide.admx" and " SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
  V-278179:
    title: Windows Server 2025 local users on domain-joined member servers must not be enumerated.
