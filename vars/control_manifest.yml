  V-278080:
    title: Windows Server 2025 must prevent the display of slide shows on the lock screen.
    severity: medium
    implementation: automated
    conditions: []
    check: "Verify the registry value below: \n\nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SOFTWARE\\\
      Policies\\Microsoft\\Windows\\Personalization\\\n\nValue Name: NoLockScreenSlideshow\n\nValue Type: REG_DWORD\n\
      Value: 0x00000001 (1)\n\nIf the registry value does not exist or is not configured as specified, this is a\
      \ finding."
    fix: Configure the policy value for Computer Configuration >> Administrative Templates >> Control Panel >> Personalization
      >> Prevent enabling lock screen slide show to "Enabled".
  V-278082:
    title: Windows Server 2025 Internet Protocol version 6 (IPv6) source routing must be configured to the highest
      protection level to prevent IP source routing.
    severity: low
    implementation: automated
    conditions: []
    check: 'Verify the registry value below:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters\


      Value Name: DisableIPSourceRouting


      Type: REG_DWORD

      Value: 0x00000002 (2)


      If the registry value does not exist or is not configured as specified, this is a finding.'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS:
      (DisableIPSourceRouting IPv6) IP source routing protection level (protects against packet spoofing) to "Enabled"
      with "Highest protection, source routing is completely disabled" selected.


      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package.
      "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
  V-278083:
    title: Windows Server 2025 source routing must be configured to the highest protection level to prevent Internet
      Protocol (IP) source routing.
    severity: low
    implementation: automated
    conditions: []
    check: "If the following registry value does not exist or is not configured as specified, this is a finding:\n\
      \nRegistry Hive: HKEY_LOCAL_MACHINE \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\\
      \n\nValue Name: DisableIPSourceRouting\n\nValue Type: REG_DWORD\nValue: 0x00000002 (2)"
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MSS (Legacy) >> MSS:
      (DisableIPSourceRouting) IP source routing protection level (protects against packet spoofing) to "Enabled"
      with "Highest protection, source routing is completely disabled" selected.


      This policy setting requires the installation of the MSS-Legacy custom templates included with the STIG package.
      "MSS-Legacy.admx" and "MSS-Legacy.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
