  V-289259:
    title: Windows Server 2025 must be maintained at a supported servicing level.
    severity: medium
    implementation: manual
    conditions: []
    check: "1. Determine the system's OS version.\na. Open \"Command Prompt\".\nb. Run \"winver.exe\". The \"About\
      \ Windows\" dialog box will display the system\u2019s version and OS build. For example, \"Microsoft Windows\
      \ Server Version 25H2 (Build 26100.33296)\". This does not represent a required version. It is provided only\
      \ as an example.\nc. Record the OS numbers for the system.\n\n2. Determine Microsoft's support stance for\
      \ Windows 2025. \nMainstream support ends on 11/13/2029 and extended support ends on 11/14/2034. Visit https://learn.microsoft.com/en-us/lifecycle/products/windows-server-2025\
      \ to determine the latest guidance regarding support dates. These dates are applicable to the following editions:\
      \ Datacenter, Datacenter: Azure Edition, Essentials, Standard.\n\n3. Determine Microsoft's latest available\
      \ Windows 2025 OS version and Security Patch.\na. Access Microsoft\u2019s Lifecycle & Build History website\
      \ at https://learn.microsoft.com/en-us/windows/release-health/windows-server-release-info. \nb. Review the\
      \ Windows 2025 table (under heading of \"Windows Server release history\"). To view the table, expand heading\
      \ of \"Windows Server 2025 (OS build 26100)\". \nc. Compare the system\u2019s OS build and KB # with those\
      \ listed to determine how many (if any) newer patches are available for the system\u2019s OS version. It is\
      \ strongly recommended that the latest security patch be installed, unless there is a valid operational reason\
      \ to delay installing it.\n\nIf the end-of-support date (which includes the \"Extended Support End Date\"\
