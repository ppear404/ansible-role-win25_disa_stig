      \ Policy Objects\" in the Domain being reviewed (Forest >> Domains >> Domain).\n \nRight-click the \"Default\
      \ Domain Policy\".\n\nSelect \"Edit\".\n\nNavigate to Computer Configuration >> Policies >> Windows Settings\
      \ >> Security Settings >> Account Policies >> Kerberos Policy.\n\nIf the \"Maximum lifetime for user ticket\
      \ renewal\" is greater than \"7\" days, this is a finding."
    fix: Configure the policy value in the Default Domain Policy for Computer Configuration >> Policies >> Windows
      Settings >> Security Settings >> Account Policies >> Kerberos Policy >> Maximum lifetime for user ticket renewal
      to a maximum of "7" days or less.
  V-278137:
    title: Windows Server 2025 computer clock synchronization tolerance must be limited to five minutes or less.
    severity: medium
