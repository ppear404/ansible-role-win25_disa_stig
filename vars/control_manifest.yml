  V-285313:
    title: Windows Server 2025 networked systems must have and implement OpenSSH to protect the confidentiality
      and integrity of transmitted and received information, as well as information during preparation for transmission.
    severity: medium
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is not applicable.


      Verify that "OpenSSH" is installed with the following command:


      C:\ > Get-WindowsCapability -Online | Where-Object Name -like ''OpenSSH*''


      Name : OpenSSH.Client~~~~0.0.1.0

      State   : Installed


      Name : OpenSSH.Server~~~~0.0.1.0

      State   : Installed


      If installed, verify the service is active with the following command:


      C:\ > Get-Service sshd


      Status       Name          DisplayName

      -----            -----              -------------

      Running   sshd            OpenSSH SSH Server


      If OpenSSH is installed and the "sshd" service is not "Running", this is a finding.'
    fix: 'To install and start the OpenSSH service, run the following commands:


      C:\ > Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0


      C:\ > Start-Service sshd


      C:\ > Set-Service -Name sshd -StartupType ''Automatic'''
  V-285314:
    title: Windows Server 2025 OpenSSH must display the Standard Mandatory DoW Notice and Consent Banner before
      granting remote access to the system via an OpenSSH logon.
    severity: medium
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is not applicable.


      Verify any SSH connection to the system displays the Standard Mandatory DoW Notice and Consent Banner before
      granting access to the system.


      Check for the location of the banner file being used with the following command:


      C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*Banner''


      Banner C:\ProgramData\ssh\Banner.txt


      If "Banner" is set to "none", the line is commented out, or the line is missing, this is a finding.'
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file.


      An example configuration line is:


      Banner C:\ProgramData\ssh\Banner.txt


      Restart the OpenSSH service for the settings to take effect.'
  V-285315:
    title: Windows Server 2025 OpenSSH must accept public key authentication.
    severity: medium
    implementation: automated
    conditions: []
    check: "If OpenSSH is not installed on the system, this requirement is not applicable.\n\nIf the system administrator\
      \ demonstrates the use of an approved alternate multifactor authentication method, this requirement is not\
      \ applicable.\n\nVerify the system accepts public key encryption with the following command:\n \nC:\\ > Get-Content\
      \ \"$env:ProgramData\\ssh\\sshd_config\" | Select-String -Pattern '^\\s*PubkeyAuthentication'\n\nPubkeyAuthentication\
      \ yes\n \nIf \"PubkeyAuthentication\" is set to \"no\", the line is commented out, or the line is missing,\
      \ this is a finding."
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file:


      PubkeyAuthentication yes


      Restart the OpenSSH service for the settings to take effect.'
  V-285316:
    title: Windows Server 2025 OpenSSH must not allow blank passwords.
    severity: high
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is not applicable.


      Verify system remote access using OpenSSH prevents logging on with a blank password with the following command:


      C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*PermitEmptyPasswords''


      PermitEmptyPasswords no


      If the "PermitEmptyPasswords" keyword is set to "yes", is missing, or is commented out, this is a finding.'
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file:


      PermitEmptyPasswords no


      Restart the OpenSSH service for the settings to take effect.'
  V-285317:
    title: Windows Server 2025 OpenSSH must force a frequent session key renegotiation for SSH connections to the
      server.
    severity: medium
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is NA.

      Verify the OpenSSH server is configured to force frequent session key renegotiation with the following command:


      C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*RekeyLimit''


      RekeyLimit 1G 1h


      If "RekeyLimit" does not have a maximum data amount and maximum time defined, is missing, or is commented
      out, this is a finding.'
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file.


      An example configuration line is:


      RekeyLimit 1G 1h


      Restart the OpenSSH service for the settings to take effect.'
  V-285318:
    title: Windows Server 2025 OpenSSH must be configured so that all network connections associated with SSH traffic
      terminate after becoming unresponsive.
    severity: medium
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is not applicable.


      Verify the "ClientAliveCountMax" is set to "1" by performing the following command:


      C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*ClientAliveCountMax''


      ClientAliveCountMax 1


      If "ClientAliveCountMax" does not exist, is not set to a value of "1", or is commented out, this is a finding.'
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file:


      ClientAliveCountMax 1


      Restart the OpenSSH service for the settings to take effect.'
  V-285319:
    title: Windows Server 2025 OpenSSH must be configured so that all network connections associated with SSH traffic
      are terminated after 10 minutes of becoming unresponsive.
    severity: medium
    implementation: automated
    conditions: []
    check: 'If OpenSSH is not installed on the system, this requirement is not applicable.


      Verify the "ClientAliveInterval" variable is set to a value of "600" or less by performing the following command:


      C:\ > Get-Content "$env:ProgramData\ssh\sshd_config" | Select-String -Pattern ''^\s*ClientAliveInterval''


      ClientAliveInterval 600


      If "ClientAliveInterval" does not exist, does not have a value of "600" or less, or is commented out, this
      is a finding.'
    fix: 'To configure the system, add or modify the following line in the "$env:ProgramData/ssh/sshd_config" file.


      ClientAliveInterval 600


      Restart the OpenSSH service for the settings to take effect.'
  V-285320:
    title: The Windows Server 2025 OpenSSH configuration file must conform to minimum requirements.
    severity: medium
    implementation: automated
    conditions: []
    check: "If OpenSSH is not installed on the system, this requirement is not applicable.\n\nVerify the permissions\
      \ of the \"$env:ProgramData/ssh/sshd_config\" file with the following command:\n\nC:\\ > icacls $env:ProgramData/ssh/sshd_config\n\
      \nC:\\ProgramData\\ssh\\sshd_config  NT AUTHORITY\\SYSTEM:(F)\n                                          \
      \                      BUILTIN\\Administrators:(F)\n                                                     \
      \           NT AUTHORITY\\Authenticated Users:(RX)\n\nSuccessfully processed 1 files; Failed processing 0\
      \ files\n\nIf the \"$env:ProgramData/ssh/sshd_config\" file does not have the default permission as in the\
      \ example output, this is a finding."
    fix: 'Maintain the permissions of the "$env:ProgramData/ssh/sshd_config" file as follows:


      NT AUTHORITY\SYSTEM:(F)

      BUILTIN\Administrators:(F)

      NT AUTHORITY\Authenticated Users:(RX)'
  V-285321:
