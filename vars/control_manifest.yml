  V-278037:
    title: Windows Server 2025 maximum password age must be configured to 180 days or less.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy.


      If the value for the "Maximum password age" is greater than "180" days, this is a finding.


      If the value is set to "0" (never expires), this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "MaximumPasswordAge" is greater than "180" or equal to "0" in the file, this is a finding.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy. Set "Maximum password age" to "180" days or less (excluding "0", which is unacceptable).
  V-278038:
    title: Windows Server 2025 minimum password age must be configured to at least one day.
    severity: medium
    implementation: automated
