# Reference text contains unbreakable source URLs.
# yamllint disable rule:line-length
# SPDX-License-Identifier: MIT-0
---
win25_stig_control_manifest:
  V-277982:
    title: Windows Server 2025 must install security-relevant software updates within 30 days unless the time period
      is directed by an authoritative source (e.g., IAVM, CTOs, DTMs, STIGs).
    severity: medium
    implementation: manual
    conditions: []
    check: "Review the operating system documentation and configuration to determine if the system checks in with\
      \ a patch management system to install security-relevant software updates within a timeframe directed by an\
      \ authoritative source. \n\nIf the operating system does not install security-relevant patches within the\
      \ time period directed by the authoritative source, this is a finding."
    fix: Configure the operating system to use a patch management system to ensure security-relevant updates are
      installed within the time period directed by the authoritative source.
  V-277983:
    title: Windows Server 2025 must prohibit the use or connection of unauthorized hardware components.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Verify the operating system is configured to prohibit the use or connection of unauthorized hardware
      components.


      If the operating system is using undocumented or unapproved hardware, this is a finding.'
    fix: Configure the operating system to prohibit the use or connection of unauthorized hardware components. Remove
      any hardware that is not documented or not approved by the information system security officer (ISSO) or information
      system security manager (ISSM).
  V-277985:
    title: Windows Server 2025 users with administrative privileges must have separate accounts for administrative
      duties and normal operational tasks.
    severity: medium
    implementation: manual
    conditions: []
    check: "Verify each user with administrative privileges has been assigned a unique administrative account separate\
      \ from their standard user account. \n\nIf users with administrative privileges do not have separate accounts\
      \ for administrative functions and standard user functions, this is a finding."
    fix: Ensure each user with administrative privileges has a separate account for user duties and one for privileged
      duties.
  V-277986:
    title: Windows Server 2025 passwords for the built-in Administrator account must be changed at least every 180
      days.
    severity: medium
    implementation: manual
    conditions: []
    check: "If there are no enabled local Administrator accounts, this is not applicable.\n\nReview the password\
      \ last set date for the enabled local Administrator account.\n\nOn the standalone or domain-joined server:\n\
      \nOpen PowerShell.\n\nEnter \"Get-LocalUser | Where-Object {$_.SID -like \"*500\"} | ForEach-Object ($_.PasswordLastSet){\"\
      $($_.Name) password is: $([int]((Get-Date) - $_.PasswordLastSet).TotalDays) days old\"}\".\n\nIf the \"PasswordLastSet\"\
      \ date is greater than \"180\" days old for the local Administrator account for administering the computer,\
      \ this is a finding.\n\nVerify Windows LAPS is configured and operational.\n\nIf the system is a standalone\
      \ member server, the LAPS portion of this requirement is not applicable.\n\nNavigate to Local Computer Policy\
      \ >> Computer Configuration >> Administrative Templates >> System >> LAPS >> Password Settings >> Set to enabled.\
      \ Password Complexity, large letters + small letters + numbers + special, Password Length 14, Password Age\
      \ 180. \n\nIf not configured as shown, this is a finding.\n\nNavigate to LAPS Operational logs >> Event Viewer\
      \ >> Applications and Services Logs >> Microsoft >> Windows >> LAPS >> Operational. \n\nVerify LAPS policy\
      \ process is completing. If it is not, this is a finding."
    fix: "Change the built-in Administrator account password at least every 180 days.\n\nWindows LAPS must be used\
      \ to change the built-in Administrator account password. Domain-joined and nondomain-joined systems can configure\
      \ this to occur more frequently. LAPS will change the password every 30 days by default. \n\nOperational limitations\
      \ preventing the use of LAPS must be approved by the AO. The AO still has the overall authority to use another\
      \ equivalent capability to accomplish the check."
  V-277987:
    title: Windows Server 2025 administrative accounts must not be used with applications that access the internet,
      such as web browsers, or with potential internet sources, such as email.
    severity: high
    implementation: manual
    conditions: []
    check: "Determine whether organization policy, at a minimum, prohibits administrative accounts from using applications\
      \ that access the internet or other public-facing networks. These applications include web browsers or applications\
      \ with potential internet sources, such as email, except as necessary for local service administration.\n\n\
      The policy must define specific exceptions for local service administration. These exceptions may include\
      \ HTTP(S)-based tools that are used for the administration of the local system, services, or attached devices.\n\
      \nDetermine whether the organization uses technical means, such as allow listing via AppLocker or Software\
      \ Restriction Policies (SRPs), to prevent administrative accounts' use of browsers and email applications.\
      \ \n\nNote: Allow list tools facilitate defining rules that explicitly permit approved applications to run\
      \ while blocking all others by default.\n\nAdministrative accounts that do not have technical restrictions\
      \ to applications that access public-facing networks must be documented and approved by the information system\
      \ security officer (ISSO) or authorizing official (AO).\n\nIf administrative access to applications that access\
      \ public-facing networks is not blocked by technical means (except as approved by the AO), this is a finding."
    fix: "Establish a policy, at minimum, to prohibit administrative accounts from using applications that access\
      \ public-facing networks or the internet, such as web browsers, or applications with potential internet sources,\
      \ such as email. \n\nEnsure the policy is enforced by technical means, such as allow listing via AppLocker\
      \ or Software Restriction Policies (SRPs).\n\nDocument any exceptions to technical enforcement with the information\
      \ system security officer (ISSO)."
  V-277988:
    title: Windows Server 2025 members of the Backup Operators group must have separate accounts for backup duties
      and normal operational tasks.
    severity: medium
    implementation: manual
    conditions: []
    check: 'If no accounts are members of the Backup Operators group, this is not applicable.


      Verify users with accounts in the Backup Operators group have a separate user account for backup functions
      and for performing normal user tasks.


      If users with accounts in the Backup Operators group do not have separate accounts for backup functions and
      standard user functions, this is a finding.'
    fix: Ensure each member of the Backup Operators group has separate accounts for backup functions and standard
      user functions.
  V-277989:
    title: Windows Server 2025 manually managed application account passwords must be at least 15 characters in
      length.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Determine if manually managed application/service accounts exist. If none exist, this is not applicable.


      Verify the organization has a policy to ensure passwords for manually managed application/service accounts
      are at least 15 characters in length.


      If such a policy does not exist or has not been implemented, this is a finding.'
    fix: Establish a policy that requires application/service account passwords that are manually managed to be
      at least 15 characters in length. Ensure the policy is enforced.
  V-277990:
    title: Windows Server 2025 manually managed application account passwords must be changed at least annually
      or when a system administrator with knowledge of the password leaves the organization.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Determine if manually managed application/service accounts exist. If none exist, this is not applicable.


      If passwords for manually managed application/service accounts are not changed at least annually or when an
      administrator with knowledge of the password leaves the organization, this is a finding.


      Identify manually managed application/service accounts.


      To determine the date a password was last changed for domain controllers:


      Open PowerShell.


      Enter "Get-AdUser -Identity [application account name] -Properties PasswordLastSet | FT Name, PasswordLastSet",
      where [application account name] is the name of the manually managed application/service account.


      If the "PasswordLastSet" date is more than one year old, this is a finding.


      For member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Enter ''Net User [application account name] | Find /i "Password Last Set"'', where [application account name]
      is the name of the manually managed application/service account.


      If the "Password Last Set" date is more than one year old, this is a finding.'
    fix: 'Change passwords for manually managed application/service accounts at least annually or when an administrator
      with knowledge of the password leaves the organization.


      It is recommended that system-managed service accounts be used whenever possible.'
  V-277991:
    title: Windows Server 2025 shared user accounts must not be permitted.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Determine whether any shared accounts exist. If no shared accounts exist, this is not applicable.


      Shared accounts, such as required by an application, may be approved by the organization. This must be documented
      with the information system security officer (ISSO). Documentation must include the reason for the account,
      who has access to the account, and how the risk of using the shared account is mitigated to include monitoring
      account activity.


      If unapproved shared accounts exist, this is a finding.'
    fix: 'Remove unapproved shared accounts from the system.


      Document required shared accounts with the ISSO. Documentation must include the reason for the account, who
      has access to the account, and how the risk of using the shared account is mitigated to include monitoring
      account activity.'
  V-277992:
    title: Windows Server 2025 must employ a deny-all, permit-by-exception policy to allow the execution of authorized
      software programs.
    severity: medium
    implementation: manual
    conditions: []
    check: "Verify the operating system employs a deny-all, permit-by-exception policy to allow the execution of\
      \ authorized software programs.\n\nIf an application allowlisting program is not in use on the system, this\
      \ is a finding.\n\nConfiguration of allowlisting applications will vary by the program.\n\nAppLocker is a\
      \ allowlisting application built in to Windows Server. A deny-by-default implementation is initiated by enabling\
      \ any AppLocker rules within a category, only allowing what is specified by defined rules.\n\nIf AppLocker\
      \ is used, perform the following to view the configuration of AppLocker:\n\nOpen PowerShell.\n\nIf the AppLocker\
      \ PowerShell module has not been imported previously, execute the following first:\n\nImport-Module AppLocker\n\
      \nExecute the following command, substituting c:\\temp\\file.xml with a location and file name appropriate\
      \ for the system:\n\nGet-AppLockerPolicy -Effective -XML > c:\\temp\\file.xml\n\nThis will produce an XML\
      \ file with the effective settings that can be viewed in a browser or opened in a program such as Excel for\
      \ review.\n\nImplementation guidance for AppLocker is available in the NSA paper \"Application Whitelisting\
      \ using Microsoft AppLocker\" at the following link: \nhttps://www.iad.gov/iad/library/ia-guidance/tech-briefs/application-whitelisting-using-microsoft-applocker.cfm"
    fix: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception policy to allow
      the execution of authorized software programs.


      Configuration of allowlisting applications will vary by the program. AppLocker is a allowlisting application
      built in to Windows Server.


      If AppLocker is used, it is configured through group policy in Computer Configuration >> Windows Settings
      >> Security Settings >> Application Control Policies >> AppLocker.


      Implementation guidance for AppLocker is available in the NSA paper "Application Whitelisting using Microsoft
      AppLocker" at the following link:

      https://www.iad.gov/iad/library/ia-guidance/tech-briefs/application-whitelisting-using-microsoft-applocker.cfm'
  V-277993:
    title: Windows Server 2025 systems must have a Trusted Platform Module (TPM) enabled and ready for use.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Verify the system has a TPM and it is ready for use.


      Run "tpm.msc".


      Review the sections in the center pane.


      "Status" must indicate it has been configured with a message such as "The TPM is ready for use" or "The TPM
      is on and ownership has been taken".


      TPM Manufacturer Information - Specific Version = 2.0


      If a TPM is not found or is not ready for use, this is a finding.'
    fix: 'Ensure systems have a TPM that is configured for use. (Version 2.0 supports Credential Guard.)


      The TPM must be enabled in the firmware.


      Run "tpm.msc" for configuration options in Windows.'
  V-277995:
    title: Windows Server 2025 must use an antivirus program.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_manage_defender
    check: 'Verify an antivirus solution is installed on the system. The antivirus solution may be bundled with
      an approved host-based security solution.


      If there is no antivirus solution installed on the system, this is a finding.


      Verify if Microsoft Defender antivirus is in use or enabled:


      Open PowerShell.


      Enter "get-service | where {$_.DisplayName -Like "*Defender*"} | Select Status,DisplayName"


      Verify if third-party antivirus is in use or enabled:


      Open PowerShell.


      Enter "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select Status,DisplayName


      Enter "get-service | where {$_.DisplayName -Like "*symantec*"} | Select Status,DisplayName'
    fix: 'If no antivirus software is in use, install Microsoft Defender or third-party antivirus.


      Open PowerShell.


      Enter "Install-WindowsFeature -Name Windows-Defender".


      For third-party antivirus, install per antivirus instructions and disable Windows Defender.


      Open PowerShell.


      Enter "Uninstall-WindowsFeature -Name Windows-Defender".'
  V-277996:
    title: Windows Server 2025 must have a host-based intrusion detection and prevention service (IDPS) installed.
    severity: medium
    implementation: manual
    conditions: []
    check: "Determine whether there is a host based intrusion detection and prevention service on each server. \n\
      \nThis requirement is not applicable on a system that has the role as the IDPS. However, this exception must\
      \ be documented with the information system security officer (ISSO).\n\nIf a host-based IDPS is not installed\
      \ on the system, this is a finding."
    fix: Install a host-based IDPS on each server.
  V-277997:
    title: Windows Server 2025 local volumes must use a format that supports New Technology File System (NTFS) attributes.
    severity: high
    implementation: manual
    conditions: []
    check: "Open \"Computer Management\".\n\nSelect \"Disk Management\" under \"Storage\".\n\nFor each local volume,\
      \ if the file system does not indicate \"NTFS\", this is a finding.\n\n\"ReFS\" (Resilient File System) is\
      \ also acceptable and would not be a finding. \n\n\"CSVFS\" (Cluster Shared Volumes File Systems) is also\
      \ acceptable and would not be a finding. \n\nThis does not apply to system partitions such the Recovery and\
      \ EFI System Partition."
    fix: Format volumes to use NTFS, ReFS, or CSVFS.
  V-277998:
    title: Windows Server 2025 permissions for the system drive root directory (usually C:\) must conform to minimum
      requirements.
    severity: medium
    implementation: manual
    conditions: []
    check: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions
      apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


      Review the permissions for the system drive''s root directory (usually C:\). Nonprivileged groups such as
      Users or Authenticated Users must not have greater than "Read & execute" permissions except where noted as
      defaults. Individual accounts must not be used to assign permissions.


      If permissions are not as restrictive as the default permissions listed below, this is a finding.


      Viewing in File Explorer:


      View the Properties of the system drive''s root directory.


      Select the "Security" tab, and then click "Advanced".


      Default permissions:

      C:\

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      SYSTEM - Full control - This folder, subfolders, and files

      Administrators - Full control - This folder, subfolders, and files

      Users - Read & execute - This folder, subfolders, and files

      Users - Create folders/append data - This folder and subfolders  (Note: "Authenticated Users" is acceptable)

      Users - Create files/write data - Subfolders only   (Note: "Authenticated Users" is acceptable)

      CREATOR OWNER - Full Control - Subfolders and files only


      Alternately, use icacls:


      1. Open "Command Prompt (Admin)".

      2. Enter "icacls" followed by the directory:


      "icacls c:\"


      The following results must be displayed:


      c:\

      NT AUTHORITY\SYSTEM:(OI)(CI)(F)

      BUILTIN\Administrators:(OI)(CI)(F)

      BUILTIN\Users:(OI)(CI)(RX)

      BUILTIN\Users:(CI)(AD)

      BUILTIN\Users:(CI)(IO)(WD)

      *NT AUTHORITY\Authenticated Users:(OI)(CI)(IO)(M)

      *NT AUTHORITY\Authenticated Users:(AD)

      CREATOR OWNER:(OI)(CI)(IO)(F)

      **Mandatory Label\High Mandatory Level:(OI)(NP)(IO)(NW)

      Successfully processed 1 files; Failed processing 0 files


      * - Some system''s configurations managed via a CSP (e.g. via Azure) may display minor differences (more restrictive)
      for Users or Authenticated Users.

      ** - Mandatory Label is part of the system access control list (SACL) and may not display for some (nonstandard)
      implementations.'
    fix: 'Maintain the default permissions for the system drive''s root directory and configure the Security Option
      "Network access: Let Everyone permissions apply to anonymous users" to "Disabled" (WN25-SO-000240).


      Default Permissions

      C:\

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      SYSTEM - Full control - This folder, subfolders, and files

      Administrators - Full control - This folder, subfolders, and files

      Users - Read & execute - This folder, subfolders, and files   (or Authenticated Users)

      Users - Create folders/append data - This folder and subfolders   (or Authenticated Users)

      Users - Create files/write data - Subfolders only

      CREATOR OWNER - Full Control - Subfolders and files only'
  V-277999:
    title: Windows Server 2025 permissions for program file directories must conform to minimum requirements.
    severity: medium
    implementation: manual
    conditions: []
    check: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions
      apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


      Review the permissions for the program file directories (Program Files and Program Files [x86]). Nonprivileged
      groups such as Users or Authenticated Users must not have greater than "Read & execute" permissions. Individual
      accounts must not be used to assign permissions.


      If permissions are not as restrictive as the default permissions listed below, this is a finding.


      Viewing in File Explorer:


      For each folder, view the Properties.


      Select the "Security" tab, and then click "Advanced".


      Default permissions:

      \Program Files and \Program Files (x86)

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder only

      Administrators - Full control - Subfolders and files only

      Users - Read & execute - This folder, subfolders and files

      CREATOR OWNER - Full control - Subfolders and files only

      ALL APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files

      ALL RESTRICTED APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files


      Alternately, use icacls:


      Open a Command prompt (admin).


      Enter "icacls" followed by the directory:


      ''icacls "c:\program files"''

      ''icacls "c:\program files (x86)"''


      The following results must be displayed for each when entered:


      c:\program files (c:\program files (x86))

      NT SERVICE\TrustedInstaller:(F)

      NT SERVICE\TrustedInstaller:(CI)(IO)(F)

      NT AUTHORITY\SYSTEM:(M)

      NT AUTHORITY\SYSTEM:(OI)(CI)(IO)(F)

      BUILTIN\Administrators:(M)

      BUILTIN\Administrators:(OI)(CI)(IO)(F)

      BUILTIN\Users:(RX)

      BUILTIN\Users:(OI)(CI)(IO)(GR,GE)

      CREATOR OWNER:(OI)(CI)(IO)(F)

      APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(RX)

      APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)

      APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(RX)

      APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)

      Successfully processed 1 files; Failed processing 0 files'
    fix: 'Maintain the default permissions for the program file directories and configure the Security Option "Network
      access: Let Everyone permissions apply to anonymous users" to "Disabled" (WN25-SO-000240).


      Default permissions:

      \Program Files and \Program Files (x86)

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder only

      Administrators - Full control - Subfolders and files only

      Users - Read & execute - This folder, subfolders, and files

      CREATOR OWNER - Full control - Subfolders and files only

      ALL APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files

      ALL RESTRICTED APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files'
  V-278000:
    title: Windows Server 2025 permissions for the Windows installation directory must conform to minimum requirements.
    severity: medium
    implementation: manual
    conditions: []
    check: 'The default permissions are adequate when the Security Option "Network access: Let Everyone permissions
      apply to anonymous users" is set to "Disabled" (WN25-SO-000240).


      Review the permissions for the Windows installation directory (usually C:\Windows). Nonprivileged groups such
      as Users or Authenticated Users must not have greater than "Read & execute" permissions. Individual accounts
      must not be used to assign permissions.


      If permissions are not as restrictive as the default permissions listed below, this is a finding:


      Viewing in File Explorer:


      For each folder, view the Properties.


      Select the "Security" tab, and then click "Advanced".


      Default permissions:

      \Windows

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder only

      Administrators - Full control - Subfolders and files only

      Users - Read & execute - This folder, subfolders, and files

      CREATOR OWNER - Full control - Subfolders and files only

      ALL APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files

      ALL RESTRICTED APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files


      Alternately, use icacls:


      Open a Command prompt (admin).


      Enter "icacls" followed by the directory:


      "icacls c:\windows"


      The following results must be displayed for each when entered:


      c:\windows

      NT SERVICE\TrustedInstaller:(F)

      NT SERVICE\TrustedInstaller:(CI)(IO)(F)

      NT AUTHORITY\SYSTEM:(M)

      NT AUTHORITY\SYSTEM:(OI)(CI)(IO)(F)

      BUILTIN\Administrators:(M)

      BUILTIN\Administrators:(OI)(CI)(IO)(F)

      BUILTIN\Users:(RX)

      BUILTIN\Users:(OI)(CI)(IO)(GR,GE)

      CREATOR OWNER:(OI)(CI)(IO)(F)

      APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(RX)

      APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)

      APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(RX)

      APPLICATION PACKAGE AUTHORITY\ALL RESTRICTED APPLICATION PACKAGES:(OI)(CI)(IO)(GR,GE)

      Successfully processed 1 files; Failed processing 0 files'
    fix: 'Maintain the default file ACLs and configure the Security Option "Network access: Let Everyone permissions
      apply to anonymous users" to "Disabled" (WN25-SO-000240).


      Default permissions:

      Type - "Allow" for all

      Inherited from - "None" for all


      Principal - Access - Applies to


      TrustedInstaller - Full control - This folder and subfolders

      SYSTEM - Modify - This folder only

      SYSTEM - Full control - Subfolders and files only

      Administrators - Modify - This folder only

      Administrators - Full control - Subfolders and files only

      Users - Read & execute - This folder, subfolders, and files

      CREATOR OWNER - Full control - Subfolders and files only

      ALL APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files

      ALL RESTRICTED APPLICATION PACKAGES - Read & execute - This folder, subfolders, and files'
  V-278001:
    title: Windows Server 2025 default permissions for the HKEY_LOCAL_MACHINE registry hive must be maintained.
    severity: medium
    implementation: manual
    conditions: []
    check: "Review the registry permissions for the keys of the HKEY_LOCAL_MACHINE hive noted below.\n\nIf any nonprivileged\
      \ groups such as Everyone, Users, or Authenticated Users have greater than Read permission, this is a finding.\n\
      \nIf permissions are not as restrictive as the default permissions listed below, this is a finding.\n\nNote:\
      \ \u201CAuthenticated Users\u201D is default on Domain Controllers, and \u201CUsers\u201D is default on member\
      \ servers and stand-alone servers. Revise expected response based on system context.\n\nRun \"Regedit\".\n\
      \nRight-click on the registry areas noted below.\n\nSelect \"Permissions\" and then click \"Advanced\".\n\n\
      HKEY_LOCAL_MACHINE\\SECURITY\n\nType - \"Allow\" for all\nInherited from - \"None\" for all\nPrincipal - Access\
      \ - Applies to\nSYSTEM - Full Control - This key and subkeys\nAdministrators - Special - This key and subkeys\n\
      \nHKEY_LOCAL_MACHINE\\SOFTWARE\n\nType - \"Allow\" for all\nInherited from - \"None\" for all\nPrincipal -\
      \ Access - Applies to\nUsers - Read - This key and subkeys\nAdministrators - Full Control - This key and subkeys\n\
      SYSTEM - Full Control - This key and subkeys\nCREATOR OWNER - Full Control - This key and subkeys\nALL APPLICATION\
      \ PACKAGES - Read - This key and subkeys\n\nHKEY_LOCAL_MACHINE\\SYSTEM\n\nType - \"Allow\" for all\nInherited\
      \ from - \"None\" for all\nPrincipal - Access - Applies to\nAuthenticated Users - Read - This key and subkeys\n\
      Administrators - Full Control - This key and subkeys\nSYSTEM - Full Control - This key and subkeys\nCREATOR\
      \ OWNER - Full Control - This key and Subkeys\nALL APPLICATION PACKAGES - Read - This key and subkeys\nServer\
      \ Operators - Read - This Key and subkeys (Domain controllers only)\n\nOther examples under the noted keys\
      \ may also be sampled. In some instances, nonprivileged groups have greater than Read permission.\n\nMicrosoft\
      \ has given Read permission to the SOFTWARE and SYSTEM registry keys in Windows Server 2025 to the following\
      \ SID. This is not a finding.\n\nS-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681\n\
      \nIf the defaults have not been changed, this is not a finding."
    fix: "Maintain the default permissions for the HKEY_LOCAL_MACHINE registry hive.\n\nThe default permissions\
      \ of the higher-level keys are noted below:\n\nNote: \u201CAuthenticated Users\u201D is default on Domain\
      \ Controllers, and \u201CUsers\u201D is default on member servers and stand-alone servers. Revise expected\
      \ response based on system context.\n\nHKEY_LOCAL_MACHINE\\SECURITY\n\nType - \"Allow\" for all\nInherited\
      \ from - \"None\" for all\nPrincipal - Access - Applies to\nSYSTEM - Full Control - This key and subkeys\n\
      Administrators - Special - This key and subkeys\n\nHKEY_LOCAL_MACHINE\\SOFTWARE\n\nType - \"Allow\" for all\n\
      Inherited from - \"None\" for all\nPrincipal - Access - Applies to\nUsers - Read - This key and subkeys\n\
      Administrators - Full Control - This key and subkeys\nSYSTEM - Full Control - This key and subkeys\nCREATOR\
      \ OWNER - Full Control - This key and subkeys\nALL APPLICATION PACKAGES - Read - This key and subkeys\n\n\
      HKEY_LOCAL_MACHINE\\SYSTEM\n\nType - \"Allow\" for all\nInherited from - \"None\" for all\nPrincipal - Access\
      \ - Applies to\nAuthenticated Users - Read - This key and subkeys\nAdministrators - Full Control - This key\
      \ and subkeys\nSYSTEM - Full Control - This key and subkeys\nCREATOR OWNER - Full Control - This key and subkeys\n\
      ALL APPLICATION PACKAGES - Read - This key and subkeys\nServer Operators - Read - This Key and subkeys (Domain\
      \ controllers only)\n\nMicrosoft has given Read permission to the SOFTWARE and SYSTEM registry keys in Windows\
      \ Server 2025 to the following SID:\n\nS-1-15-3-1024-1065365936-1281604716-3511738428-1654721687-432734479-3232135806-4053264122-3456934681"
  V-278002:
    title: Windows Server 2025 nonadministrative accounts or groups must only have print permissions on printer
      shares.
    severity: low
    implementation: manual
    conditions: []
    check: "Open \"Printers & scanners\" in \"Settings\".\n\nIf there are no printers configured, this is not applicable.\
      \ (Exclude Microsoft Print to PDF and Microsoft XPS Document Writer, which do not support sharing.)\n\nFor\
      \ each printer:\n\nSelect the printer and \"Manage\". \n\nSelect \"Printer Properties\". \n\nSelect the \"\
      Sharing\" tab. \n\nIf \"Share this printer\" is checked, select the \"Security\" tab.\n\nIf any standard user\
      \ accounts or groups have permissions other than \"Print\", this is a finding.\n\nThe default is for the \"\
      Everyone\" group to be given Print permission.\n\n\"All APPLICATION PACKAGES\" and \"CREATOR OWNER\" are not\
      \ standard user accounts."
    fix: Configure the permissions on shared printers to restrict standard users to only have Print permissions.
  V-278003:
    title: Outdated or unused accounts on Windows Server 2025 must be removed or disabled.
    severity: medium
    implementation: manual
    conditions: []
    check: "Open Windows PowerShell.\n\nDomain Controllers:\n\nEnter \"Search-ADAccount -AccountInactive -UsersOnly\
      \ -TimeSpan 35.00:00:00\".\n\nThis will return accounts that have not been logged on to for 35 days, along\
      \ with various attributes such as the Enabled status and LastLogonDate.\n\nMember servers and standalone or\
      \ nondomain-joined systems:\n\nCopy or enter the lines below to the PowerShell window and enter. (Entering\
      \ twice may be required.)\_\n\n([ADSI]('WinNT://{0}' -f $env:COMPUTERNAME)).Children | Where { $_.SchemaClassName\
      \ -eq 'user' } | ForEach {\n $user = ([ADSI]$_.Path)\n $lastLogin = $user.Properties.LastLogin.Value\n $enabled\
      \ = ($user.Properties.UserFlags.Value -band 0x2) -ne 0x2\n if ($lastLogin -eq $null) {\n $lastLogin = 'Never'\n\
      \ }\n Write-Host $user.Name $lastLogin $enabled \n}\n\nThis will return a list of local accounts with the\
      \ account name, last logon, and if the account is enabled (True/False).\nFor example: User1 10/31/2025 5:49:56\
      \ AM True\n\nReview the list of accounts returned by the above queries to determine the finding validity for\
      \ each account reported.\n\nExclude the following accounts:\n- Built-in administrator account (Renamed, SID\
      \ ending in 500).\n- Built-in guest account (Renamed, Disabled, SID ending in 501).\n- Application accounts.\n\
      \nIf any enabled accounts have not been logged on to within the past 35 days, this is a finding.\n\nInactive\
      \ accounts that have been reviewed and deemed to be required must be documented with the information system\
      \ security officer (ISSO)."
    fix: Regularly review accounts to determine if they are still active. Remove or disable accounts that have not
      been used in the last 35 days.
  V-278004:
    title: Windows Server 2025 accounts must require passwords.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_is_dc
      - win25_stig_manage_local_password_flags
    check: 'Review the password required status for enabled user accounts.


      Open PowerShell.


      Domain Controllers:


      Enter "Get-Aduser -Filter * -Properties Passwordnotrequired |FT Name, Passwordnotrequired, Enabled".


      Exclude disabled accounts (e.g., DefaultAccount, Guest) and Trusted Domain Objects (TDOs).


      If "Passwordnotrequired" is "True" or blank for any enabled user account, this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordRequired=False and LocalAccount=True" |
      FT Name, PasswordRequired, Disabled, LocalAccount''.


      Exclude disabled accounts (e.g., DefaultAccount, Guest).


      If any enabled user accounts are returned with a "PasswordRequired" status of "False", this is a finding.'
    fix: 'Configure all enabled accounts to require passwords.


      The password required flag can be set by entering the following on a command line: "Net user [username] /passwordreq:yes",
      substituting [username] with the name of the user account.'
  V-278005:
    title: Windows Server 2025 passwords must be configured to expire.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_is_dc
      - win25_stig_manage_local_password_flags
    check: 'Review the password never expires status for enabled user accounts.


      Open PowerShell.


      Domain Controllers:


      Enter "Search-ADAccount -PasswordNeverExpires -UsersOnly | FT Name, PasswordNeverExpires, Enabled".


      Exclude application accounts, disabled accounts (e.g., DefaultAccount, Guest), and the krbtgt account.


      If any enabled user accounts are returned with a "PasswordNeverExpires" status of "True", this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Enter ''Get-CimInstance -Class Win32_Useraccount -Filter "PasswordExpires=False and LocalAccount=True" | FT
      Name, PasswordExpires, Disabled, LocalAccount''.


      Exclude application accounts and disabled accounts (e.g., DefaultAccount, Guest).


      If any enabled user accounts are returned with a "PasswordExpires" status of "False", this is a finding.'
    fix: 'Configure all enabled user account passwords to expire.


      Uncheck "Password never expires" for all enabled user accounts in Active Directory Users and Computers for
      domain accounts and Users in Computer Management for member servers and stand-alone or nondomain-joined systems.
      Document any exceptions with the information system security officer (ISSO).'
  V-278006:
    title: Windows Server 2025 system files must be monitored for unauthorized changes.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Determine whether the system is monitored for unauthorized changes to system files (e.g., *.exe, *.bat,
      *.com, *.cmd, and *.dll) against a baseline on a weekly basis.


      If system files are not monitored for unauthorized changes, this is a finding.


      An approved and properly configured solution will contain both a list of baselines that includes all system
      file locations and a file comparison task that is scheduled to run at least weekly.'
    fix: Monitor the system for unauthorized changes to system files (e.g., *.exe, *.bat, *.com, *.cmd, and *.dll)
      against a baseline on a weekly basis. This can be done with the use of various monitoring tools.
  V-278007:
    title: Windows Server 2025 nonsystem-created file shares must limit access to groups that require it.
    severity: medium
    implementation: manual
    conditions: []
    check: 'If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system, this is not applicable.
      (System-created shares will display a message that it has been shared for administrative purposes when "Properties"
      is selected.)


      Run "Computer Management".


      Navigate to System Tools >> Shared Folders >> Shares.


      Right-click any nonsystem-created shares.


      Select "Properties".


      Select the "Share Permissions" tab.


      If the file shares have not been configured to restrict permissions to the specific groups or accounts that
      require access, this is a finding.


      Select the "Security" tab.


      If the permissions have not been configured to restrict permissions to the specific groups or accounts that
      require access, this is a finding.'
    fix: 'If a nonsystem-created share is required on a system, configure the share and NTFS permissions to limit
      access to the specific groups or accounts that require it.


      Remove any unnecessary nonsystem-created shares.'
  V-278008:
    title: Windows Server 2025 must have software certificate installation files removed.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Search all drives for *.p12 and *.pfx files.


      If any files with these extensions exist, this is a finding.


      This does not apply to server-based applications that have a requirement for .p12 or .pfx certificate files.
      Some applications create files with extensions of .p12 or .pfx that are not certificate installation files.
      Removal of noncertificate installation files from systems is not required. These must be documented with the
      information system security officer (ISSO).'
    fix: 'Remove any certificate installation files (*.p12 and *.pfx) found on a system.


      Note: This does not apply to server-based applications that have a requirement for .p12 or .pfx certificate
      files.'
  V-278009:
    title: Windows Server 2025 systems requiring data-at-rest protections must employ cryptographic mechanisms to
      prevent unauthorized disclosure and modification of the information at rest.
    severity: high
    implementation: manual
    conditions: []
    check: 'Note: If there is a documented and approved reason to omit data-at-rest encryption at the operating
      system level, such as encryption provided by a hypervisor or a disk storage array in a virtualized environment,
      this requirement is not applicable.


      Verify systems that require additional protections due to factors such as inadequate physical protection or
      sensitivity of the data employ encryption to protect the confidentiality and integrity of all information
      at rest.


      If there is no evidence that persistent user-generated data and operating system-specific configuration data
      are encrypted, this is a finding.'
    fix: 'Configure systems that require data-at-rest protections to employ encryption to protect the confidentiality
      and integrity of all persistent user-generated data and operating system-specific configuration data.


      The encryption method implemented must use FIPS-compliant algorithms.'
  V-278010:
    title: Windows Server 2025 must implement protection methods such as TLS, encrypted VPNs, or IPsec if the data
      owner has a strict requirement for ensuring data integrity and confidentiality is maintained at every step
      of the data transfer and handling process.
    severity: medium
    implementation: manual
    conditions: []
    check: 'If the data owner has a strict requirement for ensuring data integrity and confidentiality is maintained
      at every step of the data transfer and handling process, verify protection methods such as TLS, encrypted
      VPNs, or IPsec have been implemented.


      If protection methods have not been implemented, this is a finding.'
    fix: Configure protection methods such as TLS, encrypted VPNs, or IPsec when the data owner has a strict requirement
      for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling
      process.
  V-278011:
    title: Windows Server 2025 must have the roles and features required by the system documented.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Required roles and features will vary based on the function of the individual system.


      Roles and features specifically required to be disabled per the STIG are identified in separate requirements.


      Run the following Powershell command to determine installed features:


      Get-WindowsFeature | Where-Object {$_. installstate -eq "installed"} | Format-List Displayname, Name, Featuretype


      If the organization has not documented the roles and features displayed as required for the system, this is
      a finding.'
    fix: Document the roles and features required for the system to operate. Uninstall any that are not required.
  V-278012:
    title: Windows Server 2025 must have a host-based firewall installed and enabled.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Determine if a host-based firewall is installed and enabled on the system.


      If a host-based firewall is not installed and enabled on the system, this is a finding.


      The configuration requirements will be determined by the applicable firewall STIG.'
    fix: Install and enable a host-based firewall on the system.
  V-278013:
    title: Windows Server 2025 must automatically remove or disable temporary user accounts after 72 hours.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Review temporary user accounts for expiration dates.


      Determine if temporary user accounts are used and identify any that exist. If none exist, this is not applicable.


      Domain Controllers:


      Open PowerShell.


      Enter "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate".


      If "AccountExpirationDate" has not been defined within 72 hours for any temporary user account, this is a
      finding.


      Member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Run "Net user [username]", where [username] is the name of the temporary user account.


      If "Account expires" has not been defined within 72 hours for any temporary user account, this is a finding.'
    fix: 'Configure temporary user accounts to automatically expire within 72 hours.


      Domain accounts can be configured with an account expiration date, under "Account" properties.


      Local accounts can be configured to expire with the command "Net user [username] /expires:[mm/dd/yyyy]", where
      [username] is the name of the temporary user account.


      Delete any temporary user accounts that are no longer necessary.'
  V-278014:
    title: Windows Server 2025 must automatically remove or disable emergency accounts after the crisis is resolved
      or within 72 hours.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Determine if emergency administrator accounts are used and identify any that exist. If none exist, this
      is not applicable.


      If emergency administrator accounts cannot be configured with an expiration date due to an ongoing crisis,
      the accounts must be disabled or removed when the crisis is resolved.


      If emergency administrator accounts have not been configured with an expiration date or have not been disabled
      or removed following the resolution of a crisis, this is a finding.


      Domain Controllers:


      Open PowerShell.


      Enter "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate".


      If "AccountExpirationDate" has been defined and is not within 72 hours for an emergency administrator account,
      this is a finding.


      Member servers and stand-alone or nondomain-joined systems:


      Open command prompt.


      Run "Net user [username]", where [username] is the name of the emergency account.


      If "Account expires" has been defined and is not within 72 hours for an emergency administrator account, this
      is a finding.'
    fix: 'Remove emergency administrator accounts after a crisis has been resolved or configure the accounts to
      automatically expire within 72 hours.


      Domain accounts can be configured with an account expiration date, under "Account" properties.


      Local accounts can be configured to expire with the command "Net user [username] /expires:[mm/dd/yyyy]", where
      [username] is the name of the temporary user account.'
  V-278015:
    title: Windows Server 2025 must not have the Fax Server role installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Fax".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the "Fax Server" role.


      Start Server Manager.


      Select the server with the role.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Fax Server" on the "Roles" page.


      Click "Next" and "Remove" as prompted.'
  V-278016:
    title: Windows Server 2025 must not have the Microsoft FTP service installed unless required by the organization.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_ftp_required
    check: 'If the server has the role of an FTP server, this is not applicable.


      Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Web-Ftp-Service".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.


      If the system has the role of an FTP server, this must be documented with the information system security
      officer (ISSO).'
    fix: 'Uninstall the "FTP Server" role.


      Start Server Manager.


      Select the server with the role.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "FTP Server" under "Web Server (IIS)" on the "Roles" page.


      Click "Next" and "Remove" as prompted.'
  V-278017:
    title: Windows Server 2025 must not have Wi-Fi enabled unless required by the organization.
    severity: medium
    implementation: manual
    conditions: []
    check: "Open PowerShell or a Command prompt.\n\nType \" ipconfig /all\".\n\nReview the resulting display for\
      \ existence of  a Wireless LAN or Wi-Fi connection.\n\nIf none are listed, issue the following command in\
      \ PowerShell:\n\nGet-NetAdapter | Where-Object PhysicalMediaType -eq \"Native 802.11\"\t\n\nNote: This command\
      \ isolates the search to physical Wi-Fi adapters using the standard 802.11 wireless specification and does\
      \ not rely on the adapter still having its default system name. \n\nIf there is a Wi-Fi or Wireless LAN connection\
      \ listed, this is a finding."
    fix: 'Validate the site documentation to ensure the approval of use for Wi-Fi server connections.


      If the connection (s) have not been approved, go to "Settings" then "Network and Internet" and remove/disable
      the Wi-Fi adapter. Any Wi-Fi connections listed or in use must be documented and approved by the information
      system security officer (ISSO) or authorizing official (AO).'
  V-278018:
    title: Windows Server 2025 must not have Bluetooth enabled unless required by the organization.
    severity: medium
    implementation: automated
    conditions:
      - not win25_stig_bluetooth_required
    check: In the Windows search bar, type "Services". In the Services "Name" column look for the "Bluetooth Support
      Service". If this is set to "automatic", this is a finding.
    fix: Validate the site documentation to ensure the approval of use for Wi-Fi server connections. If the connection
      has not been approved, type "Services" in the Windows search bar. In the Services "Name " column, look for
      the "Bluetooth Support Service" and set this to "Disabled". Any Bluetooth devices listed or in use must be
      documented and approved by the information system security officer (ISSO) or authorizing official (AO).
  V-278019:
    title: Windows Server 2025 must not have the Peer Name Resolution Protocol installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq PNRP".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the "Peer Name Resolution Protocol" feature.


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Peer Name Resolution Protocol" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278020:
    title: Windows Server 2025 must not have Simple TCP/IP Services installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Simple-TCPIP".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the "Simple TCP/IP Services" feature.


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Simple TCP/IP Services" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278021:
    title: Windows Server 2025 must not have the Telnet Client installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq Telnet-Client".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the "Telnet Client" feature.


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Telnet Client" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278022:
    title: Windows Server 2025 must not have the TFTP Client installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq TFTP-Client".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the "TFTP Client" feature.


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "TFTP Client" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278023:
    title: Windows Server 2025 must not have the Server Message Block (SMB) v1 protocol installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Different methods are available to disable SMBv1 on Windows Server 2025. This is the preferred method,
      however if WN25-00-000390 and WN25-00-000400 are configured, this is not applicable.


      Open Windows PowerShell with elevated privileges (run as administrator).


      Enter "Get-WindowsFeature -Name FS-SMB1".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the SMBv1 protocol.


      Open Windows PowerShell with elevated privileges (run as administrator).


      Enter "Uninstall-WindowsFeature -Name FS-SMB1 -Restart".

      (Omit the Restart parameter if an immediate restart of the system cannot be done.)


      Alternately:


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "SMB 1.0/CIFS File Sharing Support" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278024:
    title: Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB server.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Different methods are available to disable SMBv1 on Windows Server 2025, if WN25-00-000380 is configured,
      this is not applicable.


      If the following registry value does not exist or is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\


      Value Name: SMB1


      Type: REG_DWORD

      Value: 0x00000000 (0)'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> Configure SMBv1 Server to "Disabled".


      Restart the system for the change to take effect.


      This policy setting requires the installation of the SecGuide custom templates included with the STIG package.
      "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
  V-278025:
    title: Windows Server 2025 must have the Server Message Block (SMB) v1 protocol disabled on the SMB client.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Different methods are available to disable SMBv1 on Windows Server 2025, if WN25-00-000380 is configured,
      this is not applicable.


      If the following registry value is not configured as specified, this is a finding:


      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Services\mrxsmb10\


      Value Name: Start


      Type: REG_DWORD

      Value: 0x00000004 (4)'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Templates >> MS Security Guide
      >> Configure SMBv1 client driver to "Enabled" with "Disable driver (recommended)" selected for "Configure
      MrxSmb10 driver".


      Restart the system for the changes to take effect.


      This policy setting requires the installation of the SecGuide custom templates included with the STIG package.
      "SecGuide.admx" and "SecGuide.adml" must be copied to the \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US
      directories respectively.'
  V-278026:
    title: Windows Server 2025 must not have Windows PowerShell 2.0 installed.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Open PowerShell.


      Enter "Get-WindowsFeature | Where Name -eq PowerShell-v2".


      If "Installed State" is "Installed", this is a finding.


      An Installed State of "Available" or "Removed" is not a finding.'
    fix: 'Uninstall the Windows PowerShell 2.0 Engine.


      Start Server Manager.


      Select the server with the feature.


      Scroll down to "ROLES AND FEATURES" in the right pane.


      Select "Remove Roles and Features" from the drop-down "TASKS" list.


      Select the appropriate server on the "Server Selection" page and click "Next".


      Deselect "Windows PowerShell 2.0 Engine" under "Windows PowerShell" on the "Features" page.


      Click "Next" and "Remove" as prompted.'
  V-278027:
    title: Windows Server 2025 FTP servers must be configured to prevent anonymous logons.
    severity: medium
    implementation: manual
    conditions: []
    check: 'If FTP is not installed on the system, this is not applicable.


      Open Internet Information Services (IIS) Manager.


      Select the server.


      Double-click "FTP Authentication".


      If the "Anonymous Authentication" status is "Enabled", this is a finding.'
    fix: 'Configure the FTP service to prevent anonymous logons.


      Open IIS Manager.


      Select the server.


      Double-click "FTP Authentication".


      Select "Anonymous Authentication".


      Select "Disabled" under "Actions".'
  V-278028:
    title: Windows Server 2025 FTP servers must be configured to prevent access to the system drive.
    severity: medium
    implementation: manual
    conditions: []
    check: 'If FTP is not installed on the system, this is not applicable.


      Open Internet Information Services (IIS) Manager.


      Select "Sites" under the server name.


      For any sites with a Binding that lists FTP, right-click the site and select "Explore".


      If the site is not defined to a specific folder for shared FTP resources, this is a finding.


      If the site includes any system areas such as root of the drive, Program Files, or Windows directories, this
      is a finding.'
    fix: Configure the FTP sites to allow access only to specific FTP shared resources. Do not allow access to other
      areas of the system.
  V-278029:
    title: The Windows Server 2025 time service must synchronize with an appropriate DoW time source.
    severity: low
    implementation: manual
    conditions: []
    check: 'Review the Windows time service configuration.


      Open an elevated command prompt (run as administrator).


      Enter "W32tm /query /configuration".


      Domain-joined systems (excluding the domain controller with the PDC emulator role):


      If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding.


      Other systems:


      If systems are configured with a "Type" of "NTP", including stand-alone or nondomain-joined systems and the
      domain controller with the PDC Emulator role, and do not have a DoW time server defined for "NTPServer", this
      is a finding.


      To determine the domain controller with the PDC Emulator role:


      Open PowerShell.


      Enter "Get-ADDomain | FT PDCEmulator".'
    fix: 'Configure the system to synchronize time with an appropriate DoW time source.


      Domain-joined systems use NT5DS to synchronize time from other systems in the domain by default.


      If needed, configure the system to point to an authorized time server by setting the policy value for Computer
      Configuration >> Administrative Templates >> System >> Windows Time Service >> Time Providers. Change "Configure
      Windows NTP Client" to "Enabled" and configure the "NtpServer" field to point to an appropriate DoW time server.


      The US Naval Observatory operates stratum one-time servers, identified at https://www.usno.navy.mil/USNO/time/ntp/DOD-customers.
      Time synchronization will occur through a hierarchy of time servers down to the local level. Clients and lower-level
      servers will synchronize with an authorized time server in the hierarchy.'
  V-278030:
    title: Windows Server 2025 must have orphaned security identifiers (SIDs) removed from user rights.
    severity: medium
    implementation: manual
    conditions: []
    check: "Review the effective User Rights setting in Local Group Policy Editor.\n\nRun gpedit.msc.\n\nNavigate\
      \ to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local Policies\
      \ >> User Rights Assignment.\n\nReview each User Right listed for any unresolved SIDs to determine whether\
      \ they are valid, such as due to being temporarily disconnected from the domain. (Unresolved SIDs have the\
      \ format that begins with \"*S-1-\".)\n\nIf any unresolved SIDs exist and are not for currently valid accounts\
      \ or groups, this is a finding.\n\nFor server core installations, run the following command:\n\nSecedit /export\
      \ /areas USER_RIGHTS /cfg c:\\path\\UserRights.txt\n\nThe results in the file identify user right assignments\
      \ by SID instead of group name. Review the SIDs to determine which are unidentified. A list of typical SIDs\\\
      Groups is below; search Microsoft for articles on well-known SIDs for others. \n\nIf any unresolved SIDs exist\
      \ and are not for currently valid accounts or groups, this is a finding.\n\nSID - Group\nS-1-5-11 - Authenticated\
      \ Users\nS-1-5-113 - Local account\nS-1-5-114 - Local account and member of Administrators group\nS-1-5-19\
      \ - Local Service\nS-1-5-20 - Network Service\nS-1-5-32-544 - Administrators\nS-1-5-32-546 - Guests\nS-1-5-6\
      \ - Service\nS-1-5-9 - Enterprise Domain Controllers\nS-1-5-domain-512 - Domain Admins\nS-1-5-root domain-519\
      \ - Enterprise Admins\nS-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420 - NT Service\\WdiServiceHost"
    fix: Remove any unresolved SIDs found in User Rights assignments that are determined to not be for currently
      valid accounts or groups by removing the accounts or groups from the appropriate group policy.
  V-278031:
    title: Windows Server 2025 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured
      to run in UEFI mode, not Legacy BIOS.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Devices that have UEFI firmware must run in UEFI mode.


      Verify the system firmware is configured to run in UEFI mode, not Legacy BIOS.


      Run "System Information".


      Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.'
    fix: Configure UEFI firmware to run in UEFI mode, not Legacy BIOS mode.
  V-278032:
    title: Windows Server 2025 must have Secure Boot enabled.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Devices that have UEFI firmware must have Secure Boot enabled.


      Run "System Information".


      Under "System Summary", if "Secure Boot State" does not display "On", this is a finding.


      On server core installations, run the following PowerShell command:


      Confirm-SecureBootUEFI


      If a value of "True" is not returned, this is a finding.'
    fix: Enable Secure Boot in the system firmware.
  V-278033:
    title: Windows Server 2025 account lockout duration must be configured to 15 minutes or greater.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy.


      If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "LockoutDuration" is less than "15" (excluding "0") in the file, this is a finding.


      Configuring this to "0", requiring an administrator to unlock the account, is more restrictive and is not
      a finding.'
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy. Set "Account lockout duration" to "15" minutes or greater.


      A value of "0" is also acceptable, requiring an administrator to unlock the account.'
  V-278034:
    title: Windows Server 2025 must have the number of allowed bad logon attempts configured to three or less.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy.


      If the "Account lockout threshold" is "0" or more than "3" attempts, this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "LockoutBadCount" equals "0" or is greater than "3" in the file, this is a finding.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy. Set "Account lockout threshold" to "3" or fewer invalid logon attempts
      (excluding "0", which is unacceptable).
  V-278035:
    title: Windows Server 2025 must have the period of time before the bad logon counter is reset configured to
      15 minutes or greater.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy.


      If the "Reset account lockout counter after" value is less than "15" minutes, this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "ResetLockoutCount" is less than "15" in the file, this is a finding.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Account Lockout Policy. Set "Reset account lockout counter after" to at least "15" minutes.
  V-278036:
