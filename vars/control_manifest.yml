  V-278240:
    title: Windows Server 2025 must preserve zone information when saving attachments.
    severity: medium
    implementation: manual
    conditions: []
    check: 'Note: This Check must be performed for each interactive user profile on the system.


      The default behavior is for Windows to mark file attachments with their zone information.


      If the registry Value Name below does not exist, this is not a finding.


      If it exists and is configured with a value of "2", this is not a finding.


      If it exists and is configured with a value of "1", this is a finding.


      Registry Hive: HKEY_CURRENT_USER

      Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\


      Value Name: SaveZoneInformation


      Value Type: REG_DWORD

      Value: 0x00000002 (2) (or if the Value Name does not exist)


      Note: This requirement is applicable to profiles for interactive logins. It is not applicable for Service
      accounts.


      To determine the system''s enabled user profiles:

      Run "PowerShell" as an administrator.


      Execute the following command:

      Get-LocalUser | Where-Object {$_.Enabled -eq $true}  '
    fix: 'The default behavior is for Windows to mark file attachments with their zone information.


      To correct this, for each user profile on the system configure the policy value for User Configuration >>
      Administrative Templates >> Windows Components >> Attachment Manager >> Do not preserve zone information in
      file attachments to "Not Configured" or "Disabled".'
  V-278241:
    title: The Windows Server 2025 "Access Credential Manager as a trusted caller" user right must not be assigned
      to any groups or accounts.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment.


      If any accounts or groups are granted the "Access Credential Manager as a trusted caller" user right, this
      is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs are granted the "SeTrustedCredManAccessPrivilege" user right, this is a finding.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment >> Access Credential Manager as a trusted caller to be defined but containing
      no entries (blank).
  V-278242:
    title: The Windows Server 2025 "Act as part of the operating system" user right must not be assigned to any
      groups or accounts.
    severity: high
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment.


      If any accounts or groups (to include administrators), are granted the "Act as part of the operating system"
      user right, this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs are granted the "SeTcbPrivilege" user right, this is a finding.


      If an application requires this user right, this is not a finding.


      Vendor documentation must support the requirement for having the user right.


      The requirement must be documented with the information system security officer (ISSO).


      The application account must meet requirements for application account passwords, such as length (WN25-00-000050)
      and required frequency of changes (WN25-00-000060).


      Passwords for accounts with this user right must be protected as highly privileged accounts.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment >> Act as part of the operating system to be defined but containing no
      entries (blank).
