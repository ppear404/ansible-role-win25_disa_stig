  V-278039:
    title: Windows Server 2025 must have the built-in Windows password complexity policy enabled.
    severity: medium
    implementation: automated
    conditions: []
    check: 'Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy.


      If the value for "Password must meet complexity requirements" is not set to "Enabled", this is a finding.


      For server core installations, run the following command:


      Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt


      If "PasswordComplexity" equals "0" in the file, this is a finding.


      Note: If an external password filter is in use that enforces all four character types and requires this setting
      to be set to "Disabled", this would not be considered a finding. If this setting does not affect the use of
      an external password filter, it must be enabled for fallback purposes.'
    fix: Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Account
      Policies >> Password Policy. Set the value for "Password must meet complexity requirements" to "Enabled".
  V-278040:
    title: Windows Server 2025 reversible password encryption must be disabled.
