  V-278173:
    title: Windows Server 2025 must be configured for name-based strong mappings for certificates.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. This is not applicable for member servers.


      Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Administrative Template >> System >> KDC >>
      Allow name-based strong mappings for certificates.


      If "Allow name-based strong mappings for certificates" is not "Enabled", this is a finding.'
    fix: 'Configure the policy value for Computer Configuration >> Administrative Template >> System >> KDC >> Allow
      name-based strong mappings for certificates to "Enabled".


      The policy must contain exactly one certificate thumbprint per rule, with each rule represented as a tuple.
      Thumbprints must be unique and cannot be repeated in multiple rules. The sections of each tuple that are separated
      by semi-colons must be in the stated order, while the fields separated by commas can be in any order. The
      rules themselves are separated by new lines.'
