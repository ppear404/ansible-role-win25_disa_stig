  V-278159:
    title: Windows Server 2025 domain controllers must have a PKI server certificate.
    severity: medium
    implementation: assessed
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Run "MMC".


      Select "Add/Remove Snap-in" from the "File" menu.


      Select "Certificates" in the left pane, and then click "Add >".


      Select "Computer Account", and then click "Next".


      Select the appropriate option for "Select the computer you want this snap-in to manage", and then click "Finish".


      Click "OK".


      Select and expand the "Certificates (Local Computer)" entry in the left pane.


      Select and expand the "Personal" entry in the left pane.


      Select the "Certificates" entry in the left pane.


      If no certificate for the domain controller exists in the right pane, this is a finding.'
    fix: Obtain a server certificate for the domain controller.
  V-278160:
    title: Windows Server 2025 domain Controller PKI certificates must be issued by the DoW PKI or an approved External
      Certificate Authority (ECA).
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nRun \"MMC\".\n\nSelect\
      \ \"Add/Remove Snap-in\" from the \"File\" menu.\n\nSelect \"Certificates\" in the left pane, and then click\
      \ \"Add >\".\n\nSelect \"Computer Account\", and then click \"Next\".\n\nSelect the appropriate option for\
      \ \"Select the computer you want this snap-in to manage\", and then click \"Finish\".\n\nClick \"OK\".\n\n\
      Select and expand the \"Certificates (Local Computer)\" entry in the left pane.\n\nSelect and expand the \"\
      Personal\" entry in the left pane.\n\nSelect the \"Certificates\" entry in the left pane.\n\nIn the right\
      \ pane, examine the \"Issued By\" field for the certificate to determine the issuing CA.\n\nIf the \"Issued\
      \ By\" field of the PKI certificate being used by the domain controller does not indicate the issuing CA is\
      \ part of the DoW PKI or an approved ECA, this is a finding.\n\nIf the certificates in use are issued by a\
      \ CA authorized by the Component's CIO, this is a CAT II finding.\n\nThere are multiple sources from which\
      \ lists of valid DoW CAs and approved ECAs can be obtained: \n\nThe Global Directory Service (GDS) website\
      \ provides an online source. The address for this site is https://crl.gds.disa.mil.\n\nDoW Public Key Enablement\
      \ (PKE) Engineering Support maintains the InstallRoot utility to manage DoW supported root certificates on\
      \ Windows computers, which includes a list of authorized CAs. The utility package can be downloaded from the\
      \ PKI and PKE Tools page on Cyber Exchange:\nhttps://www.cyber.mil/pki-pke/tools-configuration-files"
    fix: Obtain a server certificate for the domain controller issued by the DoW PKI or an approved ECA.
  V-278161:
    title: Windows Server 2025 PKI certificates associated with user accounts must be issued by a DoW PKI or an
      approved External Certificate Authority (ECA).
    severity: high
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Review user account mappings to PKI certificates.


      Open PowerShell.


      Enter "Get-ADUser -Filter * | FT Name, UserPrincipalName, Enabled".


      Exclude disabled accounts (e.g., DefaultAccount, Guest) and the krbtgt account.


      If the User Principal Name (UPN) is not in the format of an individual''s identifier for the certificate type
      and for the appropriate domain suffix, this is a finding.


      For standard NIPRNet certificates, the individual''s identifier is in the format of an Electronic Data Interchange
      - Personnel Identifier (EDI-PI).


      Alt Tokens and other certificates may use a different UPN format than the EDI-PI, which vary by organization.
      Verified these with the organization.


      NIPRNet example:


      Name - User Principal Name

      User1 - 1234567890@mil


      Refer to the PKE documentation for other network domain suffixes.


      If the mappings are to certificates issued by a CA authorized by the Component''s CIO, this is a CAT II finding.'
    fix: Map user accounts to PKI certificates using the appropriate UPN for the network. Refer to the PKE documentation
      for details.
  V-278162:
    title: Windows Server 2025 Active Directory (AD) user accounts, including administrators, must be configured
      to require the use of a common access card (CAC), Personal Identity Verification (PIV)-compliant hardware
      token, or Alternate Logon Token (ALT) for user authentication.
    severity: medium
    implementation: manual
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Open PowerShell.


      Enter the following:


      "Get-ADUser -Filter {(Enabled -eq $True) -and (SmartcardLogonRequired -eq $False)} | FT Name"

      ("DistinguishedName" may be substituted for "Name" for more detailed output.)


      If any user accounts, including administrators, are listed, this is a finding.


      Alternately:


      To view sample accounts in "Active Directory Users and Computers" (available from various menus or run "dsa.msc"):


      Select the Organizational Unit (OU) where the user accounts are located. (By default, this is the Users node;
      however, accounts may be under other organization-defined OUs.)


      Right-click the sample user account and select "Properties".


      Select the "Account" tab.


      If any user accounts, including administrators, do not have "Smart card is required for interactive logon"
      checked in the "Account Options" area, this is a finding.'
    fix: 'Configure all user accounts, including administrator accounts, in AD to enable the option "Smart card
      is required for interactive logon".


      Run "Active Directory Users and Computers" (available from various menus or run "dsa.msc").


      Select the OU where the user accounts are located. (By default, this is the Users node; however, accounts
      may be under other organization-defined OUs.)


      Right-click the user account and select "Properties".


      Select the "Account" tab.


      Check "Smart card is required for interactive logon" in the "Account Options" area.'
  V-278163:
    title: Windows Server 2025 domain controllers must require LDAP access signing.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nIf the following registry\
      \ value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE\
      \ \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters\\\n\nValue Name: LDAPServerEnforceIntegrity\n\
      \nValue Type: REG_DWORD\nValue: 0x00000001 (1)\n\nNote: This LDAPServerEnforceIntegrity registry key explicitly\
      \ overrides the legacy LDAPServerIntegrity key used in Windows Server 2022 and older. If this enforcement\
      \ key is present and enabled, LDAP signing is strictly required regardless of the older policy setting."
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> Domain controller: LDAP server signing requirements Enforcement to "Not Configured"
      or "Enabled".


      Note: For the Windows Server 2025 security policy "Domain controller: LDAP server signing requirements Enforcement",
      configuring the setting to "Not Configured" (Default) or "Enabled" results in the same behavior.'
  V-278164:
    title: Windows Server 2025 domain controllers must be configured to allow reset of machine account passwords.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_is_dc
    check: "This applies to domain controllers. It is not applicable for other systems.\n\nIf the following registry\
      \ value does not exist or is not configured as specified, this is a finding:\n\nRegistry Hive: HKEY_LOCAL_MACHINE\
      \ \nRegistry Path: \\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters\\\n\nValue Name: RefusePasswordChange\n\
      \nValue Type: REG_DWORD\nValue: 0x00000000 (0)"
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> Security Options >> Domain controller: Refuse machine account password changes to "Disabled".'
  V-278165:
    title: The Windows Server 2025 "Access this computer from the network" user right must only be assigned to the
      Administrators, Authenticated Users, and Enterprise Domain Controllers groups on domain controllers.
    severity: medium
    implementation: automated
    conditions:
      - win25_stig_is_dc
    check: 'This applies to domain controllers. It is not applicable for other systems.


      Verify the effective setting in Local Group Policy Editor.


      Run gpedit.msc.


      Navigate to Local Computer Policy >> Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment.


      If any accounts or groups other than the following are granted the "Access this computer from the network"
      right, this is a finding:

      - Administrators.

      - Authenticated Users.

      - Enterprise Domain Controllers.


      For server core installations, run the following command:


      Secedit /Export /Areas User_Rights /cfg c:\path\filename.txt


      Review the text file.


      If any SIDs other than the following are granted the "SeNetworkLogonRight" user right, this is a finding.


      S-1-5-32-544 (Administrators)

      S-1-5-11 (Authenticated Users)

      S-1-5-9 (Enterprise Domain Controllers)


      If an application requires this user right, this is not a finding.


      Vendor documentation must support the requirement for having the user right.


      The requirement must be documented with the information system security officer (ISSO).


      The application account must meet requirements for application account passwords, such as length (WN25-00-000050)
      and required frequency of changes (WN25-00-000060).'
    fix: 'Configure the policy value for Computer Configuration >> Windows Settings >> Security Settings >> Local
      Policies >> User Rights Assignment >> Access this computer from the network to include only the following
      accounts or groups:

      - Administrators.

      - Authenticated Users.

      - Enterprise Domain Controllers.'
